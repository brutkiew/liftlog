<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>LiftLog</title>
<style>
  :root{
    /* surfaces — deep indigo-charcoal, not plain black */
    --bg-0:#0A0C13; --bg-1:#141826; --bg-2:#1D2333; --bg-3:#262E42;
    --stroke:rgba(150,165,255,.13); --stroke-soft:rgba(150,165,255,.05);
    /* liquid glass — one material system (v9.0): translucent fill over the aurora,
       backdrop blur + saturation, a specular top edge and a soft inner shade at the
       bottom, so every surface reads as a pane of glass with light hitting its rim */
    --glass:rgba(26,32,53,.55); --glass-2:rgba(31,38,62,.60);
    --glass-stroke:rgba(165,180,255,.17);
    --glass-blur:blur(22px) saturate(1.7);
    --spec:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(8,10,18,.30);
    /* text */
    --text-1:#F4F5F7; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.38);
    /* accent + semantic */
    --accent:#2CE08B; --accent-hi:#7CF5AE; --accent-lo:#17B9A0; --accent2:#8B7CF6;
    --grad:linear-gradient(135deg,#17B9A0,#2CE08B 55%,#7CF5AE);
    --grad2:linear-gradient(135deg,#17B9A0,#3ECFB2 35%,#8B7CF6);
    --accent-dim:rgba(44,224,139,.14);
    --good:#30D158; --warn:#FFD60A; --bad:#FF453A; --info:#64D2FF;
    /* geometry & motion — bigger, concentric radii, the iOS-glass silhouette */
    --r-card:20px; --r-el:14px;
    --ease:cubic-bezier(.16,1,.3,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:radial-gradient(130% 50% at 50% -10%,rgba(88,108,232,.28),transparent 60%),var(--bg-0)}
  body{color:var(--text-1);background:transparent;min-height:100vh;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  /* aurora */
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
  body::before{width:540px;height:540px;top:-160px;left:-150px;
    background:radial-gradient(circle,rgba(23,185,160,.46),transparent 65%)}
  body::after{width:600px;height:600px;bottom:-210px;right:-170px;
    background:radial-gradient(circle,rgba(139,124,246,.42),transparent 65%)}
  @media (prefers-reduced-motion:no-preference){
    body::before{animation:drift1 26s ease-in-out infinite alternate}
    body::after{animation:drift2 32s ease-in-out infinite alternate}
    @keyframes drift1{to{transform:translate(80px,60px) scale(1.15)}}
    @keyframes drift2{to{transform:translate(-70px,-80px) scale(1.1)}}
  }
  main::before{content:"";position:fixed;z-index:-1;width:440px;height:440px;border-radius:50%;
    filter:blur(100px);pointer-events:none;top:30%;right:-180px;
    background:radial-gradient(circle,rgba(255,123,172,.28),transparent 65%)}
  @media (prefers-reduced-motion:no-preference){
    main::before{animation:drift3 38s ease-in-out infinite alternate}
    @keyframes drift3{to{transform:translate(-70px,70px) scale(1.12)}}
  }
  .num{font-variant-numeric:tabular-nums}
  .ic{vertical-align:-4px}
  .grad-ink{background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gold-ink{background:linear-gradient(135deg,#FFB020,#FFD60A 60%,#FFF0A8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;
    box-shadow:0 0 6px 0 currentColor}
  .gdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .tint{position:relative;overflow:hidden}
  .tint::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(130% 100% at 18% 0%,var(--tint),transparent 55%)}
  /* ===== chrome ===== */
  #topbar{position:sticky;top:0;z-index:5;
    background:rgba(14,17,30,.55);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
    border-bottom:1px solid rgba(165,180,255,.14);
    padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:9px}
  #topbar .mark{color:var(--accent);display:flex}
  #topbar h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
  #topbar .date{margin-left:auto;color:var(--text-3);font-size:13px;font-weight:500}
  main{max-width:480px;margin:0 auto;padding:16px 20px 24px}
  h2{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
    margin:24px 2px 12px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--grad2)}
  /* the tab bar floats as a detached glass capsule — the iOS-26 signature — with content
     scrolling underneath it */
  #tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;
    max-width:456px;margin:0 auto;
    background:rgba(24,29,50,.60);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);
    border:1px solid rgba(165,180,255,.20);border-radius:30px;display:flex;
    padding:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.13), 0 18px 44px rgba(0,0,0,.5)}
  #tabs button{flex:1;background:none;border:none;color:var(--text-3);font-size:10.5px;
    font-weight:600;padding:8px 0 5px;letter-spacing:.03em;border-radius:23px;
    transition:transform .35s var(--ease),background .3s}
  #tabs button:active{transform:scale(.94)}
  #tabs button .ic{display:block;margin:0 auto 3px}
  #tabs button.on{color:var(--text-1);background:var(--accent-dim)}
  #tabs button.on .ic{color:var(--accent)}
  /* each tab owns a hue */
  #tabs button[data-tab="history"].on{background:rgba(90,167,240,.14)}
  #tabs button[data-tab="history"].on .ic{color:#5AA7F0}
  #tabs button[data-tab="trends"].on{background:rgba(139,124,246,.15)}
  #tabs button[data-tab="trends"].on .ic{color:#A99BFF}
  #tabs button[data-tab="coach"].on{background:rgba(255,107,107,.13)}
  #tabs button[data-tab="coach"].on .ic{color:#FF6B6B}
  #tabs button[data-tab="more"].on{background:rgba(255,176,32,.12)}
  #tabs button[data-tab="more"].on .ic{color:#FFB020}
  /* ===== cards ===== */
  .card{background:linear-gradient(180deg,var(--glass-2),var(--glass));
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-stroke);border-radius:var(--r-card);
    padding:18px;margin-bottom:12px;transition:transform .35s var(--ease);
    box-shadow:var(--spec), 0 10px 30px rgba(0,0,0,.25)}
  .card.tap{cursor:pointer}
  .card.tap:active{transform:scale(.97)}
  .hero{border:1px solid transparent;
    background:linear-gradient(180deg,rgba(33,41,66,.66),rgba(21,26,45,.60)) padding-box,
      linear-gradient(135deg,rgba(44,224,139,.55),rgba(139,124,246,.5)) border-box;
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 36px rgba(23,185,160,.10)}
  .hint{color:var(--text-2);font-size:13px;line-height:1.45}
  .cap{color:var(--text-3);font-size:13px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .stat{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .stat small,.xl small{font-weight:600;color:var(--text-2);letter-spacing:0}
  .stat small{font-size:13px}
  .xl{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .xl small{font-size:16px}
  .up{color:var(--good)} .dn{color:var(--bad)} .fl{color:var(--text-3)} .wr{color:var(--warn)}
  /* ===== controls ===== */
  button{font:inherit;color:var(--text-1);background:rgba(255,255,255,.07);border:1px solid var(--glass-stroke);
    border-radius:var(--r-el);padding:10px 14px;cursor:pointer;touch-action:manipulation;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .35s var(--ease),background .2s}
  button:active{transform:scale(.96)}
  button.primary{background:var(--grad);border:none;color:#0A0B0D;font-weight:700;
    box-shadow:0 6px 22px rgba(44,224,139,.28), inset 0 1px 0 rgba(255,255,255,.40)}
  button.big{width:100%;padding:15px;font-size:15px;border-radius:var(--r-el);letter-spacing:.01em}
  button.small{padding:6px 12px;font-size:13px;border-radius:10px;font-weight:550}
  button.ghost{background:none;border:none;color:var(--text-2);padding:6px 8px;font-size:15px}
  button.danger{color:var(--bad)}
  button.link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px}
  /* bare / in-chrome buttons carry no specular edge — only real glass chips do */
  button.ghost,button.link,.snum,.xname,.xrow,.qbtn,#tabs button,.seg button,.addset{box-shadow:none}
  input,select,textarea{font:inherit;font-size:16px;color:var(--text-1);background:rgba(255,255,255,.055);
    border:1px solid var(--glass-stroke);border-radius:var(--r-el);padding:10px 12px;width:100%;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-lo);
    box-shadow:0 0 0 3px rgba(44,224,139,.13)}
  .rowline{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  .btnrow button{flex:1}
  .grid2{display:flex;gap:12px}
  .grid2 .card{flex:1;margin-bottom:0}
  /* entrance stagger */
  @media (prefers-reduced-motion:no-preference){
    .stagger>*{animation:rise .5s var(--ease) backwards}
    .stagger>:nth-child(1){animation-delay:.03s}.stagger>:nth-child(2){animation-delay:.09s}
    .stagger>:nth-child(3){animation-delay:.15s}.stagger>:nth-child(4){animation-delay:.21s}
    .stagger>:nth-child(5){animation-delay:.27s}.stagger>:nth-child(6){animation-delay:.33s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    .ring-fg{animation:ringIn 1.1s var(--ease) .2s backwards}
    @keyframes ringIn{from{stroke-dashoffset:326.7}}
  }
  .ring-fg{filter:drop-shadow(0 0 9px rgba(44,224,139,.5))}
  /* ===== home ===== */
  .today-name{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
  .preview{color:var(--text-2);font-size:13px;line-height:1.65;margin-bottom:14px}
  .checkin-grid{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .checkin-grid label{flex:1 1 calc(50% - 5px)}
  .checkin-grid .lbl{display:block;margin-bottom:6px}
  .checkin-grid input{text-align:center;font-size:17px;font-weight:600}
  .ok-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:1px}
  .ring-wrap{position:relative;width:96px;height:96px;margin:6px auto 2px}
  .ring-wrap svg{width:100%;height:100%}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center .num{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1}
  .ring-center .cap{font-size:10px;margin-top:2px}
  .wkstrip{display:flex;gap:5px;margin-top:12px}
  .wkstrip .day{flex:1;text-align:center}
  .wkstrip .well{height:26px;border-radius:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
  .wkstrip .well i{position:absolute;inset:0;background:var(--grad);border-radius:6px}
  .wkstrip .well.rest::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--text-3)}
  .wkstrip .dl{font-size:9.5px;color:var(--text-3);font-weight:600;margin-top:4px;letter-spacing:.05em}
  .spark{margin-top:10px;display:block}
  /* ===== workout ===== */
  #sessbar{position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:4;
    background:rgba(14,17,30,.55);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--stroke);
    margin:0 -20px 14px;padding-left:14px;padding-right:14px}
  #sessbar .t{font-size:13px;color:var(--text-3)}
  #sessbar b{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
  .xcard{padding:14px 15px 15px}
  .xhead{display:flex;align-items:center;gap:7px}
  .xname{background:none;border:none;color:var(--text-1);font-size:15px;font-weight:650;padding:4px 0;
    text-align:left;flex:1;min-width:0;letter-spacing:-.01em}
  .xname .tgt{color:var(--text-3);font-weight:500;font-size:12px}
  .chip{flex:none;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.07);
    border:1px solid var(--glass-stroke);border-radius:999px;padding:4px 11px;font-weight:600}
  .chip.sug{color:var(--accent);border-color:rgba(44,224,139,.4);background:var(--accent-dim)}
  .chip.stall{color:var(--warn);border-color:rgba(255,214,10,.35);background:rgba(255,214,10,.08)}
  .xnote{color:var(--text-2);font-size:12.5px;margin-top:3px;font-style:italic}
  .cols,.srow{display:grid;grid-template-columns:34px 1fr 74px 62px 46px;gap:8px;align-items:center}
  .cols{margin-top:12px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;
    text-align:center;font-weight:600}
  .srow{margin-top:7px}
  .snum{width:34px;height:42px;border-radius:10px;background:none;border:1px solid var(--stroke);
    color:var(--text-3);font-size:13px;padding:0;font-weight:700}
  .srow.warm .snum{color:var(--warn);border-color:rgba(255,214,10,.4)}
  .srow.pdel .snum{color:#FF6B6B;border-color:rgba(255,107,107,.55)}
  .srow.pdel input,.srow.pdel .prev{opacity:.35}
  .prev{text-align:center;color:var(--text-3);font-size:13px;overflow:hidden;white-space:nowrap}
  .srow input{height:46px;text-align:center;padding:4px;font-size:17px;font-weight:650;border-radius:10px}
  .srow input::placeholder{color:var(--text-3);font-weight:500}
  .chk{width:46px;height:46px;border-radius:12px;color:var(--text-3);padding:0;display:flex;align-items:center;justify-content:center}
  .srow.done .chk{background:var(--accent);border-color:transparent;color:#0A0B0D}
  .srow.done input{border-color:transparent;background:var(--accent-dim)}
  .addset{margin-top:12px;width:100%;color:var(--text-3);border-style:dashed;background:none;padding:9px;font-size:13.5px;font-weight:550}
  .setbtns{display:flex;gap:8px;margin-top:12px}
  .setbtns .addset{margin-top:0;width:auto;flex:1.2;white-space:nowrap;padding:9px 4px}
  .setbtns .addset:first-child{flex:1.6}
  /* supersets — linked cards share a violet spine + letter chip */
  .xcard.ssg{border-left:3px solid rgba(169,155,255,.7)}
  /* pick-a-partner mode: candidate cards glow dashed violet, the source card holds solid */
  .xcard.sspick{outline:2px dashed rgba(169,155,255,.55);outline-offset:-2px;cursor:pointer}
  .xcard.sssrc{outline:2px solid rgba(169,155,255,.75);outline-offset:-2px}
  .sschip{flex:none;font-size:10.5px;font-weight:700;color:#A99BFF;background:rgba(139,124,246,.16);
    border:1px solid rgba(139,124,246,.28);border-radius:6px;padding:2px 6px;margin-right:2px}
  /* collapsed exercise card */
  .xmin{padding:0}
  .xminrow{display:flex;align-items:stretch}
  .grip{display:flex;align-items:center;padding:0 3px 0 12px;color:var(--text-3);
    touch-action:none;cursor:grab;flex:none}
  .xhead .grip{padding:0 2px 0 0;margin-left:-4px}
  .xcard.dragging{opacity:.92;transform:scale(1.02);box-shadow:0 14px 40px rgba(0,0,0,.5);
    border-color:rgba(44,224,139,.45);position:relative;z-index:5}
  .xrow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:none;
    padding:14px 15px 14px 8px;text-align:left;border-radius:var(--r-card)}
  .xrow .xn{font-size:14.5px;font-weight:650;letter-spacing:-.01em;flex:none;max-width:54%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xrow .xsum{flex:1;min-width:0;text-align:right;color:var(--text-3);font-size:12.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xrow .xsum b{color:var(--text-2);font-weight:600}
  .xmin.alldone{border-color:rgba(44,224,139,.28)}
  .xmin.alldone .xn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--good);margin-right:7px;vertical-align:2px}
  /* This session / Last time tabs */
  .stabs{display:flex;gap:6px;margin-top:12px}
  .stabs button{flex:none;padding:4px 12px;font-size:12px;border-radius:999px;color:var(--text-3);font-weight:600}
  .stabs button.on{color:var(--accent);border-color:rgba(44,224,139,.4);background:var(--accent-dim)}
  .lastrow{display:flex;gap:10px;font-size:13px;margin-top:9px;color:var(--text-2);align-items:baseline}
  .lastrow .ld{width:56px;color:var(--text-3);flex:none;font-size:12px}
  /* no check-off mode: drop the check column */
  body.nochk .cols,body.nochk .srow{grid-template-columns:34px 1fr 84px 72px}
  /* session score badge */
  .badge.sc{font-weight:700;border:none;color:#0A0B0D}
  .sc.gA{background:var(--accent)} .sc.gB{background:var(--info)}
  .sc.gC{background:var(--warn)} .sc.gD{background:var(--bad);color:#fff}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
    z-index:7;display:none;align-items:center;gap:6px;
    background:rgba(21,26,45,.68);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
    border:1px solid rgba(44,224,139,.5);border-radius:999px;padding:7px 9px 7px 17px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 16px 48px rgba(0,0,0,.55)}
  #timer.show{display:flex}
  #timer.flash{animation:tflash .5s 3}
  @keyframes tflash{50%{background:rgba(44,224,139,.75)}}
  #timer .tt{font-size:20px;font-weight:800;min-width:56px;letter-spacing:-.01em}
  #timer .tex{font-size:12px;color:var(--text-2);max-width:92px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #timer button{padding:6px 11px;font-size:13px;border-radius:999px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));
    z-index:9;background:rgba(35,42,68,.78);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
    border:1px solid var(--glass-stroke);color:var(--text-1);
    border-radius:16px;padding:12px 18px;font-size:14px;display:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 16px 48px rgba(0,0,0,.55);max-width:90vw}
  #toast.show{display:block;animation:tin .3s var(--ease)}
  @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
  /* ===== history ===== */
  .h-head{display:flex;align-items:center;gap:8px;cursor:pointer}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .badge{font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.07);border:1px solid var(--glass-stroke);
    border-radius:999px;padding:2px 9px;font-weight:550}
  .badge.pr{color:#0A0B0D;background:var(--warn);border:none;font-weight:700}
  .h-body{display:none;margin-top:12px;border-top:1px solid var(--stroke-soft);padding-top:10px}
  .open .h-body{display:block}
  .h-body p{font-size:13.5px;margin:4px 0;color:var(--text-2)}
  .h-body p b{color:var(--text-1);font-weight:600}
  .banner{border-color:rgba(255,214,10,.3)}
  /* ===== trends ===== */

  shoulders:[[/lateral|side.?raise/,"delt_side"],[/rear|reverse|face.?pull/,"delt_rear"],[/press|front|arnold|upright/,"delt_front"]],
  triceps:[[/overhead|skull|french|behind/,"tri_long"],[/push.?down|kick.?back|press|dip|extension/,"tri_lat"]],
  biceps:[[/hammer|brachialis|reverse|neutral/,"bi_brach"],[/curl/,"bi_curl"]],
  back:[[/row|shrug|rear.?delt/,"back_mid"],[/pull.?down|pull.?up|pull.?over|chin|straight.?arm|lat/,"back_lat"]],
  quads:[[/extension|sissy/,"quad_iso"],[/squat|press|lunge|step.?up|split/,"quad_comp"]],
  hamstrings:[[/curl/,"ham_curl"],[/deadlift|rdl|hinge|good.?morning|hyper|pull.?through|back.?ext/,"ham_hinge"]],
  calves:[[/seat/,"calf_seat"],[/calf|raise/,"calf_stand"]],
  abs:[[/crunch|sit.?up|roll.?out|pallof|twist|plank/,"abs_crunch"],[/raise|hanging|toes|v.?up/,"abs_low"]],

const normEx = s => String(s).toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/)
  .map(w => w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0,-1) : w)
  .filter(Boolean);
function classifyCustom(name, g){
  const toks = normEx(name);
  let base = null, bScore = 0;
  for (const [id, ex] of Object.entries(EX)){
    if (ex.g !== g) continue;
    const et = normEx(ex.n).filter(w => !/^(db|dumbbell|barbell|bb|ez|bar)$/.test(w));
    if (et.length && et.every(w => toks.includes(w)) && et.length > bScore){ base = id; bScore = et.length; }
  }
  let sub = base ? EX[base].sub : null;
  if (!sub){
    const nm = toks.join(" ");
    for (const [re, k] of SUB_GUESS[g] || []) if (re.test(nm)){ sub = k; break; }
  }
  return {base, sub: sub || null};
}
for (const [cid, c] of Object.entries(S.custom||{})){
  if (c.sub || !SUB_GUESS[c.g]) continue;
  if (c.base){ if (EX[c.base] && EX[c.base].sub) c.sub = EX[c.base].sub; continue; }
  const cl = classifyCustom(c.n||"", c.g);
  if (cl.base) c.base = cl.base;
  if (cl.sub) c.sub = cl.sub;
}

const fmtShort = ds => new Date(ds+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"});

const weekStart = ds => addDays(ds, -new Date(ds+"T12:00:00").getDay()); // Sunday start

const isUni = id => S.uniO[id] !== undefined ? !!S.uniO[id] : !!exInfo(id).uni;

/* ================= smart logic ================= */
const metric = (s, ex) => { const w=+s.w||0, r=+s.r||0; return (ex.bw && !w) ? r : w*(1+r/30); };
/* how a logged set reads: "185×8", "BW×10" on bodyweight lifts, "12 reps" otherwise */
const setStr = (s, ex) => +s.w ? s.w+"×"+s.r : (ex && ex.bw ? "BW×"+s.r : s.r+" reps");
const workSets = sets => sets.filter(s => +s.r > 0 && !s.warm);
const bestMetric = (sets, ex) => Math.max(...sets.map(s => metric(s, ex)));
const bestSet = (sets, ex) => sets.reduce((a,b) => metric(b,ex) > metric(a,ex) ? b : a);

function perfHistory(exId){
  const out = [];
  for (const w of [...S.workouts].sort((a,b) => b.date.localeCompare(a.date))){
    const e = w.exercises.find(x => x.id === exId);
    if (e){ const sets = workSets(e.sets); if (sets.length) out.push({date:w.date, sets, dl:!!e.dl}); }
  }
  return out;
}
const histTopW = exId => {
  const h = perfHistory(exId);
  return h.length ? Math.max(0, ...h[0].sets.map(s => +s.w || 0)) : 0;
};
function bestEver(exId){
  const ex = exInfo(exId); let best = 0;
  for (const h of perfHistory(exId)) best = Math.max(best, bestMetric(h.sets, ex));
  return best;
}
function bestE1InRange(id, a, b){
  const ex = exInfo(id); let m = 0;
  for (const w of S.workouts){ if (w.date < a || w.date > b) continue;
    const e = w.exercises.find(x => x.id === id); if (!e) continue;
    const ss = workSets(e.sets); if (ss.length) m = Math.max(m, bestMetric(ss, ex)); }
  return m || null;
}
/* pre-workout readiness (Juggernaut-style): 4 sliders → a multiplier on today's ghost
   targets, ±5–10%. Lives on the draft so past-date logging is never affected. The same
   scaleW must run everywhere a ghost is shown OR adopted, so display and finish agree. */
const readyMult = d => (d && d.ready && d.ready.m) || 1;
function scaleW(w, m){
  const v = +w;
  if (!v || !m || m === 1) return w === undefined || w === null ? "" : String(w);
  const step = v >= 50 ? 5 : 2.5;
  return String(Math.max(step, Math.round(v*m/step)*step));
}
function analyze(exId, plan){
  const ex = exInfo(exId), p = plan || {n:3, lo:8, hi:12};
  const hist = perfHistory(exId);
  if (!hist.length) return {first:true, prev:[], gW:si=>"", gR:si=>String(p.lo), chip:null, ex, p};
  const last = hist[0], prev = last.sets;
  const gRprev = si => { const s = prev[si] || prev[prev.length-1]; return String(s ? s.r : p.lo); };
  /* an active targeted deload owns the suggestions: −10% while it runs, then the old top
     weight comes straight back for the return week */
  const dl = S.dl[exId];
  if (dl){
    const active = todayStr() <= dl.until;
    const w = active ? dl.w : dl.base;
    return {first:false, prev, ex, p, fired:false, dl:active ? "on" : "back",
      gW: () => String(w || ""), gR: gRprev,
      chip: {cls: active ? "stall" : "sug", txt: active ? "deload · "+w : "back to "+dl.base+" ▲", act:"plateau"}};
  }
  const topW = Math.max(...prev.map(s => +s.w || 0));
  const top = prev.filter(s => (+s.w||0) === topW);
  const fired = top.length >= p.n && top.every(s => +s.r >= p.hi) && ex.inc > 0;
  let chip = null;
  if (fired) chip = {cls:"sug", txt:(topW||0)+" → "+(topW+ex.inc)+" ▲"};
  else if (ex.inc > 0 && topW > 0 && top.length >= p.n && top.every(s => +s.r >= p.hi - 1))
    chip = {cls:"sug", txt:"1 rep → "+(topW+ex.inc)};   // one rep shy on every top set
  else if (isStalled(exId)) chip = {cls:"stall", txt:"3× no gain", act:"plateau"};
  return {first:false, prev, ex, p, fired,
    gW: si => { const s = prev[si] || prev[prev.length-1];
      return fired ? String(topW+ex.inc) : String(s && s.w ? s.w : (topW||"")); },
    gR: si => { if (fired) return String(p.lo); return gRprev(si); },
    chip};
}
function isStalled(exId){
  const ex = exInfo(exId);
  const hist = perfHistory(exId).filter(h => !h.dl); // deload weeks don't count as stalling
  if (hist.length < 3) return false;
  const ms = hist.slice(0,3).map(h => bestMetric(h.sets, ex));
  return ms[0] <= ms[1] && ms[0] <= ms[2];
}

/* ================= body math ================= */
function weightEntries(){ return Object.entries(S.body.weights)
  .map(([d,w]) => ({d, w:+w})).filter(e => e.w > 0).sort((a,b) => a.d.localeCompare(b.d)); }
function kcalEntries(){ return Object.entries(S.body.kcals)
  .map(([d,k]) => ({d, k:+k})).filter(e => e.k > 0).sort((a,b) => a.d.localeCompare(b.d)); }
function trendSeries(){
  const ws = weightEntries();
  if (!ws.length) return [];
  const out = []; let t = ws[0].w; let i = 0;
  let d = ws[0].d; const end = ws[ws.length-1].d;
  while (d <= end){
    while (i < ws.length-1 && ws[i+1].d <= d) i++;
    let w;
    if (ws[i].d === d) w = ws[i].w;
    else { const a = ws[i], b = ws[i+1] || a;
      const span = (new Date(b.d) - new Date(a.d)) / 864e5 || 1;
      const off = (new Date(d) - new Date(a.d)) / 864e5;
      w = a.w + (b.w - a.w) * (off/span); }
    t = t + 0.1 * (w - t);
    out.push({d, t});
    d = addDays(d, 1);
  }
  return out;
}
function weeklyRate(tr){
  if (tr.length < 8) return null;
  const n = Math.min(20, tr.length-1);
  return (tr[tr.length-1].t - tr[tr.length-1-n].t) / n * 7;
}
function bodyweight(){ const tr = trendSeries(); return tr.length ? tr[tr.length-1].t : 161; }
function impliedTDEE(){
  const tr = trendSeries(); if (tr.length < 15) return null;
  const end = tr[tr.length-1], start = tr[Math.max(0, tr.length-22)];
  const days = (new Date(end.d) - new Date(start.d)) / 864e5;
  if (days < 14) return null;
  const ks = kcalEntries().filter(e => e.d > start.d && e.d <= end.d);
  if (ks.length < 10) return null;
  const avgK = ks.reduce((a,e) => a+e.k, 0) / ks.length;
  return Math.round((avgK - (end.t - start.t)*3500/days)/50)*50;
}

/* ================= insights math ================= */
function lvlOf(ratio, T){
  if (ratio >= T[4]) return {score:5, idx:4, frac:1};
  let idx = -1;
  for (let i=4;i>=0;i--) if (ratio >= T[i]){ idx = i; break; }
  const base = idx < 0 ? 0 : T[idx], next = T[idx+1];
  const frac = Math.max(0, (ratio-base)/(next-base));
  return {score:(idx+1)+frac, idx, frac, next};
}
function liftScores(){
  const bw = bodyweight(), fem = S.settings.sex === "female" ? 0.72 : 1;
  const out = [];
  for (const [id, std] of Object.entries(STD)){
    const ex = exInfo(id), hist = perfHistory(id);
    if (!hist.length) continue;
    let e1 = 0, bs = null;
    for (const h of hist) for (const s of workSets(h.sets)){
      const v = std.bwTotal ? (bw + (+s.w||0))*(1+(+s.r)/30) : (+s.w||0)*(1+(+s.r)/30);
      if (v > e1){ e1 = v; bs = s; }
    }
    if (!e1) continue;
    const ratio = e1 / bw / fem;
    const lv = lvlOf(ratio, std.t);
    const shown = std.bwTotal ? Math.max(0, Math.round(e1 - bw)) : Math.round(e1);
    const nextLb = lv.next ? Math.round(lv.next * fem * bw - (std.bwTotal ? bw : 0)) : null;
    out.push({id, name:ex.n, e1:shown, ratio, lv, bwTotal:!!std.bwTotal, db:!!std.db, nextLb, g:ex.g});
  }
  return out.sort((a,b) => b.lv.score - a.lv.score);
}
/* counted weekly sets — the number every volume judgment runs on.
   Counting convention (the "fractional set" convention the dose-response literature
   itself uses, e.g. Pelland 2024's meta-regression): prime movers earn the full set,
   strong synergists half. The 0.25 stabilizer tier (grip, bracing) deliberately does
   NOT count here — it feeds the freshness map only. Counting it pushed nearly every
   muscle "past the limit" on paper and made the advice nag about volume that was never
   really there (v9.0 fix). */
function regionVolume(a, b){
  const per = {}, contrib = {};
  for (const w of S.workouts){
    if (w.date < a || w.date > b) continue;
    for (const e of w.exercises){
      const n = workSets(e.sets).length; if (!n) continue;
      const m = muscOf(e.id), nm = exInfo(e.id).n;
      for (const r of m.p){ per[r] = (per[r]||0) + n;
        (contrib[r] = contrib[r]||{})[nm] = (contrib[r][nm]||0) + n; }
      for (const r of m.s){ per[r] = (per[r]||0) + n*0.5;
        (contrib[r] = contrib[r]||{})[nm] = (contrib[r][nm]||0) + n*0.5; }
    }
  }
  return {per, contrib};
}
/* per-muscle weekly growth zones (counted sets, primary + half-secondary).
   The classic "10–20 hard sets" band is the research center of mass for one muscle
   (Schoenfeld 2017 dose-response: 10+ beats fewer; Baz-Valle 2022: 12–20 in trained
   lifters) — but it is NOT a ceiling: trained lifters kept growing at 20–30+ sets
   (Schoenfeld 2019; Enes 2024), and the 2024–25 meta-regressions (Pelland et al.) show
   returns that keep rising, just ever flatter, deep into the 30s. So a band's top means
   "past here extra sets buy little and cost recovery" — the app only calls it a problem
   when the user's own soreness check-ins agree, or the volume is far beyond what any
   trial found useful. Bands are wider for regions that pool several heads or soak up
   half-credits from everything (delts get 0.5 from every press AND row; glutes from
   every squat and hinge). Forearms + lower back get no band: they ride along with grip
   and bracing on nearly every lift — direct work for them is optional, never nagged. */
const VOL_BAND = {
  chest:[10,22], lats:[10,22], upper_back:[10,25],
  shoulders:[12,30],                      // three delt heads share this one bucket
  biceps:[8,20], triceps:[8,22],          // steady half-credit from every pull / press
  quads:[8,20], hamstrings:[8,20],
  glutes:[8,25],                          // half-credit from every squat + hinge
  calves:[8,20], core:[6,25],
  forearms:null, lower_back:null,         // rider muscles — informational only
};
const bandOf = r => VOL_BAND[r] === undefined ? [10,20] : VOL_BAND[r];
const heatFill = v => !v ? "hsl(224 52% 32%)" /* unworked = clear blue, not blend-in grey */
  : v <= 5 ? "hsl(174 48% 26%)" : v <= 10 ? "hsl(150 55% 38%)"
  : v <= 15 ? "hsl(80 62% 48%)" : "hsl(38 95% 55%)";
function weeklySessions(ws0){
  const end = addDays(ws0, 6);
  return S.workouts.filter(w => w.date >= ws0 && w.date <= end).length;
}
function streakWeeks(){
  let n = 0, ws = addDays(weekStart(todayStr()), -7);
  while (weeklySessions(ws) >= 5){ n++; ws = addDays(ws, -7); if (n > 520) break; }
  return n;
}

/* ================= weekly recap ================= */
function recapFor(ws0){
  const we = addDays(ws0, 6);
  const sessions = S.workouts.filter(w => w.date >= ws0 && w.date <= we);
  const tr = trendSeries();
  const tAt = ds => { const p = tr.filter(x => x.d <= ds); return p.length ? p[p.length-1].t : null; };
  const tEnd = tAt(we), tPrev = tAt(addDays(ws0,-1));
  const dW = (tEnd != null && tPrev != null && tr.length >= 8) ? tEnd - tPrev : null;
  const ks = kcalEntries().filter(e => e.d >= ws0 && e.d <= we);
  const prs = sessions.flatMap(w => w.prs || []);
  const {per} = regionVolume(ws0, we);
  const {per:prev3} = regionVolume(addDays(ws0,-21), addDays(ws0,-1));
  let outlier = null;
  for (const [r, v] of Object.entries(prev3)){
    const avg = v/3, now = per[r]||0;
    if (avg >= 6 && now < avg*0.55){ const gap = avg-now;
      if (!outlier || gap > outlier.gap) outlier = {r, now, avg, gap}; }
  }
  const anchors = [];
  for (const id of Object.keys(STD)){
    const inW = bestE1InRange(id, ws0, we), before = bestE1InRange(id, addDays(ws0,-21), addDays(ws0,-1));
    if (inW && before) anchors.push({name:exInfo(id).n, id, pct:(inW-before)/before*100});
  }
  // true hard-set count — summing the per-region credits double-counts every set that
  // touches more than one muscle
  const sets = sessions.reduce((a,w) => a + w.exercises.reduce((x,e) => x + workSets(e.sets).length, 0), 0);
  const cardio = sessions.reduce((a,w) => a + (w.cardio ? w.cardio.min : 0), 0);
  return {ws0, we, sessions, dW, ks, prs, per, outlier, anchors,
    sets:Math.round(sets), cardio, tEnd,
    avgK: ks.length ? Math.round(ks.reduce((a,e) => a+e.k,0)/ks.length) : null};
}
function recapVerdict(r){
  const drops = r.anchors.filter(a => a.pct < -3).length;
  if (r.prs.length >= 2 && (r.dW === null || r.dW <= 0.3))
    return r.prs.length+" PRs this week"+(r.dW !== null && r.dW < -0.3 ? " while the scale trend fell — strength is moving the right way." : " — strength is moving.");
  if (r.dW !== null){
    const d = Math.abs(r.dW).toFixed(1);
    if (r.dW <= -0.45 && r.dW >= -1.05 && !drops) return "Down "+d+" lb with lifts holding — textbook cut week.";
    if (r.dW < -1.15) return "Down "+d+" lb — quick drop; keep an eye on strength and energy.";
    if (r.dW < -0.2) return "Down "+d+" lb — steady, sustainable pace.";
    if (r.dW <= 0.3) return "Weight held steady through "+r.sessions.length+" sessions — recomp-style week.";
    return "Trend up "+d+" lb — likely water and glycogen; watch the two-week picture, not the week.";
  }
  return r.sessions.length ? r.sessions.length+" sessions in the books." : "A quiet week — everything resets today.";
}
function recapSuggestion(r){
  if (r.dW !== null && r.dW < -1.2)
    return "The trend is dropping over 1.2 lb/wk — a touch hot for muscle retention at your size. Consider +100–150 kcal on training days.";
  if (r.dW !== null && r.dW > -0.25 && r.avgK && r.avgK > S.settings.kcalTarget + 150)
    return "Trend barely moved and intake averaged "+r.avgK.toLocaleString()+" — tighten the estimates or shave ~100 kcal.";
  if (r.outlier)
    return REGIONS[r.outlier.r]+" got "+Math.round(r.outlier.now)+" sets vs your usual ~"+Math.round(r.outlier.avg)+" — worth a set or two extra next week.";
  const stalled = Object.keys(STD).find(id => perfHistory(id).length && isStalled(id));
  if (stalled) return exInfo(stalled).n+" has stalled 3 sessions — change the rep range for two weeks or deload 10%.";
  const sc = liftScores().filter(x => x.nextLb !== null).sort((a,b) => a.lv.frac > b.lv.frac ? -1 : 1)[0];
  if (sc) return "You're closest to a level-up on "+sc.name+" — about "+Math.max(1, Math.round(sc.nextLb - sc.e1))+" lb of e1RM to "+LVLS[Math.min(4, sc.lv.idx+1)]+".";
  return "Keep doing exactly this.";
}

    for (const a of r.anchors.slice(0,4))

/* ================= session score ================= */
const hardOf = e => e.sets.filter(s => +s.r > 0 && !s.warm);
/* sub-region taxonomy: short labels for in-workout lines, group → expected parts */
const SUB_LBL = {chest_up:"Upper", chest_low:"Mid/lower", delt_front:"Front", delt_side:"Side", delt_rear:"Rear",
  tri_long:"Overhead/long head", tri_lat:"Pushdown/lateral", bi_curl:"Curls", bi_brach:"Hammer/brachialis",
  back_lat:"Lats/vertical", back_mid:"Rows/mid-back", quad_comp:"Squat/press", quad_iso:"Extensions",
  ham_hinge:"Hinge (RDL)", ham_curl:"Leg curl", calf_stand:"Standing", calf_seat:"Seated",
  abs_low:"Hanging raises", abs_crunch:"Crunches"};
const GROUP_SUBS = {chest:["chest_up","chest_low"], shoulders:["delt_front","delt_side","delt_rear"],
  triceps:["tri_long","tri_lat"], biceps:["bi_curl","bi_brach"], back:["back_lat","back_mid"],
  quads:["quad_comp","quad_iso"], hamstrings:["ham_hinge","ham_curl"], calves:["calf_stand","calf_seat"],
  abs:["abs_low","abs_crunch"]};
function creditTo(exId, prim){ const m = muscOf(exId);
  return m.p.some(r => prim.includes(r)) ? 1 : m.s.some(r => prim.includes(r)) ? 0.5 : 0; }
function rateWorkout(w){
  const hard = w.exercises.reduce((a,e) => a + hardOf(e).length, 0);
  if (!hard) return null;
  const prior = S.workouts.filter(x => x.id !== w.id && x.date < w.date)
    .sort((a,b) => b.date.localeCompare(a.date));
  const sd = sesDef(w.session);
  const notes = [];

  /* 1) completion vs plan — 30 pts */
  let comp;
  if (sd){
    const planSets = sd.plan.reduce((a,p) => a + p[1], 0);
    const did = new Set(w.exercises.filter(e => hardOf(e).length).map(e => e.id));
    const trained = new Set();
    for (const e of w.exercises) if (hardOf(e).length) muscOf(e.id).p.forEach(r => trained.add(r));
    // a swapped same-muscle exercise still covers its plan slot
    const covered = p => did.has(p[0]) || muscOf(p[0]).p.some(r => trained.has(r));
    const cover = sd.plan.filter(covered).length / sd.plan.length;
    comp = Math.min(1, hard/planSets)*22 + cover*8;
    const missed = sd.plan.filter(p => !covered(p)).map(p => exInfo(p[0]).n);
    if (missed.length && missed.length <= 3) notes.push("Skipped: "+missed.join(", ")+" — that muscle went untrained.");
  } else comp = Math.min(1, hard/16)*30;

  /* 2) performance vs last time, fatigue-adjusted — 40 pts */
  const res = [];
  w.exercises.forEach((e, pos) => {
    const ex = exInfo(e.id), sets = hardOf(e);
    if (!sets.length) return;
    const now = bestMetric(sets, ex);
    let prev = null, prevPos = 0, prevSS = false;
    for (const pw of prior){
      const pe = pw.exercises.find(x => x.id === e.id);
      if (pe){ const ps = hardOf(pe);
        if (ps.length){ prev = bestMetric(ps, ex); prevPos = pw.exercises.indexOf(pe); prevSS = !!pe.ss; break; } }
    }
    if (prev === null){ res.push({id:e.id, name:ex.n, cls:"new"}); return; }
    const pct = (now - prev) / prev * 100;
    // a planned targeted-deload session is a hold by definition — never a strength miss
    if (e.dl){ res.push({id:e.id, name:ex.n, pct, why:["planned deload"], cls:"hold"}); return; }
    const prim = muscOf(e.id).p;
    let pre = 0;
    for (let j = 0; j < pos; j++) pre += hardOf(w.exercises[j]).length * creditTo(w.exercises[j].id, prim);
    let recent = 0;
    for (const pw of prior){
      const gap = (new Date(w.date+"T12:00:00") - new Date(pw.date+"T12:00:00")) / 864e5;
      if (gap > 2) break;
      for (const pe of pw.exercises) recent += hardOf(pe).length * creditTo(pe.id, prim);
    }
    const posDelta = Math.max(0, pos - prevPos);
    // a lift moved INTO a superset carries extra fatigue from the shortened rest — give it slack
    const ssNew = !!e.ss && !prevSS;
    const tol = 1.5 + Math.min(3, posDelta*0.8) + Math.min(2.5, pre*0.3) + (recent >= 4 ? 2 : 0) + (ssNew ? 2 : 0);
    const why = [];
    if (ssNew) why.push("done in a superset today");
    if (posDelta) why.push("done "+posDelta+" slot"+(posDelta>1?"s":"")+" later than last time");
    if (pre >= 3) why.push(Math.round(pre)+" earlier sets hit the same muscles");
    if (recent >= 4) why.push("same muscles trained in the last 2 days");
    res.push({id:e.id, name:ex.n, pct, why, cls: pct >= 0.5 ? "win" : pct >= -tol ? "hold" : "miss"});
  });
  const scored = res.filter(r => r.cls !== "new");
  const perfPts = scored.length
    ? scored.reduce((a,r) => a + (r.cls==="win" ? 1 : r.cls==="hold" ? 0.7 : 0.2), 0) / scored.length * 40
    : 28;
  const wins = scored.filter(r => r.cls === "win").sort((a,b) => b.pct - a.pct);
  if (wins.length) notes.push("Biggest win: "+wins[0].name+" +"+wins[0].pct.toFixed(1)+"% e1RM.");
  for (const r of scored){
    if (r.cls === "miss")
      notes.push(r.name+" down "+Math.abs(r.pct).toFixed(1)+"% with no fatigue excuse — watch it.");
    else if (r.cls === "hold" && r.pct < -1.5 && r.why.length)
      notes.push(r.name+" dipped "+Math.abs(r.pct).toFixed(1)+"% — expected ("+r.why[0]+"), not penalized.");
  }

  /* 3) rep quality + volume vs your norm — 20 pts */
  let inR = 0, above = 0;
  for (const e of w.exercises){
    const p = sd && sd.plan.find(x => x[0] === e.id);
    const lo = p ? p[2] : 5, hi = p ? p[3] : 30;
    for (const s of hardOf(e)){ if (+s.r >= lo && +s.r <= hi+2) inR++; if (+s.r > hi+2) above++; }
  }
  const same = w.session ? prior.filter(x => x.session === w.session).slice(0,4) : [];
  const medHard = same.length
    ? same.map(x => x.exercises.reduce((a,e) => a + hardOf(e).length, 0)).sort((a,b) => a-b)[Math.floor(same.length/2)]
    : null;
  const inten = (inR/hard)*12 + (medHard ? Math.min(1, hard/medHard)*8 : 6);
  if (above >= 3) notes.push(above+" sets sailed past the rep range — time to add weight.");

  /* 4) bonus — 10 pts */
  const bonus = Math.min(3, (w.prs||[]).length)*2.5 + (w.cardio ? 2.5 : 0);

  if (notes.length < 4){
    const bm = w.exercises.map(e => e.id).find(id => STD[id] && perfHistory(id).length);
    if (bm){ const sc = liftScores().find(s => s.id === bm);
      if (sc && sc.lv.idx >= 0) notes.push(sc.name+" sits at "+LVLS[sc.lv.idx]+" for your bodyweight."); }
  }
  /* 5) per-muscle grades — same win/hold/miss data, cut by primary muscle, plus that
     muscle's rep quality and hard-set volume vs your norm for this session type */
  const muscles = [];
  for (const [nm, regs] of Object.entries(FRESH_REG)){
    const exs = w.exercises.filter(e => hardOf(e).length && muscOf(e.id).p.some(r => regs.includes(r)));
    if (!exs.length) continue;
    const mSets = exs.reduce((a,e) => a + hardOf(e).length, 0);
    if (mSets < 2) continue;
    const rs = res.filter(r => r.cls !== "new" && exs.some(e => e.id === r.id));
    const str = rs.length ? rs.reduce((a,r) => a + (r.cls==="win" ? 1 : r.cls==="hold" ? 0.7 : 0.2), 0) / rs.length : 0.7;
    let mIn = 0;
    for (const e of exs){
      const p = sd && sd.plan.find(x => x[0] === e.id);
      const lo = p ? p[2] : 5, hi = p ? p[3] : 30;
      for (const s of hardOf(e)) if (+s.r >= lo && +s.r <= hi+2) mIn++;
    }
    const rq = mIn / mSets;
    let vol = 0.75; // neutral until this session type has history
    if (same.length){
      const meds = same.map(x => x.exercises
        .filter(e2 => hardOf(e2).length && muscOf(e2.id).p.some(r => regs.includes(r)))
        .reduce((a,e2) => a + hardOf(e2).length, 0)).sort((a,b) => a-b);
      const md = meds[Math.floor(meds.length/2)];
      if (md > 0) vol = Math.min(1, mSets/md);
    }
    const ms = Math.max(1, Math.min(100, Math.round((str*0.6 + (rq*0.5 + vol*0.5)*0.4) * 100)));
    const win = rs.filter(r => r.cls === "win").length, miss = rs.filter(r => r.cls === "miss").length;
    const bits = [mSets+" hard sets"];
    if (!rs.length) bits.push("first time on these lifts");
    else {
      if (win) bits.push(win+" lift"+(win>1?"s":"")+" up");
      if (miss) bits.push(miss+" down");
      if (!win && !miss) bits.push("held steady");
    }
    /* per-part line: hard sets by sub-region of the groups trained today, 0 = flagged */
    const expected = [...new Set([].concat(...exs.map(e => GROUP_SUBS[exInfo(e.id).g] || [])))];
    let subs = "";
    if (expected.length){
      const cnt = {}; let other = 0;
      for (const e of exs){
        const sb = exInfo(e.id).sub;
        if (sb && expected.includes(sb)) cnt[sb] = (cnt[sb]||0) + hardOf(e).length;
        else other += hardOf(e).length;
      }
      subs = expected.map(k => (cnt[k]
          ? SUB_LBL[k]+' <b class="num" style="color:var(--text-1)">'+cnt[k]+'</b>'
          : '<span class="wr">'+SUB_LBL[k]+' 0 — untouched</span>')).join(" · ")
        + (other ? ' · unclassified '+other : '');
    }
    muscles.push({nm, score:ms, grade:gradeFor(ms), detail:bits.join(" · "), subs});
  }
  muscles.sort((a,b) => b.score - a.score);

  const score = Math.max(1, Math.min(100, Math.round(comp + perfPts + inten + bonus)));
  const grade = gradeFor(score);
  return {score, grade, g:grade[0], notes:notes.slice(0,4), muscles,
    parts:{comp:Math.round(comp), perf:Math.round(perfPts), qual:Math.round(inten), bonus:Math.round(bonus)}};
}
function gradeFor(score){
  return score>=92?"A+":score>=84?"A":score>=76?"B+":score>=68?"B":score>=60?"C+":score>=52?"C":"D";
}
const scoreBadge = (rt, id) => rt
  ? '<button class="badge sc g'+rt.g+' num" data-act="score-why" data-id="'+id+'">'+rt.score+' · '+rt.grade+'</button>' : '';
function openScoreModal(id){
  const w = S.workouts.find(x => x.id === id); if (!w) return;
  const rt = rateWorkout(w); if (!rt) return;
  const row = (label, pts, max, desc) => {
    const pct = pts/max*100;
    return '<div class="lift-row"><div class="rowline"><b>'+label+'</b>'
      + '<span class="lvl num" style="color:'+(pct>=84?"var(--accent)":pct>=60?"var(--text-2)":"var(--warn)")+'">'
      + (max === 10 ? '+'+pts : gradeFor(pct))+' · '+pts+'/'+max+'</span></div>'
      + '<div class="lbar"><span><i style="transform:scaleX('+Math.max(0.02, pct/100).toFixed(2)+')"></i></span></div>'
      + '<div class="sub">'+desc+'</div></div>'; };
  openModal('<h3>'+fmtDate(w.date)+' — <span class="grad-ink">'+rt.score+' · '+rt.grade+'</span></h3>'
    + row("Did the work", rt.parts.comp, 30,
        "Hard sets done vs the day's plan, plus covering every planned muscle. Swapping in a same-muscle exercise still counts.")
    + row("Strength vs last time", rt.parts.perf, 40,
        "Each lift's best e1RM vs your previous session of it — with slack for doing it later in the workout, earlier sets on the same muscles, or having trained them in the last 48 h. Beating = full marks, holding = most, unexplained drops cost.")
    + row("Rep quality & volume", rt.parts.qual, 20,
        "How many hard sets landed inside the target rep range, and total sets vs your own norm for this session type.")
    + row("Bonus", rt.parts.bonus, 10,
        "PRs (+2.5 each, up to 3) and cardio done (+2.5).")
    + (rt.muscles && rt.muscles.length ? '<div class="mgroup">By muscle</div>'
        + rt.muscles.map(m => row('<i class="mdot" style="background:'+(MAJOR_COL[m.nm]||"#8A93A3")+';color:'+(MAJOR_COL[m.nm]||"#8A93A3")+'"></i>'+m.nm,
            m.score, 100, m.detail + (m.subs ? '<br>' + m.subs : ''))).join("") : "")
    + (rt.notes.length ? '<div class="mgroup">Notes</div>'
        + rt.notes.map(n => '<p class="hint" style="margin-top:6px">• '+esc(n)+'</p>').join("") : "")
    + '<div class="btnrow"><button data-act="modal-close">Close</button></div>');
}

/* ================= drafts ================= */
function blankSets(n){
  return Array.from({length:n}, () => ({w:"",r:"",done:false,warm:false}));
}
function setsFor(id, planN){
  // a targeted deload halves the set count; the return week restores the pre-deload count
  const dl = S.dl[id];
  if (dl) return blankSets(todayStr() <= dl.until ? Math.max(1, Math.ceil((dl.n || 3)/2)) : (dl.n || planN || 3));
  // otherwise start with however many sets you actually did last time, not the plan's number
  const hist = perfHistory(id);
  return blankSets(hist.length ? Math.max(1, hist[0].sets.length) : (planN || 3));
}
function draftFromSession(key, dateStr){
  const ses = sesDef(key);
  return {date:dateStr, session:key || null, active:false, startedAt:null, timer:null,
    exercises: ses ? ses.plan.map((p,i) => ({id:p[0], plan:{n:p[1],lo:p[2],hi:p[3]}, note:"", open:i===0,
      ss:p[4] || undefined, sets:setsFor(p[0], p[1])})) : [],
    cardio:{on:true, min:20}, note:""};
}
function newDraft(dateStr){
  return draftFromSession(WEEK[new Date(dateStr+"T12:00:00").getDay()], dateStr);
}
const draftHasData = d => d && d.exercises.some(e => e.sets.some(s => s.done || +s.r > 0));
function curDraft(){ const date = S.editing || todayStr();
  return S.drafts[date] || (S.drafts[date] = newDraft(date)); }
function openWorkoutDraft(w){
  const sd = sesDef(w.session);
  S.drafts[w.date] = {date:w.date, session:w.session, active:true,
    startedAt:(w.date === todayStr() && w.durMin) ? Date.now() - w.durMin*60000 : null, timer:null,
    exercises: w.exercises.map((e,i) => ({id:e.id, note:e.note||"", open:i===0, ss:e.ss,
      plan:(sd && sd.plan.find(p => p[0] === e.id))
        ? (p => ({n:p[1],lo:p[2],hi:p[3]}))(sd.plan.find(p => p[0] === e.id)) : null,
      sets:e.sets.map(s => ({w:String(s.w||""), r:String(s.r), done:true, warm:!!s.warm}))})),
    cardio:{on:!!w.cardio, min:w.cardio ? w.cardio.min : 20}, note:w.note||""};
  S.workouts = S.workouts.filter(x => x.id !== w.id);
  S.editing = w.date === todayStr() ? null : w.date;
  save(); tab = "home"; render();
}

function sparkSVG(tr){
  const pts = tr.slice(-30);
  if (pts.length < 2) return "";
  const W=128,H=34, vals=pts.map(p=>p.t);

  let d = "M"+p[1].x.toFixed(1)+" "+p[1].y.toFixed(1);
  for (let i = 1; i < p.length-2; i++)
    d += "C"+(p[i].x+(p[i+1].x-p[i-1].x)/6*k).toFixed(1)+" "+(p[i].y+(p[i+1].y-p[i-1].y)/6*k).toFixed(1)
      +" "+(p[i+1].x-(p[i+2].x-p[i].x)/6*k).toFixed(1)+" "+(p[i+1].y-(p[i+2].y-p[i].y)/6*k).toFixed(1)
      +" "+p[i+1].x.toFixed(1)+" "+p[i+1].y.toFixed(1);

}

  Calves:["calves"], Core:["core","lower_back"]};

/* freshness at the same granularity as the heat map: days since each region / sub-region
   last got a real dose (≥2 credited sets; p 1.0 / s 0.5 / t 0.25, subs by their own sets) */
let freshD = null;
function freshDays(){
  const lastR = {}, lastS = {};
  for (const w of S.workouts){
    const cr = {}, cs = {};
    for (const e of w.exercises){
      const n = workSets(e.sets).length; if (!n) continue;
      const m = muscOf(e.id);
      for (const r of m.p) cr[r] = (cr[r]||0) + n;
      for (const r of m.s) cr[r] = (cr[r]||0) + n*0.5;
      for (const r of (m.t||[])) cr[r] = (cr[r]||0) + n*0.25;
      const sb = exInfo(e.id).sub; if (sb) cs[sb] = (cs[sb]||0) + n;
    }
    for (const [r,c] of Object.entries(cr)) if (c >= 2 && (!lastR[r] || w.date > lastR[r])) lastR[r] = w.date;
    for (const [k,c] of Object.entries(cs)) if (c >= 2 && (!lastS[k] || w.date > lastS[k])) lastS[k] = w.date;
  }
  const dd = d => Math.round((new Date(todayStr()+"T12:00:00") - new Date(d+"T12:00:00"))/864e5);
  return {reg:Object.fromEntries(Object.entries(lastR).map(([r,d]) => [r, dd(d)])),
          sub:Object.fromEntries(Object.entries(lastS).map(([k,d]) => [k, dd(d)]))};
}
/* which major region each sub-region rolls up to — check-in feedback is collected per
   region, so a sub inherits its parent's tuned recovery clock */
const SUB_REG = {chest_up:"chest", chest_low:"chest", delt_front:"shoulders", delt_side:"shoulders",
  delt_rear:"shoulders", tri_long:"triceps", tri_lat:"triceps", bi_curl:"biceps", bi_brach:"biceps",
  back_lat:"lats", back_mid:"upper_back", quad_comp:"quads", quad_iso:"quads",
  ham_hinge:"hamstrings", ham_curl:"hamstrings", calf_stand:"calves", calf_seat:"calves",
  abs_low:"core", abs_crunch:"core"};
/* per-region recovery tuning from post-workout check-ins: "still sore coming in" slows that
   muscle's freshness clock (+1 day), "wasn't sore" speeds it up (−0.7). Last 3 ratings,
   recency-weighted, clamped to [−1, +1.5] days. */
function recovAdj(r){
  const es = Object.entries(S.fb).filter(([,m]) => m[r] && m[r].s !== undefined)
    .sort((a,b) => b[0].localeCompare(a[0])).slice(0,3);
  if (!es.length) return 0;
  let num = 0, den = 0, w = 1;
  for (const [,m] of es){ num += w * (m[r].s === 2 ? 1 : m[r].s === 0 ? -0.7 : 0); den += w; w *= 0.6; }

const adjD = (raw, r) => raw === null ? null : raw <= 0 ? raw : Math.max(0.5, raw - recovAdj(r));

const freshFill = d => d === null ? "hsl(224 48% 30%)" /* never trained = clear blue */
  : d <= 0.25 ? "hsl(18 88% 55%)"  // trained today
  : d < 1.75 ? "hsl(42 95% 55%)"   // recovering
  : d < 2.75 ? "hsl(75 60% 50%)"   // almost ready
  : d <= 7.5 ? "hsl(152 60% 45%)"  // ready
  : "hsl(210 25% 34%)";            // 8+ days — due again
function paintFresh(id){

    const r = sub !== undefined ? (SUB_REG[sub] || el.dataset.region) : el.dataset.region;
    const raw = sub !== undefined
      ? (freshD.sub[sub] !== undefined ? freshD.sub[sub] : null)
      : (freshD.reg[el.dataset.region] !== undefined ? freshD.reg[el.dataset.region] : null);
    const days = adjD(raw, r);
    el.setAttribute("fill", freshFill(days));

/* live warm-up detection — same rule finishDraft applies at the end, run as sets land so
   the W shows up in the moment. Reference weight = the heavier of today's top logged set
   and last session's top working set; flags are provisional (wAuto) and a manual tap on
   the set number (wMan) always wins. finishDraft re-derives the final state. */
function liveWarmCheck(ei){
  const d = curDraft(), e = d.exercises[ei];
  if (!e) return;
  const ex = exInfo(e.id);
  const logged = e.sets.map((s, si) => ({s, si})).filter(x => setLogged(x.s));
  if (!logged.length) return;
  const histTop = histTopW(e.id);
  const todayTop = Math.max(...logged.map(x => +x.s.w || 0));
  const effTop = Math.max(todayTop, histTop);
  // repeated sets at today's top weight = a genuinely lighter day, not a warm-up ramp
  const nAtTop = logged.filter(x => (+x.s.w || 0) === todayTop).length;
  const lightDay = histTop > 0 && todayTop <= histTop * 0.75 && nAtTop >= 2;
  let changed = false, flagged = false;
  logged.forEach((x, j) => {
    const s = x.s, w = +s.w || 0;
    if (s.wMan) return;
    const workBefore = logged.slice(0, j).some(y => (+y.s.w || 0) > effTop * 0.75);
    // a 0-weight set on a bw lift is only a warm-up when weighted sets follow TODAY —
    // an all-bodyweight day (dips, pull-ups) is real work, not a ramp
    const light = effTop > 0 && ((w > 0 && w <= effTop * 0.75) || (w === 0 && ex.bw && todayTop > 0));
    const want = light && !workBefore && !(lightDay && w === todayTop);
    if (want === !!s.warm || (!want && !s.wAuto)) return; // never auto-clear a manual W
    s.warm = want; s.wAuto = want; changed = true;
    if (want) flagged = true;
    const row = document.querySelector('.srow[data-ei="'+ei+'"][data-si="'+x.si+'"]');
    if (row){
      row.classList.toggle("warm", want);
      row.querySelector(".snum").textContent = want ? "W" : x.si + 1;
    }
  });
  if (!changed) return;
  if (flagged && !S.warmHint){
    S.warmHint = 1;
    showToast("That looks like a warm-up — marked <b>W</b>. Taps on a set number cycle W → ⊘ remove; typing in a set restores ⊘.");
  }
  save();
}

  const out = [];
  for (const p of [45, 35, 25, 10, 5, 2.5])
    while (per >= p - 0.01){ out.push(p); per -= p; }
  return out.length ? "bar + " + out.join(" + ") + " / side" + (per > 0.3 ? " ≈" : "") : "";
}

let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [0, 0.22].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
      o.start(t0); o.stop(t0+0.18);
    });
  } catch(e){}
}

/* ================= finish ================= */
/* PR taxonomy — three ways a session can be a record, checked in priority order:
   e1RM (the headline single-set strength estimate), rep-max (heaviest weight ever moved
   for ≥N reps — catches "same top weight, more reps at 8" days the e1RM can miss when a
   lower-rep set dominates), and session volume (most total lb in one session of the lift).
   At most 2 per lift so a big day doesn't spam the toast. Deload sessions never PR-check. */
function computePRs(kept){
  const prs = [];
  for (const e of kept){
    if (e.dl) continue;
    const ex = exInfo(e.id), sets = workSets(e.sets);
    if (!sets.length) continue;
    const hist = perfHistory(e.id);
    if (!hist.length) continue;
    let n = 0;
    const prev = Math.max(...hist.map(h => bestMetric(h.sets, ex)));
    const now = bestMetric(sets, ex);
    if (now > prev + 0.01){
      const bs = bestSet(sets, ex);
      prs.push({id:e.id, name:ex.n, kind:"e1rm", str:(ex.bw && !+bs.w ? "BW" : (+bs.w||0))+" × "+bs.r});
      n++;
    }
    // rep-max: best weight held for at least r reps, vs all history (2+ prior sessions)
    if (!n && hist.length >= 2){
      const histRM = r => { let m = 0;
        for (const h of hist) for (const s of h.sets) if (+s.r >= r) m = Math.max(m, +s.w || 0);
        return m; };
      let best = null;
      for (const s of sets){
        const w = +s.w || 0, r = +s.r;
        if (!(w > 0) || r < 1 || r > 15) continue;
        const pm = histRM(r);
        if (pm > 0 && w > pm + 0.01 && (!best || r > best.r || (r === best.r && w > best.w)))
          best = {w, r};
      }
      if (best){ prs.push({id:e.id, name:ex.n, kind:"rm", rm:best.r, str:best.w+" × "+best.r}); n++; }
    }
    // session-volume record (3+ prior sessions so early noise doesn't count)
    if (n < 2 && hist.length >= 3){
      const vol = ss => ss.reduce((a, s) => a + (+s.w||0)*(+s.r||0), 0);
      const nowV = vol(sets), prevV = Math.max(...hist.map(h => vol(h.sets)));
      if (prevV > 0 && nowV > prevV * 1.02)
        prs.push({id:e.id, name:ex.n, kind:"vol", str:Math.round(nowV).toLocaleString()+" lb"});
    }
  }
  return prs;
}
/* how a PR reads in toasts / history / exports */
const prLabel = p => !p.kind || p.kind === "e1rm" ? p.name+" "+p.str
  : p.kind === "rm" ? p.name+" · "+p.rm+"-rep best "+p.str
  : p.name+" · volume PR "+p.str;
let lastAutoWarm = 0;
function finishDraft(dateStr, silent){
  const d = S.drafts[dateStr];
  if (!d) return false;
  const chk = S.settings.checkOff;
  /* auto-detect warm-ups: light sets logged BEFORE the day's top weight are lead-in
     warm-ups (≤75% of the heavier of today's top and last session's top working set);
     light back-off sets AFTER the top weight stay working sets. This pass is the final
     word over the live detection: provisional (wAuto) flags are re-derived from what was
     actually logged, manual taps (wMan) are never touched. */
  lastAutoWarm = 0;
  for (const e of d.exercises){
    const ex = exInfo(e.id);
    const wasWarm = e.sets.map(s => !!s.warm);
    for (const s of e.sets) if (s.wAuto && !s.wMan){ s.warm = false; s.wAuto = false; }
    const logged = e.sets.filter(s => +s.r > 0 && (chk ? s.done : true));
    if (logged.length < 2) continue;
    const topW = Math.max(...logged.map(s => +s.w || 0));
    if (!(topW > 0)) continue;
    const effTop = Math.max(topW, histTopW(e.id));
    const topIdx = logged.findIndex(s => (+s.w || 0) === topW);
    logged.forEach((s, j) => {
      if (j >= topIdx || s.warm || s.wMan) return;
      const w = +s.w || 0;
      if ((w > 0 && w <= effTop * 0.75) || (w === 0 && ex.bw)){
        s.warm = true; s.wAuto = true;
        if (!wasWarm[e.sets.indexOf(s)]) lastAutoWarm++;
      }
    });
  }
  if (chk){
    const unchecked = d.exercises.reduce((a,e) => a + e.sets.filter(s => !s.done && (+s.r>0 || +s.w>0)).length, 0);
    if (!silent && unchecked && !confirm(unchecked+" set(s) have numbers but no check — they'll be dropped. Finish anyway?")) return false;
  } else {
    // reps typed + weight left blank → adopt the ghost suggestion, same as tapping the check
    // used to — except on bodyweight lifts, where blank weight IS the weight (bodyweight)
    for (const e of d.exercises){
      if (exInfo(e.id).bw) continue;
      const a = analyze(e.id, e.plan);
      e.sets.forEach((s, si) => {
        if (+s.r > 0 && s.w === ""){ const gw = scaleW(a.gW(si), readyMult(d)); if (+gw) s.w = gw; }
      });
    }
  }
  const kept = d.exercises
    .map(e => Object.assign({id:e.id, note:e.note||"", sets:e.sets.filter(s => (chk ? s.done : true) && +s.r > 0)
      .map(s => ({w:+s.w||0, r:+s.r, warm:!!s.warm}))},
      e.ss ? {ss:e.ss} : {},
      S.dl[e.id] && dateStr <= S.dl[e.id].until ? {dl:1} : {}))
    .filter(e => e.sets.length);
  if (!kept.length){ if (!silent) alert("Check off at least one set first."); return false; }
  const prs = computePRs(kept);
  S.workouts = S.workouts.filter(w => w.date !== dateStr);
  S.workouts.push({id:dateStr.replace(/-/g,"")+"-"+Math.floor(Math.random()*1e6),
    date:dateStr, session:d.session, sesName:(sesDef(d.session)||{}).name || d.bname || "Custom",
    exercises:kept, cardio:d.cardio.on ? {min:+d.cardio.min || 20} : null,
    note:(d.note||"").trim(), prs,
    durMin:(dateStr === todayStr() && d.startedAt) ? Math.round((Date.now()-d.startedAt)/60000) : null});
  // a finished return-week session closes out that lift's targeted deload
  for (const e of kept){ const dl = S.dl[e.id]; if (dl && dateStr > dl.until) delete S.dl[e.id]; }
  delete S.drafts[dateStr];
  if (S.editing === dateStr) S.editing = null;
  if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  save();
  return prs;
}

        + (dW2 > 0 ? "+" : "")+dW2.toFixed(1)+'" since first log</small>' : '')+'</div>'

        + (es.length > 1 ? ' <span class="'+(d2 > 0.05 ? "up" : d2 < -0.05 ? "wr" : "fl")+'" style="font-size:12px">'+(d2 > 0 ? "+" : "")+d2.toFixed(1)+'"</span>' : '')+'</b></div>';
    }
    if (wst.length > 1){

      + '<p class="hint" style="margin-top:8px"><b style="color:var(--text-1)">'+esc(weakest.name)+'</b> is your furthest-back benchmark'+(gLbl ? ' here' : '')+' ('

function trendsStrength(){
  if (!S.workouts.length) return '<div class="card hint">Finish a workout or two first.</div>';

  // All shows everything (Arms = biceps + triceps, same as the chips)

  const ids = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.id)))]
    .filter(id => perfHistory(id).length && inChip(id))
    .sort((a,b) => exInfo(a).n.localeCompare(exInfo(b).n));
  if (!ids.length) return strengthOverviewHTML()
    + (labGroup ? '<h2>Lift by lift</h2><div class="card hint">No logged lifts in this muscle group yet — the All tab shows everything.</div>' : '');
  // a chip switch narrows the view without clobbering the saved pick
  const sel = ids.includes(S.progSel) ? S.progSel : ids[0];
  const ex = exInfo(sel);
  const hist = perfHistory(sel).reverse();
  const pts = hist.map(h => { const bs = bestSet(h.sets, ex);
    return {date:h.date, val:Math.round(bestMetric(h.sets, ex)), lbl:(ex.bw && !+bs.w ? "BW" : (+bs.w||0))+" × "+bs.r}; });
  const isReps = ex.bw && hist.every(h => h.sets.every(s => !+s.w));
  const best = pts.reduce((a,b) => b.val >= a.val ? b : a);
  const delta = pts[pts.length-1].val - pts[0].val;
  let html = strengthOverviewHTML();
  const chipLbl = labGroup ? ({chest:"Chest",back:"Back",shoulders:"Delts",arms:"Arms",quads:"Quads",hamstrings:"Hams"})[labGroup] : "";
  html += '<h2>Lift by lift'+(chipLbl ? ' · '+chipLbl.toLowerCase() : '')+'</h2>';
  html += '<div class="card" style="padding:12px"><select id="prog-sel">'
    + ids.map(id => '<option value="'+id+'"'+(id===sel?" selected":"")+'>'+esc(exInfo(id).n)+'</option>').join("")+'</select></div>';
  html += '<div class="card"><span class="lbl">'+esc(ex.n)+' — '+(isReps?"best reps":"est. 1RM")+'</span>'
    + '<div class="chartwrap" style="margin-top:8px">'+e1rmChart(pts)+'<div id="ctip"></div></div></div>';
  html += '<div class="grid2" style="margin-bottom:12px">'
    + '<div class="card"><span class="lbl">Best ever</span><div class="stat num" style="font-size:21px;margin-top:6px">'+best.val+'<small> '+(isReps?"reps":"lb")+'</small></div>'
    + '<div class="cap num">'+best.lbl+' · '+fmtShort(best.date)+'</div></div>'
    + '<div class="card"><span class="lbl">Since first log</span><div class="stat num '+(delta>=0?"up":"dn")+'" style="font-size:21px;margin-top:6px">'
    + (delta>=0?"+":"")+delta+'<small> '+(isReps?"reps":"lb")+'</small></div></div></div>';
  html += '<div class="card"><table><tr><th>Date</th><th>Sets</th><th>Best</th></tr>'
    + [...hist].reverse().slice(0,10).map(h => {
        const bs = bestSet(h.sets, ex);
        return '<tr><td class="num">'+fmtShort(h.date)+'</td><td class="num">'+h.sets.map(s => (+s.w? s.w+"×"+s.r : s.r)).join(", ")
          + '</td><td class="num">'+(+bs.w||0)+"×"+bs.r+'</td></tr>'; }).join("")
    + '</table></div>';
  return html;
}

let heatData = null, heatSubs = null, heatSubC = null;
function paintHeat(){
  const svg = $("#heatmap"); if (!svg) return;
  heatData = regionVolume(addDays(todayStr(),-6), todayStr());
  heatSubs = {}; heatSubC = {};
  const a7 = addDays(todayStr(), -6);
  for (const w of S.workouts){ if (w.date < a7) continue;
    for (const e of w.exercises){
      const sb = exInfo(e.id).sub; if (!sb) continue;
      const n = workSets(e.sets).length; if (!n) continue;
      heatSubs[sb] = (heatSubs[sb]||0) + n;
      (heatSubC[sb] = heatSubC[sb]||{})[exInfo(e.id).n] = (heatSubC[sb][exInfo(e.id).n]||0) + n;
    }
  }
  for (const el of svg.querySelectorAll("[data-region]")){
    const sub = el.dataset.sub;
    const v = sub !== undefined ? (heatSubs[sub] || 0) : (heatData.per[el.dataset.region] || 0);
    /* a sub-region's growth zone is ~4–12 sets/wk vs ~10–20+ for a whole muscle — scale so
       the shared color ramp means the same thing on both kinds of shape */
    const vv = sub !== undefined ? v * 1.8 : v;
    el.setAttribute("fill", heatFill(vv));
    el.style.filter = vv > 15 ? "drop-shadow(0 0 5px rgba(255,170,50,.4))"
      : vv > 10 ? "drop-shadow(0 0 4px rgba(190,230,90,.3))" : "";
  }
}

function freshness(){
  const majors = [["Chest",["chest"]],["Back",["lats","upper_back"]],["Delts",["shoulders"]],
    ["Arms",["biceps","triceps"]],["Quads",["quads"]],["Hams",["hamstrings"]],
    ["Calves",["calves"]],["Core",["core"]]];
  const lastD = {};
  for (const w of S.workouts){
    const cred = {};
    for (const e of w.exercises){
      const n = workSets(e.sets).length; if (!n) continue;
      for (const r of muscOf(e.id).p) cred[r] = (cred[r]||0) + n;
      for (const r of muscOf(e.id).s) cred[r] = (cred[r]||0) + n*0.5;
      for (const r of (muscOf(e.id).t||[])) cred[r] = (cred[r]||0) + n*0.25;
    }
    for (const [nm, regs] of majors){
      const c = regs.reduce((a,r) => a + (cred[r]||0), 0);
      if (c >= 2 && (!lastD[nm] || w.date > lastD[nm])) lastD[nm] = w.date;
    }
  }
  return majors.map(([nm]) => { const d = lastD[nm];
    return {nm, days: d ? Math.round((new Date(todayStr()+"T12:00:00") - new Date(d+"T12:00:00"))/864e5) : null}; });
}
function deloadAdvice(){
  if (S.workouts.length < 10) return null;
  const wk = weeklyStats(), signals = [];
  const recentIds = [...new Set(S.workouts.filter(w => w.date >= addDays(todayStr(),-13))
    .flatMap(w => w.exercises.map(e => e.id)))];
  const stalls = recentIds.filter(id => isStalled(id));
  if (stalls.length >= 2)
    signals.push(stalls.length+" lifts stalled 3+ sessions ("+stalls.slice(0,3).map(id => exInfo(id).n).join(", ")+")");
  const sc = [...S.workouts].sort((a,b) => a.date.localeCompare(b.date))
    .map(w => { const r = rateWorkout(w); return r ? r.score : null; }).filter(x => x !== null);
  if (sc.length >= 12){
    const a6 = sc.slice(-6).reduce((a,b) => a+b, 0)/6, p6 = sc.slice(-12,-6).reduce((a,b) => a+b, 0)/6;
    if (a6 - p6 <= -5) signals.push("session scores sliding ("+Math.round(p6)+" → "+Math.round(a6)+")");
  }
  const full = wk.slice(0,-1).filter(w => w.sets > 0);
  if (full.length >= 6){
    const srt = full.slice(-8).map(w => w.sets).sort((a,b) => a-b);
    const med = srt[Math.floor(srt.length/2)];
    let heavy = 0;
    for (let i = wk.length-2; i >= 0; i--){ if (wk[i].sets >= med*0.6 && wk[i].sets > 0) heavy++; else break; }
    if (heavy >= 7) signals.push(heavy+" straight weeks without a light week");
  }
  if (wk.length >= 6){
    const l2 = wk.slice(-2).reduce((a,w) => a + w.sets, 0)/2;
    const p4 = wk.slice(-6,-2).reduce((a,w) => a + w.sets, 0)/4;
    if (p4 > 0 && l2 > p4*1.35) signals.push("volume ramped "+Math.round((l2/p4-1)*100)+"% above your recent normal");
  }
  return {level: signals.length >= 2 ? "advise" : signals.length ? "watch" : "ok", signals};
}
function readiness(){
  const pairs = [];
  for (const w of S.workouts){
    const rt = rateWorkout(w); if (!rt) continue;
    pairs.push({score:rt.score, sleep:+((S.body.sleep||{})[w.date])||null, energy:+((S.body.energy||{})[w.date])||null});
  }
  const bucket = (arr, test) => { const g = arr.filter(test);
    return g.length >= 3 ? {n:g.length, avg:g.reduce((a,p) => a + p.score, 0)/g.length} : null; };
  const sl = pairs.filter(p => p.sleep), en = pairs.filter(p => p.energy);
  return {nSleep:sl.length, nEnergy:en.length,
    sHi:bucket(sl, p => p.sleep >= 7.5), sLo:bucket(sl, p => p.sleep < 7.5),
    eHi:bucket(en, p => p.energy >= 4), eLo:bucket(en, p => p.energy <= 3)};
}
function measChart(es){
  if (es.length < 2) return "";
  const W=360,H=140,L=42,R=12,T=10,B=22;
  const vals = es.map(e => e.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.6){ lo -= 0.3; hi += 0.3; }

    const row = (l,v,c) => '<div class="vol-row"><span class="nm">'+l+'</span>'
      + '<span class="bar"><i style="width:'+(v/tot*100).toFixed(0)+'%;background:'+c+'"></i></span>'
      + '<span class="v num">'+(v/tot*100).toFixed(0)+'%</span></div>';
    html += '<div class="card"><span class="lbl">Rep ranges · last 28 days</span>'
      + '<div class="cap" style="margin:4px 0 2px">where your hard sets live</div>'
      + row("1–5 strength", rd.str, "var(--info)")
      + row("6–12 build", rd.hyp, "var(--accent)")
      + row("13+ endurance", rd.end, "var(--warn)")
      + '<p class="cap" style="margin-top:10px">Muscle grows in every range, but 6–12 is the efficiency sweet spot; a dash of 1–5 keeps top-end strength moving.</p></div>';
  }

  const bal = balance(28);
  if (bal.push + bal.pull){
    const pr = bal.pull ? bal.push/bal.pull : 99, hq = bal.quad ? bal.ham/bal.quad : 0;
    const v = (ok, txt) => '<b class="num '+(ok ? "up" : "wr")+'">'+txt+'</b>';
    html += '<div class="card"><span class="lbl">Structural balance · last 28 days</span>'
      + '<div class="recap-li"><span>Push : pull sets</span>'+v(pr >= 0.75 && pr <= 1.35, bal.push+" : "+bal.pull)+'</div>'
      + '<div class="recap-li"><span>Ham : quad sets</span>'+v(hq >= 0.55 || !bal.quad, bal.ham+" : "+bal.quad)+'</div>'
      + '<p class="cap" style="margin-top:10px">Aim near 1:1 push-to-pull for shoulder health, and at least ~0.6 hamstring sets per quad set to protect knees and posture.</p></div>';
  }

  // cardio — the treadmill work finally gets its own ledger
  const cwAll = allWeekStarts().map(ws0 => {
    const end = addDays(ws0, 6);
    let min = 0, n = 0;
    for (const w of S.workouts)
      if (w.date >= ws0 && w.date <= end && w.cardio && +w.cardio.min > 0){ min += +w.cardio.min; n++; }
    return {d:ws0, val:min, n};
  });
  if (cwAll.some(p => p.val > 0)){
    const cw = cwAll.slice(-8);
    const thisWk = cw[cw.length-1];
    const prev = cw.slice(0, -1).filter(p => p.val > 0);
    const typ = prev.length ? Math.round(prev.reduce((a,p) => a+p.val, 0) / prev.length) : null;
    const kc = Math.round(thisWk.val * (+S.settings.cardioKcal || 7.8));
    html += '<div class="card"><span class="lbl">Cardio · incline treadmill'+qBtn("cardio")+'</span>'
      + '<div class="stat num" style="margin-top:6px">'+thisWk.val+'<small> min this week</small>'
      + ' <small class="cap" style="font-size:12px">· '+thisWk.n+' session'+(thisWk.n===1?"":"s")
      + (kc ? ' · ≈'+kc.toLocaleString()+' kcal' : '')+'</small></div>'
      + (typ !== null ? '<div class="cap" style="margin-top:2px">typical week: ~'+typ+' min'
          + (thisWk.val >= typ*0.85 ? ' — on pace' : ' — room to walk')+'</div>' : '')
      + labBars(cw, v => Math.round(v)+"m") + '</div>';
  }

  const em = energyModel(), real = impliedTDEE();
  html += '<div class="card hero"><span class="lbl">Energy & maintenance</span>'
    + '<div class="stat num" style="margin-top:6px"><span class="grad-ink">≈ '+em.tdee.toLocaleString()+'</span><small> kcal/day maintenance</small></div>'
    + '<div class="cap">modelled from your body stats + your actual last 14 days of training</div>'
    + '<div class="recap-block">'
    + li("Base metabolism ("+(+S.settings.bodyFat > 0 ? "Katch-McArdle" : "Mifflin-St Jeor")+")", em.bmr)
    + li("Daily living · NEAT + digestion", em.neat)
    + li("Lifting (avg/day)", em.lift)
    + li("Treadmill (avg/day)", em.cardio)+'</div>'
    + (real
        ? '<div class="recap-block">'+li("Measured from YOUR logs", real)
          + '<p class="cap" style="margin-top:6px">Intake vs weight-trend over ~3 weeks — once this exists, trust it over the model above.</p></div>'
        : '<p class="cap" style="margin-top:10px">Keep logging morning weight + calories — after ~3 weeks the app measures your real maintenance from the data and shows it here.</p>')
    + (+S.settings.bodyFat > 0 ? '' : '<p class="cap" style="margin-top:8px">Set body-fat % in Settings to upgrade the BMR formula and unlock lean-mass tracking.</p>')
    + '</div>';

  /* lean mass / FFMI now live on the Strength page's "You" card only */
  return html;
}
function labBars(pts, fmt){
  if (pts.length < 2) return '<p class="hint" style="padding:8px 0">A couple of weeks of data and this charts itself.</p>';
  const W=360,H=170,L=42,R=8,T=12,B=22;
  const hi = Math.max(...pts.map(p => p.val), 1)*1.12;
  const X = i => L + (W-L-R)*(i/(pts.length-1));
  const Y = v => T + (H-T-B)*(1 - v/hi);
  const bw2 = Math.max(Math.min((W-L-R)/pts.length*0.62, 20), 3);
  let g = "";
  for (let i=1;i<4;i++){ const v = hi*i/4, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+fmt(v)+'</text>'; }
  const bars = pts.map((p,i) =>
    '<rect class="pt" x="'+(X(i)-bw2/2).toFixed(1)+'" y="'+Y(p.val).toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+(Y(0)-Y(p.val)).toFixed(1)+'" rx="2" fill="'
    + (i === pts.length-1 ? "#2CE08B" : "rgba(255,255,255,.28)")+'" data-d="'+p.d+'" data-v="'+fmt(p.val)+'" data-l="that week"/>').join("");
  const xl = [0, pts.length-1].map(i =>
    '<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(pts[i].d)+'</text>').join("");
  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'">'+g+bars+xl+'</svg></div>';
}
