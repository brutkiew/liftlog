<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>LiftLog</title>
<style>
  :root{
    /* surfaces */
    --bg-0:#0A0B0D; --bg-1:#14161A; --bg-2:#1D2026; --bg-3:#262A31;
    --stroke:rgba(255,255,255,.07); --stroke-soft:rgba(255,255,255,.04);
    /* text */
    --text-1:#F4F5F7; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.38);
    /* accent + semantic */
    --accent:#2CE08B; --accent-hi:#7CF5AE; --accent-lo:#17B9A0; --accent2:#8B7CF6;
    --grad:linear-gradient(135deg,#17B9A0,#2CE08B 55%,#7CF5AE);
    --grad2:linear-gradient(135deg,#17B9A0,#3ECFB2 35%,#8B7CF6);
    --accent-dim:rgba(44,224,139,.14);
    --good:#30D158; --warn:#FFD60A; --bad:#FF453A; --info:#64D2FF;
    /* geometry & motion */
    --r-card:16px; --r-el:12px;
    --ease:cubic-bezier(.16,1,.3,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg-0)}
  body{color:var(--text-1);background:var(--bg-0);min-height:100vh;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  /* aurora */
  body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none}
  body::before{width:440px;height:440px;top:-150px;left:-130px;
    background:radial-gradient(circle,rgba(23,185,160,.22),transparent 65%)}
  body::after{width:500px;height:500px;bottom:-190px;right:-150px;
    background:radial-gradient(circle,rgba(139,124,246,.18),transparent 65%)}
  @media (prefers-reduced-motion:no-preference){
    body::before{animation:drift1 26s ease-in-out infinite alternate}
    body::after{animation:drift2 32s ease-in-out infinite alternate}
    @keyframes drift1{to{transform:translate(80px,60px) scale(1.15)}}
    @keyframes drift2{to{transform:translate(-70px,-80px) scale(1.1)}}
  }
  .num{font-variant-numeric:tabular-nums}
  .ic{vertical-align:-4px}
  .grad-ink{background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* ===== chrome ===== */
  #topbar{position:sticky;top:0;z-index:5;
    background:rgba(20,22,26,.72);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
    border-bottom:1px solid var(--stroke);
    padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:9px}
  #topbar .mark{color:var(--accent);display:flex}
  #topbar h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
  #topbar .date{margin-left:auto;color:var(--text-3);font-size:13px;font-weight:500}
  main{max-width:480px;margin:0 auto;padding:16px 20px 24px}
  h2{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;
    margin:24px 2px 12px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--grad2)}
  #tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;
    background:rgba(20,22,26,.72);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
    border-top:1px solid var(--stroke);display:flex;
    padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
  #tabs button{flex:1;background:none;border:none;color:var(--text-3);font-size:10.5px;
    font-weight:600;padding:7px 0 4px;letter-spacing:.03em;border-radius:12px;
    transition:transform .35s var(--ease)}
  #tabs button:active{transform:scale(.94)}
  #tabs button .ic{display:block;margin:0 auto 3px}
  #tabs button.on{color:var(--text-1);background:var(--accent-dim)}
  #tabs button.on .ic{color:var(--accent)}
  /* ===== cards ===== */
  .card{background:var(--bg-1);border:1px solid var(--stroke);border-radius:var(--r-card);
    padding:18px;margin-bottom:12px;transition:transform .35s var(--ease)}
  .card.tap{cursor:pointer}
  .card.tap:active{transform:scale(.97)}
  .hero{border:1px solid transparent;
    background:linear-gradient(var(--bg-1),var(--bg-1)) padding-box,
      linear-gradient(135deg,rgba(44,224,139,.5),rgba(139,124,246,.45)) border-box;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 36px rgba(23,185,160,.08)}
  .hint{color:var(--text-2);font-size:13px;line-height:1.45}
  .cap{color:var(--text-3);font-size:13px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .stat{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .stat small,.xl small{font-weight:600;color:var(--text-2);letter-spacing:0}
  .stat small{font-size:13px}
  .xl{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .xl small{font-size:16px}
  .up{color:var(--good)} .dn{color:var(--bad)} .fl{color:var(--text-3)} .wr{color:var(--warn)}
  /* ===== controls ===== */
  button{font:inherit;color:var(--text-1);background:var(--bg-2);border:1px solid var(--stroke);
    border-radius:var(--r-el);padding:10px 14px;cursor:pointer;touch-action:manipulation;
    transition:transform .35s var(--ease),background .2s}
  button:active{transform:scale(.96)}
  button.primary{background:var(--grad);border:none;color:#0A0B0D;font-weight:700;
    box-shadow:0 6px 22px rgba(44,224,139,.28)}
  button.big{width:100%;padding:15px;font-size:15px;border-radius:var(--r-el);letter-spacing:.01em}
  button.small{padding:6px 12px;font-size:13px;border-radius:10px;font-weight:550}
  button.ghost{background:none;border:none;color:var(--text-2);padding:6px 8px;font-size:15px}
  button.danger{color:var(--bad)}
  button.link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:4px}
  input,select,textarea{font:inherit;font-size:16px;color:var(--text-1);background:var(--bg-2);
    border:1px solid var(--stroke);border-radius:var(--r-el);padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-lo);
    box-shadow:0 0 0 3px rgba(44,224,139,.13)}
  .rowline{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  .btnrow button{flex:1}
  .grid2{display:flex;gap:12px}
  .grid2 .card{flex:1;margin-bottom:0}
  /* entrance stagger */
  @media (prefers-reduced-motion:no-preference){
    .stagger>*{animation:rise .5s var(--ease) backwards}
    .stagger>:nth-child(1){animation-delay:.03s}.stagger>:nth-child(2){animation-delay:.09s}
    .stagger>:nth-child(3){animation-delay:.15s}.stagger>:nth-child(4){animation-delay:.21s}
    .stagger>:nth-child(5){animation-delay:.27s}.stagger>:nth-child(6){animation-delay:.33s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    .ring-fg{animation:ringIn 1.1s var(--ease) .2s backwards}
    @keyframes ringIn{from{stroke-dashoffset:326.7}}
  }
  .ring-fg{filter:drop-shadow(0 0 9px rgba(44,224,139,.5))}
  /* ===== home ===== */
  .today-name{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
  .preview{color:var(--text-2);font-size:13px;line-height:1.65;margin-bottom:14px}
  .checkin-grid{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .checkin-grid label{flex:1 1 calc(50% - 5px)}
  .checkin-grid .lbl{display:block;margin-bottom:6px}
  .checkin-grid input{text-align:center;font-size:17px;font-weight:600}
  .ok-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:8px;vertical-align:1px}
  .ring-wrap{position:relative;width:96px;height:96px;margin:6px auto 2px}
  .ring-wrap svg{width:100%;height:100%}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-center .num{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1}
  .ring-center .cap{font-size:10px;margin-top:2px}
  .wkstrip{display:flex;gap:5px;margin-top:12px}
  .wkstrip .day{flex:1;text-align:center}
  .wkstrip .well{height:26px;border-radius:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
  .wkstrip .well i{position:absolute;inset:0;background:var(--grad);border-radius:6px}
  .wkstrip .well.rest::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--text-3)}
  .wkstrip .dl{font-size:9.5px;color:var(--text-3);font-weight:600;margin-top:4px;letter-spacing:.05em}
  .spark{margin-top:10px;display:block}
  /* ===== workout ===== */
  #sessbar{position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:4;
    background:rgba(20,22,26,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--stroke);
    margin:0 -20px 14px;padding-left:14px;padding-right:14px}
  #sessbar .t{font-size:13px;color:var(--text-3)}
  #sessbar b{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
  .xcard{padding:14px 15px 15px}
  .xhead{display:flex;align-items:center;gap:7px}
  .xname{background:none;border:none;color:var(--text-1);font-size:15px;font-weight:650;padding:4px 0;
    text-align:left;flex:1;min-width:0;letter-spacing:-.01em}
  .xname .tgt{color:var(--text-3);font-weight:500;font-size:12px}
  .chip{flex:none;font-size:12px;color:var(--text-2);background:var(--bg-2);
    border:1px solid var(--stroke);border-radius:999px;padding:4px 11px;font-weight:600}
  .chip.sug{color:var(--accent);border-color:rgba(44,224,139,.4);background:var(--accent-dim)}
  .chip.stall{color:var(--warn);border-color:rgba(255,214,10,.35);background:rgba(255,214,10,.08)}
  .xnote{color:var(--text-2);font-size:12.5px;margin-top:3px;font-style:italic}
  .cols,.srow{display:grid;grid-template-columns:34px 1fr 74px 62px 46px;gap:8px;align-items:center}
  .cols{margin-top:12px;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;
    text-align:center;font-weight:600}
  .srow{margin-top:7px}
  .snum{width:34px;height:42px;border-radius:10px;background:none;border:1px solid var(--stroke);
    color:var(--text-3);font-size:13px;padding:0;font-weight:700}
  .srow.warm .snum{color:var(--warn);border-color:rgba(255,214,10,.4)}
  .prev{text-align:center;color:var(--text-3);font-size:13px;overflow:hidden;white-space:nowrap}
  .srow input{height:46px;text-align:center;padding:4px;font-size:17px;font-weight:650;border-radius:10px}
  .srow input::placeholder{color:var(--text-3);font-weight:500}
  .chk{width:46px;height:46px;border-radius:12px;color:var(--text-3);padding:0;display:flex;align-items:center;justify-content:center}
  .srow.done .chk{background:var(--accent);border-color:transparent;color:#0A0B0D}
  .srow.done input{border-color:transparent;background:var(--accent-dim)}
  .addset{margin-top:12px;width:100%;color:var(--text-3);border-style:dashed;background:none;padding:9px;font-size:13.5px;font-weight:550}
  /* collapsed exercise card */
  .xmin{padding:0}
  .xminrow{display:flex;align-items:stretch}
  .grip{display:flex;align-items:center;padding:0 3px 0 12px;color:var(--text-3);
    touch-action:none;cursor:grab;flex:none}
  .xhead .grip{padding:0 2px 0 0;margin-left:-4px}
  .xcard.dragging{opacity:.92;transform:scale(1.02);box-shadow:0 14px 40px rgba(0,0,0,.5);
    border-color:rgba(44,224,139,.45);position:relative;z-index:5}
  .xrow{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:none;
    padding:14px 15px 14px 8px;text-align:left;border-radius:var(--r-card)}
  .xrow .xn{font-size:14.5px;font-weight:650;letter-spacing:-.01em;flex:none;max-width:54%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xrow .xsum{flex:1;min-width:0;text-align:right;color:var(--text-3);font-size:12.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xrow .xsum b{color:var(--text-2);font-weight:600}
  .xmin.alldone{border-color:rgba(44,224,139,.28)}
  .xmin.alldone .xn::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--good);margin-right:7px;vertical-align:2px}
  /* This session / Last time tabs */
  .stabs{display:flex;gap:6px;margin-top:12px}
  .stabs button{flex:none;padding:4px 12px;font-size:12px;border-radius:999px;color:var(--text-3);font-weight:600}
  .stabs button.on{color:var(--accent);border-color:rgba(44,224,139,.4);background:var(--accent-dim)}
  .lastrow{display:flex;gap:10px;font-size:13px;margin-top:9px;color:var(--text-2);align-items:baseline}
  .lastrow .ld{width:56px;color:var(--text-3);flex:none;font-size:12px}
  /* no check-off mode: drop the check column */
  body.nochk .cols,body.nochk .srow{grid-template-columns:34px 1fr 84px 72px}
  /* session score badge */
  .badge.sc{font-weight:700;border:none;color:#0A0B0D}
  .sc.gA{background:var(--accent)} .sc.gB{background:var(--info)}
  .sc.gC{background:var(--warn)} .sc.gD{background:var(--bad);color:#fff}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
    z-index:7;display:none;align-items:center;gap:6px;
    background:rgba(20,22,26,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(44,224,139,.5);border-radius:999px;padding:7px 9px 7px 17px;
    box-shadow:0 16px 48px rgba(0,0,0,.55)}
  #timer.show{display:flex}
  #timer.flash{animation:tflash .5s 3}
  @keyframes tflash{50%{background:rgba(44,224,139,.75)}}
  #timer .tt{font-size:20px;font-weight:800;min-width:56px;letter-spacing:-.01em}
  #timer .tex{font-size:12px;color:var(--text-2);max-width:92px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #timer button{padding:6px 11px;font-size:13px;border-radius:999px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));
    z-index:9;background:var(--bg-3);border:1px solid var(--stroke);color:var(--text-1);
    border-radius:14px;padding:12px 18px;font-size:14px;display:none;
    box-shadow:0 16px 48px rgba(0,0,0,.55);max-width:90vw}
  #toast.show{display:block;animation:tin .3s var(--ease)}
  @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
  /* ===== history ===== */
  .h-head{display:flex;align-items:center;gap:8px;cursor:pointer}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .badge{font-size:11.5px;color:var(--text-2);background:var(--bg-2);border:1px solid var(--stroke);
    border-radius:999px;padding:2px 9px;font-weight:550}
  .badge.pr{color:#0A0B0D;background:var(--warn);border:none;font-weight:700}
  .h-body{display:none;margin-top:12px;border-top:1px solid var(--stroke-soft);padding-top:10px}
  .open .h-body{display:block}
  .h-body p{font-size:13.5px;margin:4px 0;color:var(--text-2)}
  .h-body p b{color:var(--text-1);font-weight:600}
  .banner{border-color:rgba(255,214,10,.3)}
  /* ===== trends ===== */
  .seg{display:flex;background:var(--bg-1);border:1px solid var(--stroke);border-radius:999px;padding:3px;margin-bottom:14px}
  .seg button{flex:1;background:none;border:none;border-radius:999px;color:var(--text-3);padding:9px;font-size:13.5px;font-weight:600}
  .seg button.on{background:var(--grad);color:#0A0B0D;box-shadow:0 4px 14px rgba(44,224,139,.22)}
  .ranges{display:flex;gap:6px;margin-bottom:12px}
  .ranges button{padding:5px 15px;font-size:13px;border-radius:999px;font-weight:600;color:var(--text-2)}
  .ranges button.on{border-color:rgba(44,224,139,.4);color:var(--accent);background:var(--accent-dim)}
  .chartwrap{position:relative}
  .chartwrap svg{width:100%;height:auto;display:block}
  #ctip{position:absolute;pointer-events:none;background:var(--bg-3);border:1px solid var(--stroke);
    border-radius:9px;padding:6px 10px;font-size:12.5px;display:none;white-space:nowrap;z-index:3}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--text-3);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    padding:5px 6px;border-bottom:1px solid var(--stroke)}
  td{padding:7px 6px;border-bottom:1px solid var(--stroke-soft);color:var(--text-2)}
  td:first-child{color:var(--text-1)}
  tr:last-child td{border-bottom:none}
  /* levels + volume */
  .lift-row{margin-top:15px}
  .lift-row b{font-size:14px;font-weight:650}
  .lift-row .lvl{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.02em}
  .lift-row .sub{font-size:12px;color:var(--text-3);margin-top:2px}
  .lbar{display:flex;gap:3px;margin-top:7px}
  .lbar span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
  .lbar span i{position:absolute;inset:0;background:var(--grad);border-radius:3px;transform-origin:left}
  .vol-row{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px}
  .vol-row .nm{width:86px;color:var(--text-2)}
  .vol-row .bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
  .vol-row .bar::after{content:"";position:absolute;top:0;bottom:0;left:40%;width:40%;background:rgba(255,255,255,.05)}
  .vol-row .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--grad);z-index:1}
  .vol-row .bar.low i{background:rgba(255,214,10,.55)}
  .vol-row .v{width:52px;text-align:right;color:var(--text-3);font-size:12px}
  .focus-card{border-color:rgba(44,224,139,.3);background:linear-gradient(180deg,rgba(44,224,139,.07),var(--bg-1) 70%)}
  /* heat map */
  .heat-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .heat-legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-3);font-weight:600}
  .heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  #heat-detail{margin-top:10px;font-size:13px;color:var(--text-2);text-align:center;min-height:20px}
  #heat-detail b{color:var(--text-1)}
  [data-region]{cursor:pointer;transition:opacity .2s}
  [data-region]:active{opacity:.7}
  /* consistency calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
  .cal i{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.06)}
  .cal i.on{background:var(--accent);opacity:.9}
  .cal i.today{outline:1.5px solid var(--text-2);outline-offset:1px}
  /* recap */
  .recap-block{border-top:1px solid var(--stroke-soft);margin-top:13px;padding-top:12px}
  .recap-verdict{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.35;margin-top:4px}
  .recap-li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--text-2);margin-top:7px}
  .recap-li b{color:var(--text-1);font-weight:650}
  /* ===== coach ===== */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chips button{font-size:13px;padding:7px 13px;border-radius:999px;color:var(--text-2);font-weight:550}

const GROUPS = {chest:"Chest",triceps:"Triceps",back:"Back",biceps:"Biceps",

const SESSIONS = {
  "ls-a":{name:"Legs / Shoulders — A",plan:[["squat",4,5,8],["legpress",3,10,12],["legext",3,12,15],["scalf",4,10,15],["dbohp",3,8,10],["latraise",3,12,15],["rpd",3,12,15],["hlr",3,10,15]]},

  "bb-b":{name:"Back / Biceps — B",plan:[["bbrow",4,6,10],["ngpd",3,10,12],["cablerow",3,10,12],["pullover",3,12,15],["hammer",3,10,12],["cablecurl",3,12,15],["hlr",3,10,15]]},
  "ct-b":{name:"Chest / Triceps — B",plan:[["incbb",4,6,10],["flatdb",3,10,12],["l2h",3,12,15],["pec",2,15,20],["cgbp",3,8,10],["rope",3,12,15],["hlr",3,10,15]]},
};
const WEEK = ["ls-a","bb-a","ct-a","ls-b","bb-b","ct-b",null]; // Sun..Sat

/* strength standards (approximate community thresholds, ×BW, male) */
const STD = {
  bench:{t:[.65,.95,1.35,1.80,2.30]},
  incbb:{t:[.55,.80,1.15,1.55,1.95]},
  cgbp:{t:[.60,.85,1.20,1.60,2.05]},

  rdl:{t:[.80,1.20,1.70,2.20,2.80]},
  bbrow:{t:[.50,.75,1.05,1.40,1.80]},
  bbohp:{t:[.40,.60,.85,1.15,1.50]},
  pullup:{t:[1.00,1.15,1.40,1.70,2.05],bwTotal:1},
  dip:{t:[1.00,1.20,1.50,1.85,2.25],bwTotal:1},
};
const LVLS = ["Beginner","Novice","Intermediate","Advanced","Elite"];

/* muscle regions + exercise mapping (primary 1.0 / secondary 0.5 credit) */
const REGIONS = {chest:"Chest",shoulders:"Shoulders",biceps:"Biceps",forearms:"Forearms",
  core:"Core",quads:"Quads",calves:"Calves",upper_back:"Upper back",lats:"Lats",
  triceps:"Triceps",lower_back:"Lower back",glutes:"Glutes",hamstrings:"Hamstrings"};
const MUSC = {
  bench:{p:["chest"],s:["shoulders","triceps"]}, incbb:{p:["chest"],s:["shoulders","triceps"]},
  incdb:{p:["chest"],s:["shoulders","triceps"]}, flatdb:{p:["chest"],s:["shoulders","triceps"]},
  dip:{p:["chest"],s:["triceps"]}, cfly:{p:["chest"],s:[]}, l2h:{p:["chest"],s:[]},
  pec:{p:["chest"],s:[]}, machchest:{p:["chest"],s:["triceps"]},
  ohext:{p:["triceps"],s:[]}, dbohext:{p:["triceps"],s:[]}, ropeoh:{p:["triceps"],s:[]},
  pushdown:{p:["triceps"],s:[]}, rope:{p:["triceps"],s:[]},
  cgbp:{p:["triceps"],s:["chest"]}, jm:{p:["triceps"],s:[]}, skull:{p:["triceps"],s:[]},
  pullup:{p:["lats"],s:["biceps","forearms"]}, latpd:{p:["lats"],s:["biceps"]},
  ngpd:{p:["lats"],s:["biceps"]}, sapd:{p:["lats"],s:[]}, pullover:{p:["lats"],s:["chest"]},
  bbrow:{p:["upper_back"],s:["lats","biceps"]}, tbar:{p:["upper_back"],s:["lats","biceps"]},
  csrow:{p:["upper_back"],s:["lats","biceps"]}, dbrow:{p:["lats"],s:["upper_back","biceps"]},
  cablerow:{p:["upper_back"],s:["lats","biceps"]},
  ezcurl:{p:["biceps"],s:["forearms"]}, bbcurl:{p:["biceps"],s:["forearms"]},
  incurl:{p:["biceps"],s:[]}, hammer:{p:["biceps"],s:["forearms"]},
  cablecurl:{p:["biceps"],s:[]}, preacher:{p:["biceps"],s:[]},
  dbohp:{p:["shoulders"],s:["triceps"]}, machohp:{p:["shoulders"],s:["triceps"]},
  smithohp:{p:["shoulders"],s:["triceps"]},
  arnold:{p:["shoulders"],s:["triceps"]}, bbohp:{p:["shoulders"],s:["triceps","core"]},
  latraise:{p:["shoulders"],s:[]}, clat:{p:["shoulders"],s:[]}, cfront:{p:["shoulders"],s:[]},
  rpd:{p:["shoulders"],s:["upper_back"]}, sarpd:{p:["shoulders"],s:["upper_back"]},
  facepull:{p:["shoulders"],s:["upper_back"]},
  squat:{p:["quads"],s:["glutes","lower_back","core"]}, legpress:{p:["quads"],s:["glutes"]},
  hack:{p:["quads"],s:["glutes"]}, legext:{p:["quads"],s:[]},
  bss:{p:["quads"],s:["glutes"]}, lunge:{p:["quads"],s:["glutes"]},
  rdl:{p:["hamstrings"],s:["glutes","lower_back"]}, legcurl:{p:["hamstrings"],s:[]},
  scalf:{p:["calves"],s:[]}, seatcalf:{p:["calves"],s:[]},
  hlr:{p:["core"],s:[]}, cablecrunch:{p:["core"],s:[]},
};
const GROUP_M = {chest:{p:["chest"],s:["triceps"]}, triceps:{p:["triceps"],s:[]},
  back:{p:["lats"],s:["upper_back","biceps"]}, biceps:{p:["biceps"],s:["forearms"]},
  shoulders:{p:["shoulders"],s:[]}, quads:{p:["quads"],s:["glutes"]},
  hamstrings:{p:["hamstrings"],s:["glutes"]}, calves:{p:["calves"],s:[]},
  abs:{p:["core"],s:[]}, other:{p:[],s:[]}};

/* ================= state ================= */
const KEY = "liftlog.v1";
const DEF_SET = {kcalTarget:2510, goalWeight:"", restDefault:90, sound:true, vibrate:true,
  restO:{}, sex:"male", height:'5\'11.5"', apiKey:"", showClock:false, checkOff:false,
  age:30, bodyFat:"", cardioKcal:7.8};
let S = {workouts:[], drafts:{}, custom:{}, templates:{}, coach:[], milestone:0, uniO:{},
  body:{weights:{}, kcals:{}},
  settings:Object.assign({}, DEF_SET),
  progSel:null, editing:null, trendTab:"body", range:30, recapSeen:""};
let storeOK = true;
try { const raw = localStorage.getItem(KEY); if (raw){
  const d = JSON.parse(raw);
  S = Object.assign(S, d);
  S.body = Object.assign({weights:{},kcals:{},meas:{},sleep:{},energy:{}}, d.body||{});
  S.settings = Object.assign({}, DEF_SET, d.settings||{});
}} catch(e){ storeOK = false; }
S.templates = S.templates || {}; S.coach = S.coach || []; S.milestone = S.milestone || 0;
S.uniO = S.uniO || {};
S.coach.forEach(x => { x.pending = false; if (x.a === "") x.a = "(interrupted)"; });
for (const d of Object.values(S.drafts||{}))
  for (const e of d.exercises||[])
    for (const s of e.sets||[]){ if (s.done === undefined) s.done = +s.r > 0; if (s.warm === undefined) s.warm = false; }
const save = () => { if (!storeOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storeOK = false; } };

let tab = "home";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr = () => { const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = ds => new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtShort = ds => new Date(ds+"T12:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"});
const addDays = (ds, n) => { const d = new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const weekStart = ds => addDays(ds, -new Date(ds+"T12:00:00").getDay()); // Sunday start
const exInfo = id => EX[id] || S.custom[id] || {n:"Unknown",g:"other",inc:5};
const sesDef = key => key ? (SESSIONS[key] || S.templates[key] || null) : null;
const restFor = id => S.settings.restO[id] || exInfo(id).rest || S.settings.restDefault;
const muscOf = id => MUSC[id] || GROUP_M[exInfo(id).g] || {p:[],s:[]};
const isUni = id => S.uniO[id] !== undefined ? !!S.uniO[id] : !!exInfo(id).uni;
const tonOf = w => w.exercises.reduce((a,e) => a + e.sets.reduce((x,s) =>
  x + (+s.w||0)*(+s.r||0)*(isUni(e.id)?2:1), 0), 0);

/* ================= smart logic ================= */
const metric = (s, ex) => { const w=+s.w||0, r=+s.r||0; return (ex.bw && !w) ? r : w*(1+r/30); };
const workSets = sets => sets.filter(s => +s.r > 0 && !s.warm);
const bestMetric = (sets, ex) => Math.max(...sets.map(s => metric(s, ex)));
const bestSet = (sets, ex) => sets.reduce((a,b) => metric(b,ex) > metric(a,ex) ? b : a);

function perfHistory(exId){
  const out = [];
  for (const w of [...S.workouts].sort((a,b) => b.date.localeCompare(a.date))){
    const e = w.exercises.find(x => x.id === exId);
    if (e){ const sets = workSets(e.sets); if (sets.length) out.push({date:w.date, sets}); }
  }
  return out;
}
const histTopW = exId => {
  const h = perfHistory(exId);
  return h.length ? Math.max(0, ...h[0].sets.map(s => +s.w || 0)) : 0;
};
function bestEver(exId){
  const ex = exInfo(exId); let best = 0;
  for (const h of perfHistory(exId)) best = Math.max(best, bestMetric(h.sets, ex));
  return best;
}
function bestE1InRange(id, a, b){
  const ex = exInfo(id); let m = 0;
  for (const w of S.workouts){ if (w.date < a || w.date > b) continue;
    const e = w.exercises.find(x => x.id === id); if (!e) continue;
    const ss = workSets(e.sets); if (ss.length) m = Math.max(m, bestMetric(ss, ex)); }
  return m || null;
}
function analyze(exId, plan){
  const ex = exInfo(exId), p = plan || {n:3, lo:8, hi:12};
  const hist = perfHistory(exId);
  if (!hist.length) return {first:true, prev:[], gW:si=>"", gR:si=>String(p.lo), chip:null, ex, p};
  const last = hist[0], prev = last.sets;
  const topW = Math.max(...prev.map(s => +s.w || 0));
  const top = prev.filter(s => (+s.w||0) === topW);
  const fired = top.length >= p.n && top.every(s => +s.r >= p.hi) && ex.inc > 0;
  let chip = null;
  if (fired) chip = {cls:"sug", txt:(topW||0)+" → "+(topW+ex.inc)+" ▲"};
  else if (hist.length >= 3){
    const ms = hist.slice(0,3).map(h => bestMetric(h.sets, ex));
    if (ms[0] <= ms[1] && ms[0] <= ms[2]) chip = {cls:"stall", txt:"3× no gain"};
  }
  return {first:false, prev, ex, p, fired,
    gW: si => { const s = prev[si] || prev[prev.length-1];
      return fired ? String(topW+ex.inc) : String(s && s.w ? s.w : (topW||"")); },
    gR: si => { if (fired) return String(p.lo);
      const s = prev[si] || prev[prev.length-1]; return String(s ? s.r : p.lo); },
    chip};
}
function isStalled(exId){
  const ex = exInfo(exId), hist = perfHistory(exId);
  if (hist.length < 3) return false;
  const ms = hist.slice(0,3).map(h => bestMetric(h.sets, ex));
  return ms[0] <= ms[1] && ms[0] <= ms[2];
}

/* ================= body math ================= */
function weightEntries(){ return Object.entries(S.body.weights)
  .map(([d,w]) => ({d, w:+w})).filter(e => e.w > 0).sort((a,b) => a.d.localeCompare(b.d)); }
function kcalEntries(){ return Object.entries(S.body.kcals)
  .map(([d,k]) => ({d, k:+k})).filter(e => e.k > 0).sort((a,b) => a.d.localeCompare(b.d)); }
function trendSeries(){
  const ws = weightEntries();
  if (!ws.length) return [];
  const out = []; let t = ws[0].w; let i = 0;
  let d = ws[0].d; const end = ws[ws.length-1].d;
  while (d <= end){
    while (i < ws.length-1 && ws[i+1].d <= d) i++;
    let w;
    if (ws[i].d === d) w = ws[i].w;
    else { const a = ws[i], b = ws[i+1] || a;
      const span = (new Date(b.d) - new Date(a.d)) / 864e5 || 1;
      const off = (new Date(d) - new Date(a.d)) / 864e5;
      w = a.w + (b.w - a.w) * (off/span); }
    t = t + 0.1 * (w - t);
    out.push({d, t});
    d = addDays(d, 1);
  }
  return out;
}
function weeklyRate(tr){
  if (tr.length < 8) return null;
  const n = Math.min(20, tr.length-1);
  return (tr[tr.length-1].t - tr[tr.length-1-n].t) / n * 7;
}
function bodyweight(){ const tr = trendSeries(); return tr.length ? tr[tr.length-1].t : 161; }
function impliedTDEE(){
  const tr = trendSeries(); if (tr.length < 15) return null;
  const end = tr[tr.length-1], start = tr[Math.max(0, tr.length-22)];
  const days = (new Date(end.d) - new Date(start.d)) / 864e5;
  if (days < 14) return null;
  const ks = kcalEntries().filter(e => e.d > start.d && e.d <= end.d);
  if (ks.length < 10) return null;
  const avgK = ks.reduce((a,e) => a+e.k, 0) / ks.length;
  return Math.round((avgK - (end.t - start.t)*3500/days)/50)*50;
}

/* ================= insights math ================= */
function lvlOf(ratio, T){
  if (ratio >= T[4]) return {score:5, idx:4, frac:1};
  let idx = -1;
  for (let i=4;i>=0;i--) if (ratio >= T[i]){ idx = i; break; }
  const base = idx < 0 ? 0 : T[idx], next = T[idx+1];
  const frac = Math.max(0, (ratio-base)/(next-base));
  return {score:(idx+1)+frac, idx, frac, next};
}
function liftScores(){
  const bw = bodyweight(), fem = S.settings.sex === "female" ? 0.72 : 1;
  const out = [];
  for (const [id, std] of Object.entries(STD)){
    const ex = exInfo(id), hist = perfHistory(id);
    if (!hist.length) continue;
    let e1 = 0, bs = null;
    for (const h of hist) for (const s of workSets(h.sets)){
      const v = std.bwTotal ? (bw + (+s.w||0))*(1+(+s.r)/30) : (+s.w||0)*(1+(+s.r)/30);
      if (v > e1){ e1 = v; bs = s; }
    }
    if (!e1) continue;
    const ratio = e1 / bw / fem;
    const lv = lvlOf(ratio, std.t);
    const shown = std.bwTotal ? Math.max(0, Math.round(e1 - bw)) : Math.round(e1);
    const nextLb = lv.next ? Math.round(lv.next * fem * bw - (std.bwTotal ? bw : 0)) : null;
    out.push({id, name:ex.n, e1:shown, ratio, lv, bwTotal:!!std.bwTotal, nextLb});
  }
  return out.sort((a,b) => b.lv.score - a.lv.score);
}
function regionVolume(a, b){
  const per = {}, contrib = {};
  for (const w of S.workouts){
    if (w.date < a || w.date > b) continue;
    for (const e of w.exercises){
      const n = workSets(e.sets).length; if (!n) continue;
      const m = muscOf(e.id), nm = exInfo(e.id).n;
      for (const r of m.p){ per[r] = (per[r]||0) + n;
        (contrib[r] = contrib[r]||{})[nm] = (contrib[r][nm]||0) + n; }
      for (const r of m.s){ per[r] = (per[r]||0) + n*0.5;
        (contrib[r] = contrib[r]||{})[nm] = (contrib[r][nm]||0) + n*0.5; }
    }
  }
  return {per, contrib};
}
const heatFill = v => !v ? "var(--bg-2)"
  : v <= 5 ? "hsl(160 45% 22%)" : v <= 10 ? "hsl(158 55% 31%)"
  : v <= 15 ? "hsl(155 66% 42%)" : "hsl(152 76% 55%)";
function weeklySessions(ws0){
  const end = addDays(ws0, 6);
  return S.workouts.filter(w => w.date >= ws0 && w.date <= end).length;
}
function streakWeeks(){
  let n = 0, ws = addDays(weekStart(todayStr()), -7);
  while (weeklySessions(ws) >= 5){ n++; ws = addDays(ws, -7); if (n > 520) break; }
  return n;
}

/* ================= weekly recap ================= */
function recapFor(ws0){
  const we = addDays(ws0, 6);
  const sessions = S.workouts.filter(w => w.date >= ws0 && w.date <= we);
  const tr = trendSeries();
  const tAt = ds => { const p = tr.filter(x => x.d <= ds); return p.length ? p[p.length-1].t : null; };
  const tEnd = tAt(we), tPrev = tAt(addDays(ws0,-1));
  const dW = (tEnd != null && tPrev != null && tr.length >= 8) ? tEnd - tPrev : null;
  const ks = kcalEntries().filter(e => e.d >= ws0 && e.d <= we);
  const prs = sessions.flatMap(w => w.prs || []);
  const {per} = regionVolume(ws0, we);
  const {per:prev3} = regionVolume(addDays(ws0,-21), addDays(ws0,-1));
  let outlier = null;
  for (const [r, v] of Object.entries(prev3)){
    const avg = v/3, now = per[r]||0;
    if (avg >= 6 && now < avg*0.55){ const gap = avg-now;
      if (!outlier || gap > outlier.gap) outlier = {r, now, avg, gap}; }
  }
  const anchors = [];
  for (const id of Object.keys(STD)){
    const inW = bestE1InRange(id, ws0, we), before = bestE1InRange(id, addDays(ws0,-21), addDays(ws0,-1));
    if (inW && before) anchors.push({name:exInfo(id).n, id, pct:(inW-before)/before*100});
  }
  const sets = Object.values(per).reduce((a,b) => a+b, 0);
  const cardio = sessions.reduce((a,w) => a + (w.cardio ? w.cardio.min : 0), 0);
  return {ws0, we, sessions, dW, ks, prs, per, outlier, anchors,
    sets:Math.round(sets), cardio, tEnd,
    avgK: ks.length ? Math.round(ks.reduce((a,e) => a+e.k,0)/ks.length) : null};
}
function recapVerdict(r){
  const drops = r.anchors.filter(a => a.pct < -3).length;
  if (r.prs.length >= 2 && (r.dW === null || r.dW <= 0.3))
    return r.prs.length+" PRs this week"+(r.dW !== null && r.dW < -0.3 ? " while the scale trend fell — strength is moving the right way." : " — strength is moving.");
  if (r.dW !== null){
    const d = Math.abs(r.dW).toFixed(1);
    if (r.dW <= -0.45 && r.dW >= -1.05 && !drops) return "Down "+d+" lb with lifts holding — textbook cut week.";
    if (r.dW < -1.15) return "Down "+d+" lb — quick drop; keep an eye on strength and energy.";
    if (r.dW < -0.2) return "Down "+d+" lb — steady, sustainable pace.";
    if (r.dW <= 0.3) return "Weight held steady through "+r.sessions.length+" sessions — recomp-style week.";
    return "Trend up "+d+" lb — likely water and glycogen; watch the two-week picture, not the week.";
  }
  return r.sessions.length ? r.sessions.length+" sessions in the books." : "A quiet week — everything resets today.";
}
function recapSuggestion(r){
  if (r.dW !== null && r.dW < -1.2)
    return "The trend is dropping over 1.2 lb/wk — a touch hot for muscle retention at your size. Consider +100–150 kcal on training days.";
  if (r.dW !== null && r.dW > -0.25 && r.avgK && r.avgK > S.settings.kcalTarget + 150)
    return "Trend barely moved and intake averaged "+r.avgK.toLocaleString()+" — tighten the estimates or shave ~100 kcal.";
  if (r.outlier)
    return REGIONS[r.outlier.r]+" got "+Math.round(r.outlier.now)+" sets vs your usual ~"+Math.round(r.outlier.avg)+" — worth a set or two extra next week.";
  const stalled = Object.keys(STD).find(id => perfHistory(id).length && isStalled(id));
  if (stalled) return exInfo(stalled).n+" has stalled 3 sessions — change the rep range for two weeks or deload 10%.";
  const sc = liftScores().filter(x => x.nextLb !== null).sort((a,b) => a.lv.frac > b.lv.frac ? -1 : 1)[0];
  if (sc) return "You're closest to a level-up on "+sc.name+" — about "+Math.max(1, Math.round(sc.nextLb - sc.e1))+" lb of e1RM to "+LVLS[Math.min(4, sc.lv.idx+1)]+".";
  return "Keep doing exactly this.";
}
function recapCard(r, dismissable){

    for (const a of r.anchors.slice(0,4))
      h += '<div class="recap-li"><span>'+esc(a.name)+'</span><b class="num '+(a.pct>1?"up":a.pct<-3?"dn":"fl")+'">'
        + (a.pct>1?"▲":a.pct<-3?"▼":"▬")+" "+(a.pct>0?"+":"")+a.pct.toFixed(1)+'%</b></div>';

/* ================= session score ================= */
const hardOf = e => e.sets.filter(s => +s.r > 0 && !s.warm);
function creditTo(exId, prim){ const m = muscOf(exId);
  return m.p.some(r => prim.includes(r)) ? 1 : m.s.some(r => prim.includes(r)) ? 0.5 : 0; }
function rateWorkout(w){
  const hard = w.exercises.reduce((a,e) => a + hardOf(e).length, 0);
  if (!hard) return null;
  const prior = S.workouts.filter(x => x.id !== w.id && x.date < w.date)
    .sort((a,b) => b.date.localeCompare(a.date));
  const sd = sesDef(w.session);
  const notes = [];

  /* 1) completion vs plan — 30 pts */
  let comp;
  if (sd){
    const planSets = sd.plan.reduce((a,p) => a + p[1], 0);
    const did = new Set(w.exercises.filter(e => hardOf(e).length).map(e => e.id));
    const trained = new Set();
    for (const e of w.exercises) if (hardOf(e).length) muscOf(e.id).p.forEach(r => trained.add(r));
    // a swapped same-muscle exercise still covers its plan slot
    const covered = p => did.has(p[0]) || muscOf(p[0]).p.some(r => trained.has(r));
    const cover = sd.plan.filter(covered).length / sd.plan.length;
    comp = Math.min(1, hard/planSets)*22 + cover*8;
    const missed = sd.plan.filter(p => !covered(p)).map(p => exInfo(p[0]).n);
    if (missed.length && missed.length <= 3) notes.push("Skipped: "+missed.join(", ")+" — that muscle went untrained.");
  } else comp = Math.min(1, hard/16)*30;

  /* 2) performance vs last time, fatigue-adjusted — 40 pts */
  const res = [];
  w.exercises.forEach((e, pos) => {
    const ex = exInfo(e.id), sets = hardOf(e);
    if (!sets.length) return;
    const now = bestMetric(sets, ex);
    let prev = null, prevPos = 0;
    for (const pw of prior){
      const pe = pw.exercises.find(x => x.id === e.id);
      if (pe){ const ps = hardOf(pe);
        if (ps.length){ prev = bestMetric(ps, ex); prevPos = pw.exercises.indexOf(pe); break; } }
    }
    if (prev === null){ res.push({name:ex.n, cls:"new"}); return; }
    const pct = (now - prev) / prev * 100;
    const prim = muscOf(e.id).p;
    let pre = 0;
    for (let j = 0; j < pos; j++) pre += hardOf(w.exercises[j]).length * creditTo(w.exercises[j].id, prim);
    let recent = 0;
    for (const pw of prior){
      const gap = (new Date(w.date+"T12:00:00") - new Date(pw.date+"T12:00:00")) / 864e5;
      if (gap > 2) break;
      for (const pe of pw.exercises) recent += hardOf(pe).length * creditTo(pe.id, prim);
    }
    const posDelta = Math.max(0, pos - prevPos);
    const tol = 1.5 + Math.min(3, posDelta*0.8) + Math.min(2.5, pre*0.3) + (recent >= 4 ? 2 : 0);
    const why = [];
    if (posDelta) why.push("done "+posDelta+" slot"+(posDelta>1?"s":"")+" later than last time");
    if (pre >= 3) why.push(Math.round(pre)+" earlier sets hit the same muscles");
    if (recent >= 4) why.push("same muscles trained in the last 2 days");
    res.push({name:ex.n, pct, why, cls: pct >= 0.5 ? "win" : pct >= -tol ? "hold" : "miss"});
  });
  const scored = res.filter(r => r.cls !== "new");
  const perfPts = scored.length
    ? scored.reduce((a,r) => a + (r.cls==="win" ? 1 : r.cls==="hold" ? 0.7 : 0.2), 0) / scored.length * 40
    : 28;
  const wins = scored.filter(r => r.cls === "win").sort((a,b) => b.pct - a.pct);
  if (wins.length) notes.push("Biggest win: "+wins[0].name+" +"+wins[0].pct.toFixed(1)+"% e1RM.");
  for (const r of scored){
    if (r.cls === "miss")
      notes.push(r.name+" down "+Math.abs(r.pct).toFixed(1)+"% with no fatigue excuse — watch it.");
    else if (r.cls === "hold" && r.pct < -1.5 && r.why.length)
      notes.push(r.name+" dipped "+Math.abs(r.pct).toFixed(1)+"% — expected ("+r.why[0]+"), not penalized.");
  }

  /* 3) rep quality + volume vs your norm — 20 pts */
  let inR = 0, above = 0;
  for (const e of w.exercises){
    const p = sd && sd.plan.find(x => x[0] === e.id);
    const lo = p ? p[2] : 5, hi = p ? p[3] : 30;
    for (const s of hardOf(e)){ if (+s.r >= lo && +s.r <= hi+2) inR++; if (+s.r > hi+2) above++; }
  }
  const same = w.session ? prior.filter(x => x.session === w.session).slice(0,4) : [];
  const medHard = same.length
    ? same.map(x => x.exercises.reduce((a,e) => a + hardOf(e).length, 0)).sort((a,b) => a-b)[Math.floor(same.length/2)]
    : null;
  const inten = (inR/hard)*12 + (medHard ? Math.min(1, hard/medHard)*8 : 6);
  if (above >= 3) notes.push(above+" sets sailed past the rep range — time to add weight.");

  /* 4) bonus — 10 pts */
  const bonus = Math.min(3, (w.prs||[]).length)*2.5 + (w.cardio ? 2.5 : 0);

  if (notes.length < 4){
    const bm = w.exercises.map(e => e.id).find(id => STD[id] && perfHistory(id).length);
    if (bm){ const sc = liftScores().find(s => s.id === bm);
      if (sc && sc.lv.idx >= 0) notes.push(sc.name+" sits at "+LVLS[sc.lv.idx]+" for your bodyweight."); }
  }
  const score = Math.max(1, Math.min(100, Math.round(comp + perfPts + inten + bonus)));
  const grade = gradeFor(score);
  return {score, grade, g:grade[0], notes:notes.slice(0,4),
    parts:{comp:Math.round(comp), perf:Math.round(perfPts), qual:Math.round(inten), bonus:Math.round(bonus)}};
}
function gradeFor(score){
  return score>=92?"A+":score>=84?"A":score>=76?"B+":score>=68?"B":score>=60?"C+":score>=52?"C":"D";
}
const scoreBadge = (rt, id) => rt
  ? '<button class="badge sc g'+rt.g+' num" data-act="score-why" data-id="'+id+'">'+rt.score+' · '+rt.grade+'</button>' : '';
function openScoreModal(id){
  const w = S.workouts.find(x => x.id === id); if (!w) return;
  const rt = rateWorkout(w); if (!rt) return;
  const row = (label, pts, max, desc) => {
    const pct = pts/max*100;
    return '<div class="lift-row"><div class="rowline"><b>'+label+'</b>'
      + '<span class="lvl num" style="color:'+(pct>=84?"var(--accent)":pct>=60?"var(--text-2)":"var(--warn)")+'">'
      + (max === 10 ? '+'+pts : gradeFor(pct))+' · '+pts+'/'+max+'</span></div>'
      + '<div class="lbar"><span><i style="transform:scaleX('+Math.max(0.02, pct/100).toFixed(2)+')"></i></span></div>'
      + '<div class="sub">'+desc+'</div></div>'; };
  openModal('<h3>'+fmtDate(w.date)+' — <span class="grad-ink">'+rt.score+' · '+rt.grade+'</span></h3>'
    + row("Did the work", rt.parts.comp, 30,
        "Hard sets done vs the day's plan, plus covering every planned muscle. Swapping in a same-muscle exercise still counts.")
    + row("Strength vs last time", rt.parts.perf, 40,
        "Each lift's best e1RM vs your previous session of it — with slack for doing it later in the workout, earlier sets on the same muscles, or having trained them in the last 48 h. Beating = full marks, holding = most, unexplained drops cost.")
    + row("Rep quality & volume", rt.parts.qual, 20,
        "How many hard sets landed inside the target rep range, and total sets vs your own norm for this session type.")
    + row("Bonus", rt.parts.bonus, 10,
        "PRs (+2.5 each, up to 3) and cardio done (+2.5).")
    + (rt.notes.length ? '<div class="mgroup">Notes</div>'
        + rt.notes.map(n => '<p class="hint" style="margin-top:6px">• '+esc(n)+'</p>').join("") : "")
    + '<div class="btnrow"><button data-act="modal-close">Close</button></div>');
}

}
function setsFor(id, planN){

function sparkSVG(tr){
  const pts = tr.slice(-30);
  if (pts.length < 2) return "";
  const W=128,H=34, vals=pts.map(p=>p.t);
  let lo=Math.min(...vals), hi=Math.max(...vals); if (hi-lo<0.5){lo-=0.3;hi+=0.3;}
  const X=i=>i/(pts.length-1)*(W-6)+3, Y=v=>H-4-(v-lo)/(hi-lo)*(H-8);
  const line = pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.t).toFixed(1)).join(" ");
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
    + '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#2CE08B" stop-opacity=".16"/><stop offset="1" stop-color="#2CE08B" stop-opacity="0"/></linearGradient></defs>'
    + '<path d="'+line+' L '+X(pts.length-1).toFixed(1)+' '+H+' L '+X(0).toFixed(1)+' '+H+' Z" fill="url(#sg)"/>'
    + '<path d="'+line+'" fill="none" stroke="#2CE08B" stroke-width="2" stroke-linejoin="round"/>'
    + '<circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(pts[pts.length-1].t).toFixed(1)+'" r="3" fill="#7CF5AE"/></svg>';
}
function rateBadge(rate){
  if (rate === null) return "";
  const inBand = rate <= -0.4 && rate >= -1.1;

  return '<span class="'+cls+' num" style="font-size:13px;font-weight:600">'+(rate>0?"+":"")+rate.toFixed(1)+' lb/wk</span>';
}
function ringSVG(p, center, cap){
  const off = 326.7 * (1 - Math.min(1, Math.max(0, p)));
  return '<div class="ring-wrap"><svg viewBox="0 0 120 120">'
    + '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#17B9A0"/><stop offset="1" stop-color="#7CF5AE"/></linearGradient></defs>'
    + '<circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="11"/>'
    + '<circle class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round"'
    + ' transform="rotate(-90 60 60)" stroke-dasharray="326.7" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'
    + '<div class="ring-center"><span class="num">'+center+'</span><span class="cap">'+cap+'</span></div></div>';
}

let tickInt = null;
const setLogged = s => S.settings.checkOff ? s.done : +s.r > 0;
/* live warm-up detection — same rule finishDraft applies at the end, run as sets land so
   the W shows up in the moment. Reference weight = the heavier of today's top logged set
   and last session's top working set; flags are provisional (wAuto) and a manual tap on
   the set number (wMan) always wins. finishDraft re-derives the final state. */
function liveWarmCheck(ei){
  const d = curDraft(), e = d.exercises[ei];
  if (!e) return;
  const ex = exInfo(e.id);
  const logged = e.sets.map((s, si) => ({s, si})).filter(x => setLogged(x.s));
  if (!logged.length) return;
  const histTop = histTopW(e.id);
  const todayTop = Math.max(...logged.map(x => +x.s.w || 0));
  const effTop = Math.max(todayTop, histTop);
  // repeated sets at today's top weight = a genuinely lighter day, not a warm-up ramp
  const nAtTop = logged.filter(x => (+x.s.w || 0) === todayTop).length;
  const lightDay = histTop > 0 && todayTop <= histTop * 0.75 && nAtTop >= 2;
  let changed = false, flagged = false;
  logged.forEach((x, j) => {
    const s = x.s, w = +s.w || 0;
    if (s.wMan) return;
    const workBefore = logged.slice(0, j).some(y => (+y.s.w || 0) > effTop * 0.75);
    const light = effTop > 0 && ((w > 0 && w <= effTop * 0.75) || (w === 0 && ex.bw));
    const want = light && !workBefore && !(lightDay && w === todayTop);
    if (want === !!s.warm || (!want && !s.wAuto)) return; // never auto-clear a manual W
    s.warm = want; s.wAuto = want; changed = true;
    if (want) flagged = true;
    const row = document.querySelector('.srow[data-ei="'+ei+'"][data-si="'+x.si+'"]');
    if (row){
      row.classList.toggle("warm", want);
      row.querySelector(".snum").textContent = want ? "W" : x.si + 1;
    }
  });
  if (!changed) return;
  if (flagged && !S.warmHint){
    S.warmHint = 1;
    showToast("That looks like a warm-up — marked <b>W</b>. Tap the set number if it was a real set.");
  }
  save();
}

function plateStr(total){
  let per = (total - 45) / 2;
  if (per < 2.4) return "";
  const out = [];
  for (const p of [45, 35, 25, 10, 5, 2.5])
    while (per >= p - 0.01){ out.push(p); per -= p; }
  return out.length ? "bar + " + out.join(" + ") + " / side" + (per > 0.3 ? " ≈" : "") : "";
}

function fmtSec(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tickElapsed(){
  const el = $("#elapsed"); if (!el){ clearInterval(tickInt); return; }
  const d = curDraft();
  if (!d.startedAt){ el.textContent = ""; return; }
  const m = Math.floor((Date.now() - d.startedAt)/60000);

function toggleSet(ei, si){
  const d = curDraft(), e = d.exercises[ei], s = e.sets[si];
  const row = document.querySelector('.srow[data-ei="'+ei+'"][data-si="'+si+'"]');
  if (!s.done){
    const wIn = row.querySelector(".w"), rIn = row.querySelector(".r");
    const w = wIn.value !== "" ? wIn.value : wIn.placeholder;
    const r = rIn.value !== "" ? rIn.value : rIn.placeholder;
    if (!(+r > 0)){ row.classList.add("shake"); setTimeout(() => row.classList.remove("shake"), 350); return; }
    s.w = String(+w || 0); s.r = String(+r); s.done = true;
    wIn.value = s.w === "0" ? "" : s.w; rIn.value = s.r;
    row.classList.add("done");
    if (!s.warm){
      const ex = exInfo(e.id), m = metric(s, ex), prevBest = bestEver(e.id);
      if (prevBest > 0 && m > prevBest + 0.01){
        let msg = "<b class='wr'>PR</b> — "+esc(ex.n)+" "+(+s.w ? s.w+" × "+s.r : s.r+" reps");
        const std = STD[e.id];
        if (std){
          const bw = bodyweight(), fem = S.settings.sex === "female" ? 0.72 : 1;
          const rNew = (std.bwTotal ? (bw + (+s.w||0))*(1+(+s.r)/30) : m) / bw / fem;
          const rOld = (std.bwTotal ? (bw + prevBest*0+((prevBest))) : prevBest) / bw / fem; // conservative
          const iNew = lvlOf(rNew, std.t).idx, iOld = lvlOf(prevBest/bw/fem, std.t).idx;
          if (iNew > iOld && iNew >= 0) msg += " · <b style='color:var(--accent)'>→ "+LVLS[iNew]+"</b>";
        }
        showToast(msg);
      }
    }
    if (d.date === todayStr()) startTimer(restFor(e.id), exInfo(e.id).n);
  } else {
    s.done = false; row.classList.remove("done");
  }
  save();
  liveWarmCheck(ei);
  const total = d.exercises.reduce((a,x) => a + x.sets.length, 0);
  const doneN = d.exercises.reduce((a,x) => a + x.sets.filter(t => t.done).length, 0);
  const sc = $("#setcount"); if (sc) sc.textContent = doneN+"/"+total;
  if (s.done && e.sets.every(x => x.done)){
    let nxt = -1;
    for (let j = ei+1; j < d.exercises.length; j++)
      if (!d.exercises[j].sets.every(u => u.done)){ nxt = j; break; }
    e.open = false;
    if (nxt >= 0) d.exercises[nxt].open = true;
    save(); render();
    if (nxt >= 0){ const el = document.querySelector('.xcard[data-ei="'+nxt+'"]');
      if (el) el.scrollIntoView({block:"center", behavior:"smooth"}); }
  }
}

let timerInt = null;
function startTimer(sec, name){
  const d = curDraft();
  d.timer = {end: Date.now() + sec*1000, ex: name}; save();
  syncTimerUI();
}
function syncTimerUI(){
  const d = S.drafts[S.editing || todayStr()];
  const t = $("#timer");
  clearInterval(timerInt);
  if (!d || !d.active || !d.timer || d.timer.end <= Date.now()){
    if (d && d.timer && d.timer.end <= Date.now()){ d.timer = null; save(); }
    t.classList.remove("show"); return;
  }
  t.classList.add("show");
  $("#t-ex").textContent = d.timer.ex || "";
  const upd = () => {
    const left = Math.round((d.timer.end - Date.now())/1000);
    if (left <= 0){ timerDone(); return; }
    $("#t-left").textContent = fmtSec(left);
  };
  upd(); timerInt = setInterval(upd, 250);
}
function timerDone(){
  clearInterval(timerInt);
  const d = curDraft(); d.timer = null; save();
  const t = $("#timer");
  $("#t-left").textContent = "0:00";
  t.classList.add("flash");
  if (S.settings.vibrate && navigator.vibrate) navigator.vibrate([180,90,180]);
  if (S.settings.sound) beep();
  setTimeout(() => { t.classList.remove("flash","show"); }, 1600);
}
let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [0, 0.22].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
      o.start(t0); o.stop(t0+0.18);
    });
  } catch(e){}
}
let wl = null;
async function wakeLock(){
  try { if (!wl && navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  wl = null;
  const d = S.drafts[S.editing || todayStr()];
  if (document.visibilityState === "visible" && d && d.active){ wakeLock(); syncTimerUI(); }
});
function showToast(html){
  const t = $("#toast");
  t.innerHTML = html; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(t._to); t._to = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ================= finish ================= */
function computePRs(kept){
  const prs = [];
  for (const e of kept){
    const ex = exInfo(e.id), sets = workSets(e.sets);
    if (!sets.length) continue;
    const hist = perfHistory(e.id);
    if (!hist.length) continue;
    const prev = Math.max(...hist.map(h => bestMetric(h.sets, ex)));
    const now = bestMetric(sets, ex);
    if (now > prev + 0.01){
      const bs = bestSet(sets, ex);
      prs.push({id:e.id, name:ex.n, str:(+bs.w||0)+" × "+bs.r});
    }
  }
  return prs;
}
let lastAutoWarm = 0;
function finishDraft(dateStr, silent){
  const d = S.drafts[dateStr];
  if (!d) return false;
  const chk = S.settings.checkOff;
  /* auto-detect warm-ups: light sets logged BEFORE the day's top weight are lead-in
     warm-ups (≤75% of the heavier of today's top and last session's top working set);
     light back-off sets AFTER the top weight stay working sets. This pass is the final
     word over the live detection: provisional (wAuto) flags are re-derived from what was
     actually logged, manual taps (wMan) are never touched. */
  lastAutoWarm = 0;
  for (const e of d.exercises){
    const ex = exInfo(e.id);
    const wasWarm = e.sets.map(s => !!s.warm);
    for (const s of e.sets) if (s.wAuto && !s.wMan){ s.warm = false; s.wAuto = false; }
    const logged = e.sets.filter(s => +s.r > 0 && (chk ? s.done : true));
    if (logged.length < 2) continue;
    const topW = Math.max(...logged.map(s => +s.w || 0));
    if (!(topW > 0)) continue;
    const effTop = Math.max(topW, histTopW(e.id));
    const topIdx = logged.findIndex(s => (+s.w || 0) === topW);
    logged.forEach((s, j) => {
      if (j >= topIdx || s.warm || s.wMan) return;
      const w = +s.w || 0;
      if ((w > 0 && w <= effTop * 0.75) || (w === 0 && ex.bw)){
        s.warm = true; s.wAuto = true;
        if (!wasWarm[e.sets.indexOf(s)]) lastAutoWarm++;
      }
    });
  }
  if (chk){
    const unchecked = d.exercises.reduce((a,e) => a + e.sets.filter(s => !s.done && (+s.r>0 || +s.w>0)).length, 0);
    if (!silent && unchecked && !confirm(unchecked+" set(s) have numbers but no check — they'll be dropped. Finish anyway?")) return false;
  } else {
    // reps typed + weight left blank → adopt the ghost suggestion, same as tapping the check used to
    for (const e of d.exercises){
      const a = analyze(e.id, e.plan);
      e.sets.forEach((s, si) => {
        if (+s.r > 0 && s.w === ""){ const gw = a.gW(si); if (+gw) s.w = gw; }
      });
    }
  }
  const kept = d.exercises
    .map(e => ({id:e.id, note:e.note||"", sets:e.sets.filter(s => (chk ? s.done : true) && +s.r > 0)
      .map(s => ({w:+s.w||0, r:+s.r, warm:!!s.warm}))}))
    .filter(e => e.sets.length);
  if (!kept.length){ if (!silent) alert("Check off at least one set first."); return false; }
  const prs = computePRs(kept);
  S.workouts = S.workouts.filter(w => w.date !== dateStr);
  S.workouts.push({id:dateStr.replace(/-/g,"")+"-"+Math.floor(Math.random()*1e6),
    date:dateStr, session:d.session, sesName:(sesDef(d.session)||{}).name || "Custom",
    exercises:kept, cardio:d.cardio.on ? {min:+d.cardio.min || 20} : null,
    note:(d.note||"").trim(), prs,
    durMin:(dateStr === todayStr() && d.startedAt) ? Math.round((Date.now()-d.startedAt)/60000) : null});
  delete S.drafts[dateStr];
  if (S.editing === dateStr) S.editing = null;
  if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  save();
  return prs;
}

function trendsBody(){

    const days = Math.round((goal-cur)/(rate/7));

  }
  const tdee = impliedTDEE();
  html += '<div class="grid2" style="margin-bottom:12px">'
    + '<div class="card"><span class="lbl">Trend weight</span><div class="stat num" style="margin-top:6px">'+cur.toFixed(1)+'<small> lb</small></div>'
    + '<div class="cap num" style="margin-top:3px">scale today: '+(S.body.weights[todayStr()] || "—")+'</div></div>'
    + '<div class="card"><span class="lbl">Weekly rate</span><div style="font-size:21px;font-weight:700;margin-top:6px">'+(rate!==null?rateBadge(rate):'<span class="hint">need ~1 wk</span>')+'</div>'
    + '<div class="cap" style="margin-top:3px">cut band −0.5 to −1.0</div>'+proj+'</div></div>';
  if (tdee) html += '<div class="card rowline"><div class="grow"><span class="lbl">Your real maintenance</span>'
    + '<div class="stat num" style="margin-top:4px">≈ '+tdee.toLocaleString()+'<small> kcal</small></div></div>'
    + '<div class="cap" style="max-width:150px">from your last 3 weeks of intake vs trend change</div></div>';
  html += '<div class="card"><span class="lbl">Weight</span><div class="cap" style="margin:4px 0 8px">dots are scale days — the line is your real trend</div>'
    + '<div class="chartwrap">'+weightChart(ws, tr, goal)+'<div id="ctip"></div></div></div>';
  // measurements
  const wst = measEntries("waist");
  html += '<div class="card"><div class="rowline"><span class="lbl grow">Measurements</span>'
    + '<button class="small" data-act="ms-open">Log</button></div>';

        + (dW2 > 0 ? "+" : "")+dW2.toFixed(1)+'" since first log</small>' : '')+'</div>'
      + measChart(wst);
    for (const [k, label] of [["arm","Upper arm"],["thigh","Thigh"]]){

        + (es.length > 1 ? ' <span class="'+(d2 > 0.05 ? "up" : d2 < -0.05 ? "wr" : "fl")+'" style="font-size:12px">'+(d2 > 0 ? "+" : "")+d2.toFixed(1)+'"</span>' : '')+'</b></div>';

function trendsStrength(){
  const ids = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.id)))]
    .filter(id => perfHistory(id).length)
    .sort((a,b) => exInfo(a).n.localeCompare(exInfo(b).n));
  if (!ids.length) return '<div class="card hint">Finish a workout or two first.</div>';
  if (!S.progSel || !ids.includes(S.progSel)) S.progSel = ids[0];
  const ex = exInfo(S.progSel);
  const hist = perfHistory(S.progSel).reverse();
  const pts = hist.map(h => { const bs = bestSet(h.sets, ex);
    return {date:h.date, val:Math.round(bestMetric(h.sets, ex)), lbl:(+bs.w||0)+" × "+bs.r}; });
  const isReps = ex.bw && hist.every(h => h.sets.every(s => !+s.w));
  const best = pts.reduce((a,b) => b.val >= a.val ? b : a);
  const delta = pts[pts.length-1].val - pts[0].val;
  let html = '<div class="card" style="padding:12px"><select id="prog-sel">'
    + ids.map(id => '<option value="'+id+'"'+(id===S.progSel?" selected":"")+'>'+esc(exInfo(id).n)+'</option>').join("")+'</select></div>';
  html += '<div class="card"><span class="lbl">'+esc(ex.n)+' — '+(isReps?"best reps":"est. 1RM")+'</span>'
    + '<div class="chartwrap" style="margin-top:8px">'+e1rmChart(pts)+'<div id="ctip"></div></div></div>';
  html += '<div class="grid2" style="margin-bottom:12px">'
    + '<div class="card"><span class="lbl">Best ever</span><div class="stat num" style="font-size:21px;margin-top:6px">'+best.val+'<small> '+(isReps?"reps":"lb")+'</small></div>'
    + '<div class="cap num">'+best.lbl+' · '+fmtShort(best.date)+'</div></div>'
    + '<div class="card"><span class="lbl">Since first log</span><div class="stat num '+(delta>=0?"up":"dn")+'" style="font-size:21px;margin-top:6px">'
    + (delta>=0?"+":"")+delta+'<small> '+(isReps?"reps":"lb")+'</small></div></div></div>';
  html += '<div class="card"><table><tr><th>Date</th><th>Sets</th><th>Best</th></tr>'
    + [...hist].reverse().slice(0,10).map(h => {
        const bs = bestSet(h.sets, ex);
        return '<tr><td class="num">'+fmtShort(h.date)+'</td><td class="num">'+h.sets.map(s => (+s.w? s.w+"×"+s.r : s.r)).join(", ")
          + '</td><td class="num">'+(+bs.w||0)+"×"+bs.r+'</td></tr>'; }).join("")
    + '</table></div>';
  return html;
}

/* ===== body silhouette heat map ===== */
function bodySVG(){
  const F = 110, B = 330; // center x of front/back figures
  const limb = (cx,y,w,h,r,reg) => '<rect x="'+(cx-w/2)+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" data-region="'+reg+'"/>';
  const idle = (cx,y,w,h,r) => '<rect x="'+(cx-w/2)+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" class="sil"/>';
  let s = '<svg viewBox="0 0 440 330" style="width:100%;max-width:360px;margin:0 auto;display:block" id="heatmap">';
  s += '<style>#heatmap .sil{fill:var(--bg-2)} #heatmap rect,#heatmap circle,#heatmap polygon{stroke:rgba(255,255,255,.07);stroke-width:1}</style>';

    const ss = workSets(e.sets); if (!ss.length) continue;

function strengthIndex(group){

  const ids = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.id)))]
    .filter(id => { const g = exInfo(id).g;
      if (group === "arms") return g === "biceps" || g === "triceps";
      return !group || g === group; });
  const per = ids.map(id => ({id, wk:bestE1ByWeek(id)})).filter(L => Object.keys(L.wk).length >= 2);
  if (!per.length) return [];
  const out = [], cur = {}, base = {};
  for (const ws of weeks){
    let sum = 0, n = 0;
    for (const L of per){
      if (L.wk[ws]){ if (base[L.id] === undefined) base[L.id] = L.wk[ws]; cur[L.id] = L.wk[ws]; }
      if (cur[L.id] !== undefined){ sum += cur[L.id]/base[L.id]*100; n++; }
    }

  }

}

function bestPlainUpTo(id, dateEnd){

    const ss = workSets(e.sets); if (ss.length) m = Math.max(m, bestMetric(ss, ex)); }

}
function highlights(){

function exProgress(id){
  const hist = perfHistory(id); if (hist.length < 2) return null;
  const ex = exInfo(id);
  const b0 = bestPlainUpTo(id, addDays(todayStr(), -28));
  const b1 = bestPlainUpTo(id, todayStr());
  const pct = b0 > 0 ? (b1-b0)/b0*100 : null;
  const best = Math.max(...hist.map(h => bestMetric(h.sets, ex)));
  let since = 0;
  for (const h of hist){ if (bestMetric(h.sets, ex) >= best - 0.01) break; since++; }
  return {pct, since, n:hist.length};
}
function exScore(p){
  if (!p) return null;
  let s;
  if (p.pct === null) s = 75;
  else if (p.pct >= 3) s = 95; else if (p.pct >= 1) s = 88; else if (p.pct >= 0) s = 81;
  else if (p.pct >= -2) s = 68; else s = 55;
  if (p.since >= 4) s = Math.min(s, 60); else if (p.since >= 3) s = Math.min(s, 72);
  return s;
}

function volScore(wv, isSub){
  if (isSub) return wv >= 4 && wv <= 12 ? 50 : wv >= 3 || (wv > 12 && wv <= 16) ? 42 : wv >= 1.5 ? 28 : wv > 0 ? 15 : 0;
  return wv >= 10 && wv <= 20 ? 50 : (wv >= 8 || (wv > 20 && wv <= 24)) ? 42 : wv > 24 ? 35 : wv >= 6 ? 32 : wv >= 3 ? 20 : wv > 0 ? 10 : 0;

const MUSC_SUBS = {chest:[["chest_up","Upper chest"],["chest_low","Mid & lower chest"]],
  shoulders:[["delt_front","Front delts"],["delt_side","Side delts"],["delt_rear","Rear delts"]]};
function muscleReport(){
  const days = 28, ids28 = trainedIds(days);
  const {per} = regionVolume(addDays(todayStr(), -days+1), todayStr());
  const avgPctFor = ids => {
    const ps = ids.map(exProgress).filter(p => p && p.pct !== null).map(p => p.pct);
    return ps.length ? ps.reduce((a,b) => a+b, 0)/ps.length : null;
  };
  const rows = [];
  const majors = [["chest","Chest"],["shoulders","Shoulders"],["lats","Lats"],["upper_back","Upper back"],
    ["biceps","Biceps"],["triceps","Triceps"],["quads","Quads"],["hamstrings","Hamstrings"],
    ["calves","Calves"],["core","Core"]];
  for (const [r, label] of majors){
    const wv = (per[r]||0)/(days/7);
    if (!wv) continue;
    const avgP = avgPctFor(ids28.filter(id => muscOf(id).p.includes(r)));
    rows.push({label, wv, avgP, score:volScore(wv,false)+progScore(avgP), sub:false});

        score: sv > 0 ? volScore(sv,true)+progScore(sp) : 0, sub:true, untrained: sv === 0});
    }

}

function labBars(pts, fmt){
  if (pts.length < 2) return '<p class="hint" style="padding:8px 0">A couple of weeks of data and this charts itself.</p>';
  const W=360,H=170,L=42,R=8,T=12,B=22;
  const hi = Math.max(...pts.map(p => p.val), 1)*1.12;
  const X = i => L + (W-L-R)*(i/(pts.length-1));
  const Y = v => T + (H-T-B)*(1 - v/hi);
  const bw2 = Math.max(Math.min((W-L-R)/pts.length*0.62, 20), 3);
  let g = "";
  for (let i=1;i<4;i++){ const v = hi*i/4, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+fmt(v)+'</text>'; }
  const bars = pts.map((p,i) =>
    '<rect class="pt" x="'+(X(i)-bw2/2).toFixed(1)+'" y="'+Y(p.val).toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+(Y(0)-Y(p.val)).toFixed(1)+'" rx="2" fill="'
    + (i === pts.length-1 ? "#2CE08B" : "rgba(255,255,255,.28)")+'" data-d="'+p.d+'" data-v="'+fmt(p.val)+'" data-l="that week"/>').join("");
  const xl = [0, pts.length-1].map(i =>
    '<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(pts[i].d)+'</text>').join("");
  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'">'+g+bars+xl+'</svg></div>';
}

    '<text x="'+X(dsx).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(dsx)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="weight trend">'
    + '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#2CE08B" stop-opacity=".16"/><stop offset="1" stop-color="#2CE08B" stop-opacity="0"/></linearGradient></defs>'
    + g + '<path d="'+area+'" fill="url(#wg)"/>' + dots

    + '<path d="'+line+'" fill="none" stroke="#2CE08B" stroke-width="2.5" stroke-linejoin="round"/>'+xlab+'</svg>';
}
function kcalChart(ks){
  const start = windowStart();
  const k2 = ks.filter(e => e.d >= start);
  if (!k2.length) return '<p class="hint" style="padding:8px 0">No calorie logs in this window.</p>';
  const W=360,H=180,L=40,R=10,T=10,B=22;
  const target = S.settings.kcalTarget;
  const hi = Math.max(...k2.map(e=>e.k), target) * 1.08;
  const t0 = new Date((S.range ? start : k2[0].d)+"T12:00:00")*1;
  const t1 = new Date(todayStr()+"T12:00:00")*1;
  const days = Math.max(Math.round((t1-t0)/864e5)+1, 2);
  const X = ds => L + (W-L-R) * ((new Date(ds+"T12:00:00")*1 - t0) / Math.max(t1-t0, 864e5));
  const Y = v => T + (H-T-B) * (1 - v/hi);
  const bw2 = Math.max(Math.min((W-L-R)/days*0.65, 14), 2);
  let g = "";
  for (let i=1;i<4;i++){ const v = hi*i/4, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+(Math.round(v/50)*50/1000).toFixed(1)+'k</text>'; }
  const bars = k2.map((p,i) =>
    '<rect class="pt" x="'+(X(p.d)-bw2/2).toFixed(1)+'" y="'+Y(p.k).toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+(Y(0)-Y(p.k)).toFixed(1)+'" rx="2" fill="'+(i===k2.length-1?"#2CE08B":"rgba(255,255,255,.25)")+'" data-d="'+p.d+'" data-v="'+p.k.toLocaleString()+' kcal" data-l="eaten"/>').join("");
  const avg = k2.map(p => { const win = k2.filter(q => q.d <= p.d && q.d > addDays(p.d,-7));
    return {d:p.d, v:win.reduce((a,q)=>a+q.k,0)/win.length}; });
  const avgPath = avg.length > 1 ? '<path d="'+avg.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")
    + '" fill="none" stroke="#2CE08B" stroke-width="2" opacity=".8"/>' : "";
  const tl = '<line x1="'+L+'" y1="'+Y(target)+'" x2="'+(W-R)+'" y2="'+Y(target)+'" stroke="rgba(255,255,255,.38)" stroke-dasharray="5 4"/>'
    + '<text x="'+(W-R)+'" y="'+(Y(target)-4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.62)">target</text>';
  const xlab = [k2[0].d, k2[k2.length-1].d].filter((v,i,a)=>a.indexOf(v)===i).map(dsx =>
    '<text x="'+X(dsx).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(dsx)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="daily calories">'+g+bars+avgPath+tl+xlab+'</svg>';
}
function e1rmChart(pts){
  if (pts.length < 2) return '<p class="hint" style="padding:8px 0">Log this lift twice to see a trend.</p>';
  const W=360,H=190,L=40,R=12,T=14,B=26;
  const vals = pts.map(p=>p.val);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 5; hi += 5; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;
  const X = i => L + (W-L-R)*(i/(pts.length-1));
  const Y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = "";
  for (let t=0;t<4;t++){ const v = lo+(hi-lo)*t/3, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+Math.round(v)+'</text>'; }
  const path = pts.map((p,i) => (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.val).toFixed(1)).join(" ");
  const dots = pts.map((p,i) =>
    '<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.val).toFixed(1)+'" r="4.5" fill="#2CE08B" stroke="#14161A" stroke-width="2" data-d="'+p.date+'" data-v="'+p.val+'" data-l="'+esc(p.lbl)+'"/>').join("");
  const xi = [...new Set([0, Math.floor((pts.length-1)/2), pts.length-1])];
  const xlab = xi.map(i => '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(pts[i].date)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="strength trend">'
    + g+'<path d="'+path+'" fill="none" stroke="#2CE08B" stroke-width="7" stroke-linejoin="round" opacity=".14"/>'
    + '<path d="'+path+'" fill="none" stroke="#2CE08B" stroke-width="2" stroke-linejoin="round"/>'+dots+xlab+'</svg>';
}

function mdLite(t){
  const lines = esc(t).split("\n");
  let out = "", inList = false;
  for (const raw of lines){
    const l = raw.trim();
    if (/^[-*•] /.test(l)){
      if (!inList){ out += "<ul>"; inList = true; }
      out += "<li>" + l.slice(2) + "</li>";
    } else {
      if (inList){ out += "</ul>"; inList = false; }
      if (/^#{1,4} /.test(l)) out += "<p><b>" + l.replace(/^#{1,4} /, "") + "</b></p>";
      else if (l) out += "<p>" + l + "</p>";
    }
  }
  if (inList) out += "</ul>";
  return out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

async function askCoach(q){
  if (S.coach.some(x => x.pending)){ showToast("One question at a time — the coach is still thinking."); return; }
  const entry = {q, a:"", pending:true, t:todayStr()};
  S.coach.push(entry);
  if (S.coach.length > 20) S.coach = S.coach.slice(-20);
  save(); if (tab === "coach") renderCoach();
  const sys = "You are an evidence-based strength and nutrition coach inside LiftLog, the user's personal workout tracker. "
    + "Be direct, specific and practical. Reference their actual numbers from the data below. "
    + "Keep answers tight — a few short paragraphs or bullet points, no filler, no generic disclaimers. "
    + "The user is a returning lifter on a 6-day split, currently cutting.\n\n"
    + "Their current data:\n\n" + claudeText();
  const msgs = [];
  for (const x of S.coach.slice(-5, -1))
    if (!x.pending && x.a && !x.err){ msgs.push({role:"user", content:x.q}); msgs.push({role:"assistant", content:x.a}); }
  msgs.push({role:"user", content:q});
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        max_tokens: 16000,
        output_config: {effort: "medium"},
        system: sys,
        messages: msgs
      })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok){
      entry.err = true;
      entry.a = res.status === 401
        ? "That API key was rejected — double-check it in Settings."
        : "The coach couldn't answer (" + (data && data.error ? data.error.message : "HTTP " + res.status) + ").";
    } else if (data.stop_reason === "refusal"){
      entry.err = true;
      entry.a = "The coach declined that one — try rephrasing.";
    } else {
      entry.a = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim() || "(no answer)";
      if (data.stop_reason === "max_tokens") entry.a += "\n\n(…answer was cut short)";
    }
  } catch(e){
    entry.err = true;
    entry.a = "Network error — are you online?";
  }
  entry.pending = false; save();
  if (tab === "coach") renderCoach();
}
