function weightChart(ws, tr, goal){
  const start = windowStart();
  const w2 = ws.filter(e => e.d >= start), t2 = tr.filter(e => e.d >= start);
  if (t2.length < 2) return '<p class="hint" style="padding:8px 0">A few more weigh-ins and the chart appears.</p>';
  const W=360,H=200,L=38,R=10,T=10,B=22;
  const t0 = new Date(t2[0].d+"T12:00:00")*1, t1 = new Date(t2[t2.length-1].d+"T12:00:00")*1;
  const vals = [...w2.map(e=>e.w), ...t2.map(e=>e.t)]; if (goal) vals.push(goal);
  let lo = Math.min(...vals)-0.6, hi = Math.max(...vals)+0.6;
  const X = ds => L + (W-L-R) * ((new Date(ds+"T12:00:00")*1 - t0) / Math.max(t1-t0, 864e5));
  const Y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
  let g = "";
  for (let i=0;i<4;i++){ const v = lo+(hi-lo)*i/3, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+v.toFixed(1)+'</text>'; }
  if (goal && goal > lo && goal < hi)
    g += '<line x1="'+L+'" y1="'+Y(goal)+'" x2="'+(W-R)+'" y2="'+Y(goal)+'" stroke="rgba(255,255,255,.38)" stroke-dasharray="5 4"/>';
  const line = t2.map((p,i) => (i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.t).toFixed(1)).join(" ");
  const area = line + " L "+X(t2[t2.length-1].d).toFixed(1)+" "+(H-B)+" L "+X(t2[0].d).toFixed(1)+" "+(H-B)+" Z";
  const dots = w2.map(p =>
    '<circle class="pt" cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="3" fill="#FFFFFF" fill-opacity=".25" data-d="'+p.d+'" data-v="'+p.w+' lb" data-l="scale"/>').join("");
  const xi = [t2[0].d, t2[Math.floor((t2.length-1)/2)].d, t2[t2.length-1].d];
  const xlab = [...new Set(xi)].map(dsx =>
    '<text x="'+X(dsx).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(dsx)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="weight trend">'
    + '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#2CE08B" stop-opacity=".16"/><stop offset="1" stop-color="#2CE08B" stop-opacity="0"/></linearGradient></defs>'
    + g + '<path d="'+area+'" fill="url(#wg)"/>' + dots
    + '<path d="'+line+'" fill="none" stroke="#2CE08B" stroke-width="8" stroke-linejoin="round" opacity=".14"/>'
    + '<path d="'+line+'" fill="none" stroke="#2CE08B" stroke-width="2.5" stroke-linejoin="round"/>'+xlab+'</svg>';
}
function kcalChart(ks){
  const start = windowStart();
  const k2 = ks.filter(e => e.d >= start);
  if (!k2.length) return '<p class="hint" style="padding:8px 0">No calorie logs in this window.</p>';
  const W=360,H=180,L=40,R=10,T=10,B=22;
  const target = S.settings.kcalTarget;
  const hi = Math.max(...k2.map(e=>e.k), target) * 1.08;
  const t0 = new Date((S.range ? start : k2[0].d)+"T12:00:00")*1;
  const t1 = new Date(todayStr()+"T12:00:00")*1;
  const days = Math.max(Math.round((t1-t0)/864e5)+1, 2);
  const X = ds => L + (W-L-R) * ((new Date(ds+"T12:00:00")*1 - t0) / Math.max(t1-t0, 864e5));
  const Y = v => T + (H-T-B) * (1 - v/hi);
  const bw2 = Math.max(Math.min((W-L-R)/days*0.65, 14), 2);
  let g = "";
  for (let i=1;i<4;i++){ const v = hi*i/4, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+(Math.round(v/50)*50/1000).toFixed(1)+'k</text>'; }
  const bars = k2.map((p,i) =>
    '<rect class="pt" x="'+(X(p.d)-bw2/2).toFixed(1)+'" y="'+Y(p.k).toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+(Y(0)-Y(p.k)).toFixed(1)+'" rx="2" fill="'+(i===k2.length-1?"#2CE08B":"rgba(255,255,255,.25)")+'" data-d="'+p.d+'" data-v="'+p.k.toLocaleString()+' kcal" data-l="eaten"/>').join("");
  const avg = k2.map(p => { const win = k2.filter(q => q.d <= p.d && q.d > addDays(p.d,-7));
    return {d:p.d, v:win.reduce((a,q)=>a+q.k,0)/win.length}; });
  const avgPath = avg.length > 1 ? '<path d="'+avg.map((p,i)=>(i?"L":"M")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")
    + '" fill="none" stroke="#2CE08B" stroke-width="2" opacity=".8"/>' : "";
  const tl = '<line x1="'+L+'" y1="'+Y(target)+'" x2="'+(W-R)+'" y2="'+Y(target)+'" stroke="rgba(255,255,255,.38)" stroke-dasharray="5 4"/>'
    + '<text x="'+(W-R)+'" y="'+(Y(target)-4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.62)">target</text>';
  /* date labels: skip any that would collide (clustered logs used to overlap) */
  const xR2 = X(k2[k2.length-1].d), xL2 = X(k2[0].d);
  let labDs = xR2 - xL2 < 48 ? [k2[k2.length-1].d] : [k2[0].d, k2[k2.length-1].d];
  if (k2.length > 2 && xR2 - xL2 >= 150){
    const mid = k2[Math.floor(k2.length/2)].d, xm = X(mid);
    if (xm - xL2 >= 48 && xR2 - xm >= 48) labDs = [k2[0].d, mid, k2[k2.length-1].d];
  }
  const xlab = [...new Set(labDs)].map(dsx => {
    const lx = Math.max(L+14, Math.min(W-16, X(dsx)));
    return '<text x="'+lx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(dsx)+'</text>'; }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="daily calories">'+g+bars+avgPath+tl+xlab+'</svg>';
}
function e1rmChart(pts){
  if (pts.length < 2) return '<p class="hint" style="padding:8px 0">Log this lift twice to see a trend.</p>';
  const W=360,H=190,L=40,R=12,T=14,B=26;
  const vals = pts.map(p=>p.val);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 5; hi += 5; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;
  const X = i => L + (W-L-R)*(i/(pts.length-1));
  const Y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g = "";
  for (let t=0;t<4;t++){ const v = lo+(hi-lo)*t/3, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)"/>'
      + '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="rgba(255,255,255,.38)">'+Math.round(v)+'</text>'; }
  const path = pts.map((p,i) => (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.val).toFixed(1)).join(" ");
  const dots = pts.map((p,i) =>
    '<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.val).toFixed(1)+'" r="4.5" fill="#2CE08B" stroke="#14161A" stroke-width="2" data-d="'+p.date+'" data-v="'+p.val+'" data-l="'+esc(p.lbl)+'"/>').join("");
  const xi = [...new Set([0, Math.floor((pts.length-1)/2), pts.length-1])];
  const xlab = xi.map(i => '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.38)">'+fmtShort(pts[i].date)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="strength trend">'
    + g+'<path d="'+path+'" fill="none" stroke="#2CE08B" stroke-width="7" stroke-linejoin="round" opacity=".14"/>'
    + '<path d="'+path+'" fill="none" stroke="#2CE08B" stroke-width="2" stroke-linejoin="round"/>'+dots+xlab+'</svg>';
}

function mdLite(t){
  const lines = esc(t).split("\n");
  let out = "", inList = false;
  for (const raw of lines){
    const l = raw.trim();
    if (/^[-*•] /.test(l)){
      if (!inList){ out += "<ul>"; inList = true; }
      out += "<li>" + l.slice(2) + "</li>";
    } else {
      if (inList){ out += "</ul>"; inList = false; }
      if (/^#{1,4} /.test(l)) out += "<p><b>" + l.replace(/^#{1,4} /, "") + "</b></p>";
      else if (l) out += "<p>" + l + "</p>";
    }
  }
  if (inList) out += "</ul>";
  return out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

async function askCoach(q){
  if (S.coach.some(x => x.pending)){ showToast("One question at a time — the coach is still thinking."); return; }
  const entry = {q, a:"", pending:true, t:todayStr()};
  S.coach.push(entry);
  if (S.coach.length > 20) S.coach = S.coach.slice(-20);
  save(); if (tab === "coach") renderCoach();
  /* grounded coach (phase 4): the app computes, the model narrates — an LLM coach is only
     trusted when every number it says is one the app derived deterministically */
  const sys = "You are the coach inside LiftLog, the user's personal workout tracker. "
    + "Evidence-based strength and nutrition coaching — direct, specific, practical. "
    + "Keep answers tight: a few short paragraphs or bullet points, no filler, no generic disclaimers. "
    + "The user is a returning lifter on a 6-day split (Saturday off), currently cutting.\n\n"
    + "GROUNDING RULES (hard rules):\n"
    + "- The app has already computed every number in the data block below: e1RMs, trends, session scores, "
    + "recovery clocks, weekly volume vs each muscle's own growth zone, readiness scaling, targeted deloads, "
    + "PR taxonomy, maintenance calories. Your job is to NARRATE and INTERPRET those numbers — never to compute new ones.\n"
    + "- No arithmetic. Don't add weights, project rates, convert units, or estimate percentages, calories or dates. "
    + "Every number you state must appear verbatim in the data block.\n"
    + "- If a question needs data that isn't below, say the app doesn't track it — don't estimate or fill the gap "
    + "with a made-up personal stat. General training science, technique and exercise-selection advice is welcome; "
    + "invented numbers about THIS user are not.\n"
    + "- Load suggestions: point to the app's own targets (its suggested/ghost weights, deload targets, readiness "
    + "scaling) instead of inventing a load.\n"
    + "- Respect the RECOVERY CLOCKS, the user's own check-ins, and the rest day — Saturday is the program's rest "
    + "day; don't prescribe training on it unless the user insists.\n\n"
    + "Their current data (computed by the app just now):\n\n" + claudeText();
  const msgs = [];
  for (const x of S.coach.slice(-5, -1))
    if (!x.pending && x.a && !x.err){ msgs.push({role:"user", content:x.q}); msgs.push({role:"assistant", content:x.a}); }
  msgs.push({role:"user", content:q});
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        max_tokens: 16000,
        output_config: {effort: "medium"},
        system: sys,
        messages: msgs
      })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok){
      entry.err = true;
      entry.a = res.status === 401
        ? "That API key was rejected — double-check it in Settings."
        : "The coach couldn't answer (" + (data && data.error ? data.error.message : "HTTP " + res.status) + ").";
    } else if (data.stop_reason === "refusal"){
      entry.err = true;
      entry.a = "The coach declined that one — try rephrasing.";
    } else {
      entry.a = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim() || "(no answer)";
      if (data.stop_reason === "max_tokens") entry.a += "\n\n(…answer was cut short)";
    }
  } catch(e){
    entry.err = true;
    entry.a = "Network error — are you online?";
  }
  entry.pending = false; save();
  if (tab === "coach") renderCoach();
}

function applyTemplate(key){
  const d = curDraft(), def = sesDef(key);
  if (!def) return;
  const kept = d.exercises.filter(e => e.sets.some(s => s.done || +s.r > 0));
  const have = new Set(kept.map(e => e.id));
  for (const p of def.plan){
    if (have.has(p[0])){
      const e = kept.find(x => x.id === p[0]);
      e.plan = {n:p[1], lo:p[2], hi:p[3]};
      if (p[4]) e.ss = p[4];
      continue;
    }
    kept.push({id:p[0], plan:{n:p[1],lo:p[2],hi:p[3]}, note:"", open:false,
      ss:p[4] || undefined, sets:setsFor(p[0], p[1])});
  }
  d.exercises = kept;
  d.session = key; delete d.bname;
  d.exercises.forEach(e => e.open = false);
  const nxt = d.exercises.find(e => !e.sets.some(setLogged));
  if (nxt) nxt.open = true;
  save(); render();
  showToast('Loaded "'+def.name+'"'+(have.size ? " — what you'd logged stayed put." : "."));
}

/* link two draft exercises into a superset group and pull them adjacent */
function linkSS(ei, j){
  const d = curDraft(), e = d.exercises[ei], p = d.exercises[j];
  if (!e || !p || e === p) return;
  const old = e.ss;
  const g = p.ss || old || Math.max(0, ...d.exercises.map(x => x.ss || 0)) + 1;
  e.ss = g; p.ss = g;
  if (old && old !== g){
    const left = d.exercises.filter(x => x !== e && x.ss === old);
    if (left.length < 2) left.forEach(x => delete x.ss);
  }
  // keep the group adjacent: drop this lift right after the group's last other member
  const arr = d.exercises;
  arr.splice(arr.indexOf(e), 1);
  let k = -1; arr.forEach((x, idx) => { if (x.ss === g) k = idx; });
  arr.splice(k + 1, 0, e);
  save(); render();
  showToast("Superset — alternate sets between the two, rest after the pair.");
}

}
/* superset picker — link this lift with a partner; pairs alternate sets, rest after the pair */
function openSSModal(ei){
  const d = curDraft(), e = d.exercises[ei];
  if (d.exercises.length < 2){ showToast("Add another exercise first — a superset needs a partner."); return; }
  let h = '<h3>Superset — '+esc(exInfo(e.id).n)+'</h3>'
    + '<p class="hint">Alternate sets between the two with little rest, then rest after the pair. The lifts move next to each other and are scored with superset fatigue in mind.</p>';
  if (e.ss){
    const partners = d.exercises.filter((x,j) => j !== ei && x.ss === e.ss).map(x => esc(exInfo(x.id).n));
    h += '<p class="hint" style="margin-top:8px">Supersetted with <b>'+partners.join(", ")+'</b>.</p>'
      + '<button class="menu-item danger" data-act="ss-unlink" data-ei="'+ei+'">Unlink from superset</button>';
  }
  const opts = d.exercises.map((x,j) => (j === ei || (e.ss && x.ss === e.ss)) ? "" :
    '<button class="menu-item" data-act="ss-with" data-ei="'+ei+'" data-j="'+j+'">'+esc(exInfo(x.id).n)
    + (x.ss ? ' <span class="cap">· in a superset — joins it</span>' : '')+'</button>').join("");
  if (opts) h += '<div class="mgroup">'+(e.ss ? "Or link with…" : "Superset with…")+'</div>' + opts;
  h += '<div class="btnrow"><button data-act="modal-close">Close</button></div>';
  openModal(h);
}
function openVariantModal(ei){
  const e = curDraft().exercises[ei], p = exInfo(e.id);
  openModal('<h3>Variant of '+esc(p.n)+'</h3>'
    + '<p class="hint">Same lift, different setup — it gets its own history, ghost numbers and PRs, but counts for the same muscles.</p>'
    + '<input id="varname" placeholder="What\'s different? e.g. Short bar, Single handle" autocomplete="off" style="margin-top:10px">'
    + '<label class="rowline" style="gap:8px;margin-top:12px"><input type="checkbox" id="varuni" style="width:20px;height:20px"'+(isUni(e.id) ? " checked" : "")+'>'
    + '<span style="font-size:14px">One side at a time (1-arm / 1-leg)</span></label>'
    + '<div class="btnrow"><button class="primary" data-act="variant-create" data-ei="'+ei+'">Create</button>'
    + '<button data-act="modal-close">Cancel</button></div>');
  // "Single arm", "1-leg", "alternating"… → tick the per-side box automatically
  $("#varuni").addEventListener("change", () => { $("#varuni").dataset.touched = 1; });
  $("#varname").addEventListener("input", () => {
    if (!$("#varuni").dataset.touched && UNI_RE.test($("#varname").value)) $("#varuni").checked = true;
  });
  $("#varname").focus();
}
function openClassifyModal(ei){
  const e = curDraft().exercises[ei], c = S.custom[e.id];
  if (!c) return;
  openModal('<h3>Muscle focus — '+esc(c.n)+'</h3>'
    + '<p class="hint">What this lift counts for — drives the freshness map, weekly sets and By-muscle grades.</p>'
    + '<div class="rowline" style="margin-top:12px"><select id="clsg" class="grow">'
    + Object.entries(GROUPS).map(([k,v]) => '<option value="'+k+'"'+(k===c.g?" selected":"")+'>'+v+'</option>').join("")
    + '</select><select id="clss" class="grow"></select></div>'
    + '<div class="btnrow"><button class="primary" data-act="classify-save" data-ei="'+ei+'">Save</button>'
    + '<button data-act="modal-close">Cancel</button></div>');
  const fill = () => { const g = $("#clsg").value, subs = GROUP_SUBS[g] || [];
    $("#clss").innerHTML = '<option value="">Region — general</option>'
      + subs.map(k => '<option value="'+k+'"'+(g===c.g && c.sub===k ? " selected" : "")+'>'+SUB_LBL[k]+'</option>').join("");
    $("#clss").disabled = !subs.length; };
  fill();
  $("#clsg").addEventListener("change", fill);
}

function buildWorkout(keys, size){
  const all = Object.entries(EX).concat(Object.entries(S.custom));
  const hist = new Set(trainedIds(60));
  const used = new Set();
  const score = ([id]) => { const i = intelOf(id);
    return (i.st !== undefined ? i.st : 1)*3 + (i.sb !== undefined ? i.sb : 1)
      + (hist.has(id) ? 4 : 0) + (S.custom[id] ? 1 : 0); };
  const cands = k => all.filter(([id, e]) => !used.has(id)
      && (k.startsWith("g:") ? e.g === k.slice(2) : (e.sub || "") === k))
    .sort((a, b) => score(b) - score(a));
  size = Math.min(10, Math.max(size, keys.length));
  /* round 0: a stretch-loaded primary for every target · later rounds: complements with a
     DIFFERENT movement pattern (press+fly, hinge+curl, overhead+pushdown) while slots last */
  const picks = [];
  for (let round = 0; picks.length < size && round < 4; round++){
    let added = false;
    for (const k of keys){
      if (picks.length >= size) break;
      const cs = cands(k); if (!cs.length) continue;
      let pick;
      if (round === 0) pick = cs.find(([id]) => (intelOf(id).st||0) >= 2) || cs[0];
      else {
        const prevMv = picks.filter(p => p.k === k).map(p => intelOf(p.id).mv).filter(Boolean);
        pick = cs.find(([id]) => intelOf(id).mv && !prevMv.includes(intelOf(id).mv)) || cs[0];
      }
      used.add(pick[0]);
      picks.push({id:pick[0], k});
      added = true;
    }
    if (!added) break;
  }
  const isComp = id => { const e = exInfo(id), mv = intelOf(id).mv;
    return ["press","squat","hinge","row","pulldown","dip","thrust"].includes(mv) || !!e.bb || (e.rest||0) >= 150; };
  picks.sort((a, b) => (isComp(b.id)?1:0) - (isComp(a.id)?1:0));
  const list = picks.map((p, i) => ({id:p.id,
    plan: isComp(p.id) ? {n:(i === 0 ? 4 : 3), lo:6, hi:10} : {n:3, lo:10, hi:15}}));
  const name = "Target: " + keys.slice(0,3).map(tgtLabel).join(" + ") + (keys.length > 3 ? " +" : "");
  return {list, name};
}
/* ranked alternatives for the swap sheet — same focus first, then same muscle */
function rankSwaps(curId, excl){
  const cur = exInfo(curId), ci = intelOf(curId);
  const hist = new Set(trainedIds(90));
  const out = [];
  for (const [id, e] of Object.entries(EX).concat(Object.entries(S.custom))){
    if (id === curId || excl.has(id)) continue;
    if (e.g !== cur.g && !(cur.sub && e.sub === cur.sub)) continue;
    const i = intelOf(id);
    let sc = 0; const why = [];
    if (cur.sub && e.sub === cur.sub){ sc += 4; why.push("same focus"); }
    else why.push("same muscle");
    if (ci.mv && i.mv === ci.mv){ sc += 2; why.push("same movement"); }
    if ((i.st||0) >= 2){ sc += i.st; if ((i.st||0) > (ci.st||0)) why.push("better stretch"); }
    sc += (i.sb||0)*0.5;
    if (hist.has(id)){ sc += 3; why.push("you have history"); }
    out.push({id, e, sc, why});
  }
  return out.sort((a, b) => b.sc - a.sc).slice(0, 4);
}

    L.push("  trend weight: " + tr[tr.length-1].t.toFixed(1) + " lb" + (rate!==null ? " · rate " + (rate>0?"+":"") + rate.toFixed(2) + " lb/wk" : ""));
    if (tdee) L.push("  implied maintenance (last ~3 wk): ≈ " + tdee.toLocaleString() + " kcal");
    const k7 = ks.filter(e => e.d > addDays(todayStr(), -7));
    if (k7.length) L.push("  calories last 7d: avg " + Math.round(k7.reduce((a,e)=>a+e.k,0)/k7.length).toLocaleString() + " vs target " + S.settings.kcalTarget.toLocaleString() + " (" + k7.length + " days logged)");
    const recent = weightEntries().slice(-14);
    L.push("  weigh-ins: " + recent.map(e => fmtShort(e.d)+" "+e.w).join(", "));
  }
  const scores = liftScores();
  if (scores.length){
    L.push("");
    for (const [id, dl] of Object.entries(S.dl))
      L.push("TARGETED DELOAD: " + exInfo(id).n + " at " + dl.w + " lb (base " + dl.base + ") through " + dl.until);
    L.push("STRENGTH LEVELS (vs ~" + Math.round(bodyweight()) + " lb bodyweight):");
    for (const sc of scores)
      L.push("  " + sc.name + ": " + (sc.lv.idx<0?"Beginner":LVLS[sc.lv.idx]) + " — e1RM " + sc.e1 + (sc.bwTotal?" added":"") + " lb (" + sc.ratio.toFixed(2) + "×BW)");
  }
  const {per} = regionVolume(addDays(todayStr(),-6), todayStr());
  if (Object.keys(per).length){
    L.push("");
    L.push("WEEKLY SETS BY MUSCLE (last 7d, counted sets: primary = 1, secondary = half; grip/bracing riders not counted):");
    L.push("  " + Object.entries(REGIONS).filter(([r]) => per[r]).map(([r,n]) => { const b = bandOf(r);
      return n+" "+(Math.round(per[r]*2)/2)+(b ? " (zone "+b[0]+"-"+b[1]+")" : ""); }).join(" · "));
  }
  /* today, plans & auto-regulation — phase 4: the coach narrates these, never recomputes them */
  const DNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const tdow = new Date(todayStr()+"T12:00:00").getDay();
  const sesToday = sesDef(WEEK[tdow]);
  const wToday = S.workouts.find(w => w.date === todayStr());
  const tds2 = addDays(todayStr(),1), tdw = new Date(tds2+"T12:00:00").getDay(), tDr = S.drafts[tds2];
  L.push("");
  L.push("TODAY & TOMORROW:");
  L.push("  today (" + DNAMES[tdow] + "): " + (sesToday ? sesToday.name + " scheduled" : "REST DAY on the program")
    + (wToday ? " — workout done (" + (wToday.sesName||"Custom") + ")" : ""));
  L.push("  tomorrow (" + DNAMES[tdw] + "): " + (WEEK[tdw] === null ? "REST DAY on the program" : ((sesDef(WEEK[tdw])||{}).name || "Custom") + " scheduled")
    + (tDr && tDr.planned ? " · a session is planned ahead (" + ((sesDef(tDr.session)||{}).name || tDr.bname || "Custom") + ")" : ""));
  const dT = S.drafts[todayStr()];
  if (dT && dT.ready && !dT.ready.skip && dT.ready.v)
    L.push("  readiness check-in today (1-5, higher = better): sleep " + dT.ready.v[0] + " · energy " + dT.ready.v[1]
      + " · food " + dT.ready.v[2] + " · body " + dT.ready.v[3] + " → today's targets scaled ×" + dT.ready.m);
  const fd = freshDays();
  const recLines = Object.entries(REGIONS).filter(([r]) => fd.reg[r] !== undefined).map(([r,n]) => {
    const dys = adjD(fd.reg[r], r);
    const lbl = dys <= 0.25 ? "trained today" : dys < 1.75 ? "recovering" : dys < 2.75 ? "almost ready" : dys <= 7.5 ? "ready" : "due — 8+ days";
    return n + " " + (Math.round(dys*10)/10) + "d (" + lbl + ")";
  });
  if (recLines.length){
    L.push("");
    L.push("RECOVERY CLOCKS (days since trained, tuned by the user's soreness check-ins):");
    L.push("  " + recLines.join(" · "));
    for (const [r,n] of Object.entries(REGIONS)){
      const a = recovAdj(r);
      if (Math.abs(a) >= 0.5)
        L.push("  " + n + ": check-ins say it recovers " + (a > 0 ? "SLOWER (+" : "FASTER (−") + Math.abs(Math.round(a*10)/10) + "d vs default)");
    }
  }
  const PUMPL = ["no pump","good pump","crazy pump"], SOREL = ["came in fresh","came in sore but healed","came in still sore"];
  const fbDates = Object.keys(S.fb).filter(dk => dk > addDays(todayStr(),-8)).sort().reverse().slice(0,4);
  const fbLines = fbDates.map(dk => {
    const parts = Object.entries(S.fb[dk]).filter(([,v]) => v.p !== undefined || v.s !== undefined)
      .map(([r,v]) => REGIONS[r] + ": " + [v.p !== undefined ? PUMPL[v.p] : null, v.s !== undefined ? SOREL[v.s] : null].filter(Boolean).join(", "));
    return parts.length ? "  " + dk + " — " + parts.join(" · ") : null;
  }).filter(Boolean);
  if (fbLines.length){
    L.push("");
    L.push("POST-WORKOUT CHECK-INS (last 7d, the user's own pump/soreness ratings):");
    fbLines.forEach(x => L.push(x));
  }
  const va = volAdvice();
  if (va.length){
    L.push("");
    L.push("VOLUME ADVICE (this week's counted sets vs each muscle's growth zone, cross-read with check-ins — above-zone is only flagged when recovery data agrees):");
    for (const a of va) L.push("  " + REGIONS[a.r] + ": " + (Math.round(a.v*2)/2) + " vs zone " + a.lo + "-" + a.hi + " — " + a.note);
  }
  /* lab metrics */
  const si = strengthIndex(null);
  if (si.length >= 2){
    L.push("");
    L.push("LAB METRICS:");
    const cur = si[si.length-1].val, d4 = cur - si[Math.max(0, si.length-5)].val;
    L.push("  strength index (100 = first logged week): " + cur.toFixed(1) + " (" + (d4>0?"+":"") + d4.toFixed(1) + " last 4wk)");
    const grpLine = [["chest","Chest"],["back","Back"],["shoulders","Delts"],["arms","Arms"],["quads","Quads"],["hamstrings","Hams"]]
      .map(([k,l]) => { const s = strengthIndex(k); return s.length >= 2 ? l+" "+s[s.length-1].val.toFixed(0) : null; })
      .filter(Boolean).join(" · ");
    if (grpLine) L.push("  by muscle group: " + grpLine);
    const rs = relStrength();
    if (rs.length >= 2) L.push("  relative strength (bodyweight-adjusted): " + rs[rs.length-1].val.toFixed(1));
    const scs = [...S.workouts].sort((a,b) => a.date.localeCompare(b.date))
      .map(w => { const r = rateWorkout(w); return r ? r.score : null; }).filter(x => x !== null);
    if (scs.length >= 3){
      const a5 = scs.slice(-5), avg5 = a5.reduce((a,b) => a+b, 0)/a5.length;
      L.push("  session scores (0-100): last 5 avg " + Math.round(avg5) + " [" + a5.join(", ") + "]");
    }
    const bal = balance(28);
    if (bal.push + bal.pull) L.push("  balance last 28d: push:pull sets " + bal.push + ":" + bal.pull + " · ham:quad " + bal.ham + ":" + bal.quad);
    const em = energyModel();
    L.push("  maintenance: modeled ≈" + em.tdee.toLocaleString() + " kcal" + (impliedTDEE() ? " · measured ≈" + impliedTDEE().toLocaleString() + " (trust measured)" : ""));
    const rdy = readiness();
    if (rdy.sHi && rdy.sLo) L.push("  readiness: avg score " + rdy.sHi.avg.toFixed(0) + " on 7.5h+ sleep vs " + rdy.sLo.avg.toFixed(0) + " under");
    const da = deloadAdvice();
    if (da && da.signals.length) L.push("  fatigue (" + da.level + "): " + da.signals.join("; "));
    const wst = measEntries("waist");
    if (wst.length) L.push("  waist: " + wst[wst.length-1].v.toFixed(1) + "\"" + (wst.length > 1 ? " (" + ((wst[wst.length-1].v - wst[0].v) > 0 ? "+" : "") + (wst[wst.length-1].v - wst[0].v).toFixed(1) + "\" since " + fmtShort(wst[0].d) + ")" : ""));
  }
  const st = streakWeeks();
  if (st) L.push("\nCONSISTENCY: " + st + " straight weeks at 5+ sessions.");
  const ids = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.id)))];
  if (ids.length){
    L.push("");
    L.push("ALL-TIME BESTS (est 1RM unless bodyweight):");
    for (const id of ids.sort((a,b) => exInfo(a).n.localeCompare(exInfo(b).n))){
      const ex = exInfo(id); let best = null;
      for (const h of perfHistory(id)){
        const m = bestMetric(h.sets, ex);
        if (!best || m > best.m) best = {m, s:bestSet(h.sets, ex), d:h.date};
      }
      if (best) L.push("  " + ex.n + (isUni(id) ? " (per side)" : "") + ": " + Math.round(best.m) + " (" + (+best.s.w||0) + "×" + best.s.r + " on " + best.d + ")");
    }
  }
  L.push("");
  L.push("RECENT WORKOUTS (newest first):");
  const list = [...S.workouts].sort((a,b) => b.date.localeCompare(a.date)).slice(0,12);
  for (const w of list){
    const rt = rateWorkout(w);
    L.push(w.date + " — " + (w.sesName||"Custom") + (w.durMin ? " (" + w.durMin + " min)" : "")
      + (rt ? " · session score " + rt.score + " (" + rt.grade + ")" : "")
      + (w.prs && w.prs.length ? "  PRs: " + w.prs.map(prLabel).join("; ") : ""));
    w.exercises.forEach((e,i) =>
      L.push("  " + (i+1) + ". " + exInfo(e.id).n + (isUni(e.id) ? " (per side)" : "") + (e.ss ? " [superset]" : "") + ": " + e.sets.map(s => (s.warm?"w:":"")+setStr(s, exInfo(e.id))).join(", ")));
    if (w.cardio) L.push("  cardio: incline treadmill " + w.cardio.min + " min");
    if (w.note) L.push("  note: " + w.note);
  }
  if (!list.length) L.push("  (none yet)");
  return L.join("\n");
}

/* forgiving muscle-map hit test: a tap on a gap or the silhouette snaps to the nearest
   muscle shape (within ~18px) — exact shapes are small, especially on a phone */
function regionAtPoint(svg, x, y){
  let best = null, bestKey = Infinity;
  for (const el of svg.querySelectorAll("[data-region]")){
    const b = el.getBoundingClientRect();
    const dx = Math.max(b.left - x, 0, x - b.right), dy = Math.max(b.top - y, 0, y - b.bottom);
    const d = Math.hypot(dx, dy);
    if (d > 18) continue;
    const key = d*1000 + Math.hypot(b.left + b.width/2 - x, b.top + b.height/2 - y);
    if (key < bestKey){ bestKey = key; best = el; }
  }
  return best;
}
/* outline every shape included in the stat being shown */
function markSel(svg, keep){
  for (const p of svg.querySelectorAll(".selreg")) p.classList.remove("selreg");
  for (const p of svg.querySelectorAll("[data-region]")) if (keep(p)) p.classList.add("selreg");
}
/* muscle-map taps are handled at pointerup with a movement threshold instead of click —
   a slow tap or light press-and-hold registers too (mobile click timing was eating them) */
function mapTap(svg, x, y){
  let reg = document.elementFromPoint(x, y);
  reg = reg && reg.closest ? reg.closest("[data-region]") : null;
  if (!reg || !svg.contains(reg)) reg = regionAtPoint(svg, x, y);
  if (!reg) return;
  if (reg.closest("#freshmap")){
    const r = reg.dataset.region, sub = reg.dataset.sub;
    markSel(reg.closest("svg"), sub !== undefined
      ? p => p.dataset.sub === sub : p => p.dataset.region === r);
    const el = $("#fresh-detail");
    if (el){
      if (!freshD) freshD = freshDays();
      const raw = sub !== undefined
        ? (freshD.sub[sub] !== undefined ? freshD.sub[sub] : null)
        : (freshD.reg[r] !== undefined ? freshD.reg[r] : null);
      const fbR = sub !== undefined ? (SUB_REG[sub] || r) : r;
      const adj = recovAdj(fbR), days = adjD(raw, fbR);
      const sets = sub !== undefined ? subVolume(sub, 7)
        : (regionVolume(addDays(todayStr(),-6), todayStr()).per[r] || 0);
      const nm = REGIONS[r] + (sub !== undefined && SUB_LBL[sub] ? " · "+SUB_LBL[sub].toLowerCase() : "");
      const ago = raw === null ? "" : raw === 0 ? "trained today" : raw === 1 ? "trained yesterday" : "trained "+raw+" days ago";
      const st = days === null ? "not trained yet"
        : days <= 0.25 ? '<span style="color:hsl(18 88% 58%)">trained today</span>'
        : days < 1.75 ? '<span class="wr">recovering</span> — '+ago
        : days < 2.75 ? '<span style="color:hsl(75 60% 55%)">almost ready</span> — '+ago
        : days <= 7.5 ? '<span class="up">ready</span> — '+ago
        : '<span class="cap">due again</span> — '+raw+' days since trained';
      el.innerHTML = "<b>"+nm+"</b> — "+st+" · "+(Math.round(sets*2)/2)+" counted sets this week"
        + (Math.abs(adj) >= 0.5 ? '<br><span class="cap">your check-ins say this recovers '
          + (adj > 0 ? "slower" : "faster")+' than average — clock adjusted</span>' : "");
    }
    return;
  }
  if (heatData && reg.closest("#heatmap")){
    const r = reg.dataset.region, sub = reg.dataset.sub;
    markSel(reg.closest("svg"), sub !== undefined
      ? p => p.dataset.sub === sub : p => p.dataset.region === r);
    const v = sub !== undefined ? ((heatSubs && heatSubs[sub]) || 0) : (heatData.per[r] || 0);
    const nm = REGIONS[r] + (sub !== undefined && SUB_LBL[sub] ? " · "+SUB_LBL[sub].toLowerCase() : "");
    const src = sub !== undefined ? ((heatSubC && heatSubC[sub]) || {}) : (heatData.contrib[r] || {});
    const top = Object.entries(src).sort((a,b) => b[1]-a[1]).slice(0,3)
      .map(([n,c]) => n+" "+(Math.round(c*2)/2)).join(" · ");
    const el = $("#heat-detail");
    const band = sub !== undefined ? [4,12] : bandOf(r);
    const verdict = !v || !band ? ""
      : v < band[0] ? ' · <span style="color:var(--info)">below the '+band[0]+'–'+band[1]+' zone</span>'
      : v <= band[1] ? ' · <span class="up">in the growth zone</span>'
      : v <= band[1]+10 ? ' · <span class="up">above the zone — fine while recovery holds</span>'
      : ' · <span class="wr">far past the '+band[0]+'–'+band[1]+' zone</span>';
    if (el) el.innerHTML = "<b>"+nm+"</b> — "+(Math.round(v*2)/2)+" counted sets"+verdict+(top ? "<br><span class='cap'>"+top+"</span>" : "");
  }
}
let mapDown = null;
document.addEventListener("pointerdown", ev => {
  const svg = ev.target.closest && ev.target.closest("#heatmap, #freshmap");
  mapDown = svg ? {svg, x:ev.clientX, y:ev.clientY, id:ev.pointerId} : null;
}, true);
document.addEventListener("pointercancel", () => { mapDown = null; }, true);
document.addEventListener("pointerup", ev => {
  if (!mapDown || ev.pointerId !== mapDown.id) return;
  const m = mapDown; mapDown = null;
  if (Math.hypot(ev.clientX - m.x, ev.clientY - m.y) > 14) return; // it was a scroll, not a tap
  mapTap(m.svg, ev.clientX, ev.clientY);
}, true);
document.addEventListener("click", ev => {
  // superset pick-a-partner mode: the next tap on another lift card links the pair
  if (ssPick !== null && !(ev.target.closest && ev.target.closest('[data-act="ss-open"]'))){
    const card = ev.target.closest && ev.target.closest(".xcard");
    if (card && +card.dataset.ei !== ssPick){
      const ei0 = ssPick; ssExitPick();
      linkSS(ei0, +card.dataset.ei);
      return;
    }
    ssExitPick(); // tapping anything else leaves pick mode and acts normally
  }
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act, ei = +btn.dataset.ei, si = +btn.dataset.si;
  const d = curDraft();

  if (act === "tab"){ tab = btn.dataset.tab; render(); }
  else if (act === "start"){
    const dd = S.drafts[todayStr()] || (S.drafts[todayStr()] = newDraft(todayStr()));
    delete dd.planned;
    const fresh = !draftHasData(dd);
    dd.active = true; if (!dd.startedAt) dd.startedAt = Date.now();
    save(); render();
    if (S.settings.autoReg && !dd.ready && fresh) openReadySheet();
  }
  else if (act === "plan-tomorrow"){
    const ds = addDays(todayStr(), 1);
    const dr = S.drafts[ds] || (S.drafts[ds] = newDraft(ds));
    dr.planned = true; dr.active = true;
    S.editing = ds;
    save(); tab = "home"; render();
  }
  else if (act === "plan-done"){
    const ds = d.date;
    d.active = false; S.editing = null;
    save(); tab = "home"; render();
    showToast("Planned — it'll be waiting on Home "+(ds === addDays(todayStr(), 1) ? "tomorrow" : fmtDate(ds))+".");
  }
  else if (act === "plan-delete"){
    // a plan lives only in drafts — deleting it can never touch history (that's Finish-only)
    const ds = btn.dataset.date, dr = S.drafts[ds];
    if (dr && draftHasData(dr) && !confirm("This plan has logged sets — delete it anyway?")) return;
    delete S.drafts[ds];
    if (S.editing === ds) S.editing = null;
    save(); tab = "home"; render();
    showToast(WEEK[new Date(ds+"T12:00:00").getDay()] === null ? "Plan removed — rest day restored." : "Plan removed.");
  }
  else if (act === "pause"){ d.active = false; S.editing = null; save(); render(); }
  else if (act === "chk"){ toggleSet(ei, si); }
  else if (act === "warm"){
    /* taps on the set number cycle: working set → W warm-up → ⊘ marked for removal →
       removed. Typing into any set clears pending ⊘ marks back to their numbers. */
    const e = d.exercises[ei], s = e.sets[si];
    const row = document.querySelector('.srow[data-ei="'+ei+'"][data-si="'+si+'"]');
    if (s.del){
      e.sets.splice(si, 1); save(); render();
    } else if (s.warm){
      s.warm = false; s.del = true; s.wMan = true; s.wAuto = false; save();
      row.classList.remove("warm"); row.classList.add("pdel");
      row.querySelector(".snum").textContent = "⊘";
    } else {
      s.warm = true; s.wMan = true; s.wAuto = false; save();
      row.classList.add("warm");
      row.querySelector(".snum").textContent = "W";
    }
  }
  else if (act === "addset"){
    d.exercises[ei].sets.push({w:"", r:"", done:false, warm:false}); save(); render();
  }
  else if (act === "tpl-load-open"){ openTplLoadModal(); }
  else if (act === "tpl-load"){ closeModal(); applyTemplate(btn.dataset.k); }
  else if (act === "rest-cycle"){
    const opts = [60,90,120,150,180,240];
    const id = d.exercises[ei].id, cur = restFor(id);
    const nxt = opts[(opts.indexOf(cur)+1) % opts.length] || 90;
    S.settings.restO[id] = nxt; save();
    btn.textContent = fmtSec(nxt);
  }
  else if (act === "ex-open"){
    d.exercises.forEach((x,j) => x.open = j === ei);
    save(); render();
    const el = document.querySelector('.xcard[data-ei="'+ei+'"]');
    if (el) el.scrollIntoView({block:"center", behavior:"smooth"});
  }
  else if (act === "ex-close"){ d.exercises[ei].open = false; save(); render(); }
  else if (act === "stab"){ d.exercises[ei].tabLast = btn.dataset.v === "last"; save(); render(); }
  else if (act === "uni-toggle"){
    const id = d.exercises[ei].id;
    S.uniO[id] = isUni(id) ? 0 : 1;
    save(); closeModal(); render();
    if (S.uniO[id]) showToast("Marked one side at a time — log the weight per side; totals count both.");
  }
  else if (act === "ex-menu"){ openExMenu(ei); }
  else if (act === "ex-detail"){ openExDetail(btn.dataset.exid); }
  else if (act === "note-ex"){
    const e = d.exercises[ei];
    openModal('<h3>Note — '+esc(exInfo(e.id).n)+'</h3>'
      + '<textarea id="exnote" rows="3" placeholder="e.g. seat at 4, wide grip">'+esc(e.note||"")+'</textarea>'
      + '<div class="btnrow"><button class="primary" data-act="note-save" data-ei="'+ei+'">Save</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
  }
  else if (act === "note-save"){
    d.exercises[ei].note = ($("#exnote").value||"").trim(); save(); closeModal(); render();
  }
  else if (act === "up" || act === "down"){
    const j = act === "up" ? ei-1 : ei+1;
    if (j < 0 || j >= d.exercises.length){ closeModal(); return; }
    [d.exercises[ei], d.exercises[j]] = [d.exercises[j], d.exercises[ei]];
    save(); closeModal(); render();
  }
  else if (act === "del-ex"){
    const e = d.exercises[ei];
    if (!e.sets.some(s => s.done) || confirm("Remove " + exInfo(e.id).n + " and its logged sets?")){
      d.exercises.splice(ei,1); save(); closeModal(); render();
    }
  }
  else if (act === "swap"){ openAddModal(ei); }
  else if (act === "ss-open"){
    closeModal();
    const e = d.exercises[ei];
    if (d.exercises.length < 2){ showToast("Add another exercise first — a superset needs a partner."); }
    else if (e.ss){ openSSModal(ei); }               // already linked → edit / unlink sheet
    else if (ssPick === ei){ ssExitPick(); }         // second tap on ⧉ cancels
    else {                                           // pick-a-partner: just tap another card
      ssExitPick(); ssPick = ei;
      for (const c of document.querySelectorAll(".xcard"))
        c.classList.add(+c.dataset.ei === ei ? "sssrc" : "sspick");
      showToast("Tap the lift to superset with — ⧉ again to cancel.");
    }
  }
  else if (act === "ss-unlink"){
    const e = d.exercises[ei], g = e.ss;
    delete e.ss;
    const left = d.exercises.filter(x => x.ss === g);
    if (left.length < 2) left.forEach(x => delete x.ss);
    save(); closeModal(); render();
  }
  else if (act === "ss-with"){ closeModal(); linkSS(ei, +btn.dataset.j); }
  else if (act === "plateau"){ openPlateauModal(ei); }
  else if (act === "dl-start"){
    const id = btn.dataset.id, base = histTopW(id);
    if (!(base > 0)){ showToast("Targeted deloads need a weighted history for this lift."); return; }
    const hist = perfHistory(id);
    S.dl[id] = {base, w:dlWeight(base), n:hist.length ? hist[0].sets.length : 3, until:addDays(todayStr(), 6)};
    save(); closeModal(); render();
    showToast("Deload set — <b>"+S.dl[id].w+" lb</b>, about half the sets, through "+fmtDate(S.dl[id].until)+".");
  }
  else if (act === "dl-end"){ delete S.dl[btn.dataset.id]; save(); closeModal(); render(); }
  else if (act === "help"){
    const h = HELP[btn.dataset.h];
    if (h) openModal('<h3>'+h.t+'</h3><p class="hint">'+h.b+'</p>'
      + '<div class="btnrow"><button data-act="modal-close">Got it</button></div>');
  }
  else if (act === "ready-open"){ openReadySheet(); }
  else if (act === "ready-save"){
    const v = [0,1,2,3].map(i => +(($("#rd"+i)||{}).value) || 3);
    const score = v.reduce((a,b) => a+b, 0)/4;
    const m = score >= 4.25 ? 1.05 : score <= 2 ? 0.9 : score <= 2.75 ? 0.95 : 1;
    d.ready = {v, score:Math.round(score*10)/10, m};
    save(); closeModal(); render();
    showToast(m > 1 ? "Green light — today's targets <b>+5%</b>."
      : m < 1 ? "Rough day acknowledged — targets <b>−"+Math.round((1-m)*100)+"%</b>. Showing up still wins."
      : "Readiness solid — normal targets.");
  }
  else if (act === "ready-skip"){ d.ready = {skip:1, m:1}; save(); closeModal(); render(); }
  else if (act === "fb-open"){ openFBSheet(btn.dataset.date); }
  else if (act === "fb-tap"){
    const was = btn.classList.contains("on");
    for (const b of btn.parentElement.children) b.classList.remove("on");
    if (!was) btn.classList.add("on");
  }
  else if (act === "fb-save"){
    const out = {};
    for (const row of document.querySelectorAll("#modal .fbrow")){
      const e = {};
      for (const b of row.querySelectorAll('[data-act="fb-tap"].on')) e[b.dataset.t] = +b.dataset.v;
      if (e.s !== undefined || e.p !== undefined) out[row.dataset.r] = e;
    }
    S.fb[btn.dataset.date] = out;
    const hadPending = !!pendingToast;
    save(); closeModal(); render();
    if (!hadPending && Object.keys(out).length) showToast("Check-in saved — recovery clocks updated.");
  }
  else if (act === "fb-skip"){
    S.fb[btn.dataset.date] = S.fb[btn.dataset.date] || {};
    save(); closeModal(); render();
  }
  else if (act === "add-ex"){ openAddModal(null); }
  else if (act === "builder-open"){ openBuilderModal(btn.dataset.for || null); }
  else if (act === "tsel"){
    const k = btn.dataset.k;
    if (bSel.includes(k)) bSel = bSel.filter(x => x !== k);
    else bSel.push(k);
    btn.classList.toggle("on", bSel.includes(k));
    updateBNotes();
  }
  else if (act === "bsize"){
    bSize = +btn.dataset.n || 6;
    for (const b of document.querySelectorAll("#bsz button")) b.classList.toggle("on", +b.dataset.n === bSize);
  }
  else if (act === "bmyth"){
    bMyth = MYTHS[+btn.dataset.i];
    if (bMyth && !bSel.includes(bMyth.to)){
      bSel.push(bMyth.to);
      const c = document.querySelector('.tchip[data-k="'+bMyth.to+'"]');
      if (c) c.classList.add("on");
    }
    updateBNotes();
  }
  else if (act === "builder-go"){
    if (!bSel.length){ showToast("Pick at least one target first."); return; }
    const bdate = bFor || (($("#btmr") && $("#btmr").checked) ? addDays(todayStr(), 1) : todayStr());
    const future = bdate > todayStr();
    if (draftHasData(S.drafts[bdate])
        && !confirm(fmtDate(bdate)+" already has logged sets — replace them?")) return;
    const built = buildWorkout(bSel, bSize);
    if (!built.list.length){ showToast("Couldn't find lifts for that pick — try different targets."); return; }
    S.drafts[bdate] = {date:bdate, session:null, bname:built.name, startedAt:null, timer:null,
      planned: future ? true : undefined, active: future,
      exercises: built.list.map((x,i) => ({id:x.id, plan:x.plan, note:"", open:i===0, sets:setsFor(x.id, x.plan.n)})),
      cardio:{on:true, min:20}, note:""};
    if (future) S.editing = bdate;
    save(); closeModal(); tab = "home"; render();
    showToast("Built <b>"+built.list.length+" lifts</b> — "+esc(built.name.replace("Target: ",""))
      + (future ? ". Look it over, then tap Done." : ". Review it, swap anything, then Start."));
  }
  else if (act === "modal-add"){
    d.exercises.forEach(x => x.open = false);
    d.exercises.push({id:btn.dataset.exid, plan:null, note:"", open:true, sets:setsFor(btn.dataset.exid)});
    save(); closeModal(); render();
  }
  else if (act === "modal-swap"){
    const e = d.exercises[+btn.dataset.ei];
    if (e.sets.some(s => s.done) && !confirm("Replacing clears this exercise's logged sets. Continue?")) return;
    e.id = btn.dataset.exid; e.sets = setsFor(e.id, e.plan ? e.plan.n : e.sets.length);
    save(); closeModal(); render();
  }
  else if (act === "create-ex"){
    const name = ($("#newexname").value||"").trim();
    if (!name){ alert("Give it a name."); return; }
    const id = "c_" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const g = $("#newexgroup").value, cl = classifyCustom(name, g);
    const ent = {n:name, g, inc: cl.base ? (EX[cl.base].inc || 5) : 5};
    if (cl.base){ ent.base = cl.base;               // library parent found → inherit its profile
      if (EX[cl.base].rest) ent.rest = EX[cl.base].rest;
      if (EX[cl.base].bw) ent.bw = 1;
      if (EX[cl.base].bb) ent.bb = 1; }
    ent.sub = ($("#newexsub") && $("#newexsub").value) || cl.sub || undefined;
    if (!ent.sub) delete ent.sub;
    if (UNI_RE.test(name)) ent.uni = 1;
    S.custom[id] = ent;
    const sei = btn.dataset.ei;
    if (sei != null && sei !== ""){ const e = d.exercises[+sei]; e.id = id; e.sets = e.sets.map(() => ({w:"",r:"",done:false,warm:false})); }
    else { d.exercises.forEach(x => x.open = false);
      d.exercises.push({id, plan:null, note:"", open:true, sets:[{w:"",r:"",done:false,warm:false},{w:"",r:"",done:false,warm:false},{w:"",r:"",done:false,warm:false}]}); }
    save(); closeModal(); render();
    showToast("Created <b>"+esc(name)+"</b> — counts for <b>"+(GROUPS[g]||"?")
      + (ent.sub && SUB_LBL[ent.sub] ? " · "+SUB_LBL[ent.sub] : "")+"</b>"
      + (cl.base ? " (matched to "+esc(EX[cl.base].n)+")" : "")+". Wrong? ⋯ → Muscle focus.");
  }
  else if (act === "classify-open"){ closeModal(); openClassifyModal(ei); }
  else if (act === "classify-save"){
    const c = S.custom[d.exercises[ei].id]; if (!c) return;
    const g = $("#clsg").value, sub = $("#clss").value;
    if (g !== c.g){ c.g = g; delete c.base; }
    if (sub) c.sub = sub; else delete c.sub;
    save(); closeModal(); render();
    showToast("Saved — counts for <b>"+GROUPS[g]+(sub && SUB_LBL[sub] ? " · "+SUB_LBL[sub] : "")+"</b>");
  }
  else if (act === "variant-open"){ closeModal(); openVariantModal(ei); }
  else if (act === "variant-create"){
    const e = d.exercises[ei], pid = e.id, p = exInfo(pid);
    const label = ($("#varname").value || "").trim();
    if (!label){ alert('Describe the variant — e.g. "Short bar".'); return; }
    const id = "v_" + (pid + "_" + label.toLowerCase().replace(/[^a-z0-9]+/g,"-")).replace(/-+$/,"");
    if (EX[id] || S.custom[id]){ alert("You already have this variant — find it in the exercise picker."); return; }
    const entry = {n: p.n + " — " + label, g: p.g, inc: p.inc || 5,
      base: (S.custom[pid] && S.custom[pid].base) || (EX[pid] ? pid : null)};
    if (p.rest) entry.rest = p.rest;
    if (p.bw) entry.bw = 1;
    if (p.bb) entry.bb = 1;
    if (p.sub) entry.sub = p.sub;
    if ($("#varuni").checked) entry.uni = 1;
    S.custom[id] = entry;
    if (e.sets.some(s => setLogged(s))){
      d.exercises.forEach(x => x.open = false);
      d.exercises.splice(ei+1, 0, {id, plan:null, note:"", open:true,
        sets: blankSets(Math.max(1, e.sets.length))});
      showToast("Added <b>"+esc(entry.n)+"</b> below — its own history starts now.");
    } else {
      e.id = id;
      e.sets = e.sets.map(() => ({w:"", r:"", done:false, warm:false}));
      showToast("Switched to <b>"+esc(entry.n)+"</b> — its own history starts now.");
    }
    save(); closeModal(); render();
  }
  else if (act === "modal-close"){ closeModal(); }
  else if (act === "finish"){
    const fdate = d.date;
    const prs = finishDraft(fdate, false);
    if (prs === false) return;
    clearInterval(tickInt);
    tab = "home"; render();
    const w = S.workouts.find(x => x.date === fdate);
    const rt = w && rateWorkout(w);
    let msg = rt ? "Session score <b class='grad-ink'>"+rt.score+" · "+rt.grade+"</b>" : "";
    if (prs.length) msg += (msg ? "<br>" : "") + "<b class='wr'>"+prs.length+" PR"+(prs.length>1?"s":"")+"</b> — "+prs.map(p => esc(prLabel(p))).join(" · ");
    if (lastAutoWarm) msg += (msg ? "<br>" : "") + '<span style="font-size:12.5px;color:var(--text-2)">'
      + lastAutoWarm+" light lead-in set"+(lastAutoWarm>1?"s":"")+" counted as warm-ups — tap a set number to change.</span>";
    const ton = S.workouts.reduce((a,x) => a + tonOf(x), 0);
    const hit = [1e5, 25e4, 5e5, 1e6, 2e6, 5e6].filter(m => m <= ton && m > S.milestone).pop();
    if (hit){ S.milestone = hit; save();
      msg += (msg ? "<br>" : "") + "<b class='grad-ink'>" + hit.toLocaleString() + " lb</b> lifted lifetime"; }
    // pump & soreness check-in rides on top; the score toast waits until the sheet closes
    if (S.settings.autoReg && w && S.fb[fdate] === undefined){
      pendingToast = msg || null;
      openFBSheet(fdate);
    } else if (msg) showToast(msg);
  }
  else if (act === "warmup-gen"){
    const e = d.exercises[ei], ex = exInfo(e.id);
    const a = analyze(e.id, e.plan);
    const w = +scaleW(a.gW(0), readyMult(d)) || 0;
    if (!w){ closeModal(); showToast("No working weight yet — log this lift once first."); return; }
    const r5 = x => Math.max(ex.bb ? 45 : 5, Math.round(x/5)*5);
    const rows = ex.bb ? [[45,10],[r5(w*0.6),5],[r5(w*0.8),3]] : [[r5(w*0.5),12],[r5(w*0.75),6]];
    const seen = new Set();
    const warm = rows.filter(([ww]) => ww < w && !seen.has(ww) && seen.add(ww))
      .map(([ww,rr]) => ({w:String(ww), r:String(rr), done:false, warm:true}));
    if (!warm.length){ closeModal(); showToast("Working weight is too light for warm-up ramps."); return; }
    e.sets = warm.concat(e.sets);
    save(); closeModal(); render();
  }
  else if (act === "tpl-save"){
    openTplModal(templateFromExercises(d.exercises),
      ((sesDef(d.session)||{}).name || "My workout") + " — mine");
  }
  else if (act === "tpl-from-hist"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (w) openTplModal(templateFromExercises(w.exercises), (w.sesName || "My workout") + " — mine");
  }
  else if (act === "tpl-go"){
    const name = ($("#tpl-name").value || "").trim();
    if (!name){ alert("Give it a name."); return; }
    const id = "t_" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24)
      + "-" + Math.floor(Math.random()*1e4);
    S.templates[id] = {name, plan: pendingTpl};
    pendingTpl = null;
    save(); closeModal(); render();
    showToast("Template saved — it's in the session picker on Home.");
  }
  else if (act === "tpl-rename"){
    const id = btn.dataset.id, t = S.templates[id];
    if (!t) return;
    openModal('<h3>Rename template</h3>'
      + '<div class="set-item"><span class="lbl">Template name</span>'
      + '<input id="tpl-newname" value="'+esc(t.name)+'" maxlength="40"></div>'
      + '<div class="btnrow"><button class="primary" data-act="tpl-rename-go" data-id="'+id+'">Save name</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
    setTimeout(() => { const i = $("#tpl-newname"); if (i){ i.focus(); i.select(); } }, 50);
  }
  else if (act === "tpl-rename-go"){
    const t = S.templates[btn.dataset.id];
    const name = ($("#tpl-newname").value || "").trim();
    if (!name){ alert("Give it a name."); return; }
    if (t){ t.name = name; save(); }
    closeModal(); render();
  }
  else if (act === "tpl-del"){
    if (confirm("Delete this template? Logged workouts that used it are unaffected.")){
      delete S.templates[btn.dataset.id]; save(); render();
    }
  }
  else if (act === "coach-key-save"){
    const k = ($("#coach-key").value || "").trim();
    if (!k){ alert("Paste your API key first."); return; }
    S.settings.apiKey = k; save(); render();
  }
  else if (act === "coach-chip"){ askCoach(btn.dataset.q); }
  else if (act === "coach-ask"){
    const q = ($("#coach-q").value || "").trim();
    if (!q) return;
    $("#coach-q").value = "";
    askCoach(q);
  }
  else if (act === "coach-clear"){
    if (confirm("Clear the coach conversation?")){ S.coach = []; save(); render(); }
  }
  else if (act === "past-workout"){ openPastModal(); }
  else if (act === "past-go"){
    const ds = $("#past-date").value;
    if (!ds || ds > todayStr()){ alert("Pick a date up to today."); return; }
    const ses = $("#past-ses").value;
    const existing = S.workouts.find(w => w.date === ds);
    if (existing && !confirm(fmtDate(ds)+" already has a saved workout — replace it?")) return;
    if (existing) S.workouts = S.workouts.filter(w => w.id !== existing.id);
    S.drafts[ds] = draftFromSession(ses === "custom" ? null : ses, ds);
    S.drafts[ds].active = true;
    S.editing = ds === todayStr() ? null : ds;
    save(); closeModal(); tab = "home"; render();
  }
  else if (act === "resume-old"){ S.editing = btn.dataset.date;
    S.drafts[btn.dataset.date].active = true; save(); render(); }
  else if (act === "save-old"){ finishDraft(btn.dataset.date, true); render(); }
  else if (act === "discard-old"){
    if (confirm("Discard the unfinished workout from " + fmtDate(btn.dataset.date) + "?")){
      delete S.drafts[btn.dataset.date]; save(); render();
    }
  }
  else if (act === "reopen"){
    const w = S.workouts.find(x => x.date === btn.dataset.date);
    if (w) openWorkoutDraft(w);
  }
  else if (act === "hist-toggle"){ $("#h-"+btn.dataset.id).classList.toggle("open"); }
  else if (act === "hist-del"){
    if (confirm("Delete this workout permanently?")){
      S.workouts = S.workouts.filter(w => w.id !== btn.dataset.id); save(); render();
    }
  }
  else if (act === "hist-edit"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (w) openWorkoutDraft(w);
  }
  else if (act === "hist-date"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (!w) return;
    openModal('<h3>Change date</h3>'
      + '<div class="set-item"><span class="lbl">This workout actually happened on…</span>'
      + '<input id="mv-date" type="date" value="'+w.date+'" max="'+todayStr()+'"></div>'
      + '<div class="btnrow"><button class="primary" data-act="hist-date-go" data-id="'+w.id+'">Move it</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
  }
  else if (act === "hist-date-go"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    const nd = $("#mv-date") ? $("#mv-date").value : "";
    if (!w || !nd || nd > todayStr()){ alert("Pick a date up to today."); return; }
    if (nd !== w.date && S.workouts.some(x => x.date === nd)){
      alert(fmtDate(nd)+" already has a workout — edit or delete that one first."); return;
    }
    w.date = nd; save(); closeModal(); render();
  }
  else if (act === "recap-dismiss"){ S.recapSeen = weekStart(todayStr()); save(); render(); }
  else if (act === "ci-save" || act === "ci-edit"){
    if (act === "ci-edit"){
      delete S.body.weights[todayStr()]; delete S.body.kcals[addDays(todayStr(),-1)];
      save(); render(); return;
    }
    const w = +($("#ci-w").value || 0), k = +($("#ci-k").value || 0);
    const sl = +($("#ci-s").value || 0), en = +($("#ci-e").value || 0);
    if (w > 0) S.body.weights[todayStr()] = w;
    if (k > 0) S.body.kcals[addDays(todayStr(),-1)] = k;
    if (sl > 0 && sl <= 16) S.body.sleep[todayStr()] = sl;
    if (en >= 1 && en <= 5) S.body.energy[todayStr()] = en;
    if (!(w > 0) && !(k > 0) && !(sl > 0) && !en) return;
    save(); render();
  }
  else if (act === "ms-open"){ openMeasModal(); }
  else if (act === "ms-save"){
    const m = {};
    for (const [f, id] of [["waist","#ms-waist"],["arm","#ms-arm"],["thigh","#ms-thigh"]]){
      const v = +($(id).value || 0); if (v > 0) m[f] = v;
    }
    if (!Object.keys(m).length){ alert("Enter at least one measurement."); return; }
    S.body.meas[todayStr()] = Object.assign({}, S.body.meas[todayStr()] || {}, m);
    save(); closeModal(); render();
    showToast("Logged — the waist chart lives in Trends → Body.");
  }
  else if (act === "backup-later"){ S.backupSnooze = todayStr(); save(); render(); }
  else if (act === "score-why"){ openScoreModal(btn.dataset.id); }
  else if (act === "goto-trends"){ tab = "trends"; S.trendTab = "body"; render(); }
  else if (act === "goto-insights"){ tab = "trends"; S.trendTab = "ins"; render(); }
  else if (act === "goto-lab"){ tab = "trends"; S.trendTab = "lab"; render(); }
  else if (act === "goto-history"){ tab = "history"; render(); }
  else if (act === "volnums"){
    const el = $("#volnums"); el.hidden = !el.hidden;
    btn.textContent = el.hidden ? "Growth-zone check — anything to change? ›" : "Hide the growth-zone check";
  }
  else if (act === "hist-more"){ histShow += 25; render(); }
  else if (act === "ttab"){ S.trendTab = btn.dataset.t; save(); render(); }
  else if (act === "lab-group"){ labGroup = btn.dataset.g; render(); }
  else if (act === "range"){ S.range = +btn.dataset.r; save(); render(); }
  else if (act === "t-adj"){
    const dd = S.drafts[S.editing || todayStr()];
    if (dd && dd.timer){ dd.timer.end += (+btn.dataset.d)*1000; save(); syncTimerUI(); }
  }
  else if (act === "t-skip"){
    const dd = S.drafts[S.editing || todayStr()];
    if (dd){ dd.timer = null; save(); } syncTimerUI();
  }
  else if (act === "copy-claude"){
    const txt = claudeText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => { btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy for Claude", 1500); })
      .catch(() => { prompt("Copy this:", txt); });
  }
  else if (act === "coach-copy-prompt"){
    // the free path: same grounded-coach framing as the API call, pasted into claude.ai by hand
    const txt = "You are my strength & nutrition coach. My workout tracker (LiftLog) computed everything "
      + "below deterministically — narrate and interpret these numbers, never compute or invent new ones, "
      + "and if something isn't in the data, say the app doesn't track it. I'm a returning lifter on a "
      + "6-day split (Saturday off), currently cutting. Be direct and specific.\n\n"
      + claudeText() + "\n\nStart by asking what I want to work on.";
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => showToast("Copied — paste it into claude.ai and ask away."))
      .catch(() => { prompt("Copy this:", txt); });
  }
  else if (act === "export"){
    S.lastBackup = todayStr(); save();
    // never write the API key into a backup file — it gets emailed/shared between devices
    const dump = Object.assign({}, S, {settings: Object.assign({}, S.settings, {apiKey:""})});
    const blob = new Blob([JSON.stringify(dump, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "liftlog-backup-" + todayStr() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    if (tab === "home") render();
  }
  else if (act === "import"){ $("#importfile").click(); }
  else if (act === "reset"){
    if (confirm("Erase ALL LiftLog data?") && confirm("Really? This cannot be undone.")){
      localStorage.removeItem(KEY); location.reload();
    }
  }
});

document.addEventListener("change", ev => {
  const t = ev.target;
  if (/^st-/.test(t.id)) showToast("Saved ✓");
  if (t.id === "session-sel"){
    const dd = S.drafts[todayStr()];
    if (draftHasData(dd) && !confirm("Changing the session resets logged sets. Continue?")){
      t.value = dd.session || "custom"; return;
    }
    S.drafts[todayStr()] = draftFromSession(t.value === "custom" ? null : t.value, todayStr());
    save(); render();
  }
  else if (t.id === "plan-ses"){
    const d0 = curDraft(), ds = d0.date;
    if (draftHasData(d0) && !confirm("Changing the session resets this plan. Continue?")){
      t.value = d0.session || "custom"; return;
    }
    const nd = draftFromSession(t.value === "custom" ? null : t.value, ds);
    nd.planned = true; nd.active = true;
    S.drafts[ds] = nd; save(); render();
  }
  else if (t.id === "plan-date"){
    const d0 = curDraft(), old = d0.date, nv = t.value;
    if (!nv || nv <= todayStr()){
      alert("Pick a date after today — for today or earlier, log it as a workout instead.");
      t.value = old; return;
    }
    if (nv === old) return;
    if (S.drafts[nv] && draftHasData(S.drafts[nv])
        && !confirm(fmtDate(nv)+" already has an unfinished draft — replace it?")){
      t.value = old; return;
    }
    delete S.drafts[old];
    d0.date = nv; S.drafts[nv] = d0; S.editing = nv;
    save(); render();
  }
  else if (t.id === "cardio-on"){ curDraft().cardio.on = t.checked; save(); }
  else if (t.id === "cardio-min"){ curDraft().cardio.min = Math.max(0, +t.value||0); save(); }
  else if (t.id === "hist-month"){ histMonth = t.value; histShow = 15; render(); }
  else if (t.id === "prog-sel"){ S.progSel = t.value; save(); render(); }
  else if (t.id === "st-kcal"){ S.settings.kcalTarget = Math.max(0, +t.value||0) || 2510; save(); }
  else if (t.id === "st-goal"){ S.settings.goalWeight = t.value; save(); }
  else if (t.id === "st-rest"){ S.settings.restDefault = Math.max(15, +t.value||90); save(); }
  else if (t.id === "st-sound"){ S.settings.sound = t.checked; save(); }
  else if (t.id === "st-vib"){ S.settings.vibrate = t.checked; save(); }
  else if (t.id === "st-sex"){ S.settings.sex = t.value; save(); }
  else if (t.id === "st-height"){ S.settings.height = t.value; save(); }
  else if (t.id === "st-clock"){ S.settings.showClock = t.checked; save(); }
  else if (t.id === "st-chk"){ S.settings.checkOff = t.checked; save(); render(); }
  else if (t.id === "st-areg"){ S.settings.autoReg = t.checked; save(); }
  else if (t.id === "st-age"){ S.settings.age = Math.max(14, Math.min(99, +t.value||30)); save(); }
  else if (t.id === "st-bf"){ S.settings.bodyFat = t.value; save(); }
  else if (t.id === "st-cardiok"){ S.settings.cardioKcal = Math.max(0, +t.value||7.8); save(); }
  else if (t.id === "st-apikey"){ S.settings.apiKey = t.value.trim(); save(); }
  else if (t.id === "importfile"){
    const f = t.files[0]; if (!f) return;
    f.text().then(txt => {
      try {
        const data = JSON.parse(txt);
        if (!Array.isArray(data.workouts)) throw 0;
        const keptKey = S.settings.apiKey;
        S = Object.assign({drafts:{},custom:{},templates:{},coach:[],milestone:0,uniO:{},body:{weights:{},kcals:{}},progSel:null,editing:null,trendTab:"body",range:30,recapSeen:""}, data);
        S.settings = Object.assign({}, DEF_SET, data.settings||{});
        if (!S.settings.apiKey) S.settings.apiKey = keptKey; // backups don't carry the key
        S.body = Object.assign({weights:{},kcals:{},meas:{},sleep:{},energy:{}}, S.body||{});
        S.uniO = S.uniO || {};
        save(); alert("Restored " + S.workouts.length + " workouts."); render();
      } catch(e){ alert("That file doesn't look like a LiftLog backup."); }
    });
  }
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.classList.contains("w") || t.classList.contains("r")){
    const d = curDraft(), e = d.exercises[+t.dataset.ei];
    if (!e) return;
    // typing anywhere cancels any set still marked ⊘ for removal — back to its number
    d.exercises.forEach((x, xi) => x.sets.forEach((u, ui) => {
      if (!u.del) return;
      u.del = false;
      const r2 = document.querySelector('.srow[data-ei="'+xi+'"][data-si="'+ui+'"]');
      if (r2){ r2.classList.remove("pdel"); r2.querySelector(".snum").textContent = ui+1; }
    }));
    const s = e.sets[+t.dataset.si];
    if (t.classList.contains("w")){
      s.w = t.value;
      if (t.value !== "")
        e.sets.forEach((s2, j) => {
          if (j > +t.dataset.si && !s2.done && s2.w === ""){
            const inp = document.querySelector('.srow[data-ei="'+t.dataset.ei+'"][data-si="'+j+'"] .w');
            if (inp) inp.placeholder = t.value;
          }
        });
    } else {
      s.r = t.value;
      if (!S.settings.checkOff){
        const total = d.exercises.reduce((a,x) => a + x.sets.length, 0);
        const doneN = d.exercises.reduce((a,x) => a + x.sets.filter(u => +u.r > 0).length, 0);
        const sc = $("#setcount"); if (sc) sc.textContent = doneN+"/"+total;
      }
    }
    save();
    liveWarmSoon(+t.dataset.ei);
  }
  else if (t.id === "wnote"){ curDraft().note = t.value; save(); }
});
document.addEventListener("focusin", ev => {
  const t = ev.target;
  if (t.tagName === "INPUT" && (t.classList.contains("w") || t.classList.contains("r"))){
    t.select();
    setTimeout(() => { try { t.scrollIntoView({block:"center", behavior:"smooth"}); } catch(e){} }, 250);
  }
});
document.addEventListener("pointerover", ev => {
  const c = ev.target.closest && ev.target.closest(".pt");
  const tip = $("#ctip");
  if (!tip) return;
  if (!c){ tip.style.display = "none"; return; }
  tip.innerHTML = "<b>" + fmtDate(c.dataset.d) + "</b><br>" + c.dataset.v + (c.dataset.l ? " · " + c.dataset.l : "");
  tip.style.display = "block";
  const wrap = c.closest(".chartwrap").getBoundingClientRect();
  let x = ev.clientX - wrap.left + 12, y = ev.clientY - wrap.top - 34;
  if (x > wrap.width - 140) x -= 160;
  tip.style.left = x + "px"; tip.style.top = Math.max(0, y) + "px";
});
$("#ovl").addEventListener("click", ev => { if (ev.target.id === "ovl") closeModal(); });
/* swipe down to dismiss a sheet — drag starts only when the sheet is scrolled to its top,
   so normal scrolling inside long pickers (like Swap exercise) is untouched */
(() => {
  const m = $("#modal");
  let sw = null;
  m.addEventListener("touchstart", ev => {
    sw = {y: ev.touches[0].clientY, drag: false};
  }, {passive:true});
  m.addEventListener("touchmove", ev => {
    if (!sw) return;
    const dy = ev.touches[0].clientY - sw.y;
    if (!sw.drag){
      if (dy > 10 && m.scrollTop <= 0) sw.drag = true;
      else if (dy < -4 || m.scrollTop > 0){ sw = null; return; }
      else return;
    }
    ev.preventDefault();
    m.style.transition = "none";
    m.style.transform = "translateY(" + Math.max(0, dy) + "px)";
  }, {passive:false});
  const end = ev => {
    if (sw && sw.drag){
      const dy = (ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientY : sw.y) - sw.y;
      m.style.transition = "transform .22s ease-out";
      if (dy > 110){
        m.style.transform = "translateY(110%)";
        setTimeout(() => { closeModal(); m.style.transform = ""; m.style.transition = ""; }, 180);
      } else {
        m.style.transform = "";
        setTimeout(() => { m.style.transition = ""; }, 240);
      }
    }
    sw = null;
  };
  m.addEventListener("touchend", end);
  m.addEventListener("touchcancel", end);
})();

/* ===== drag-to-reorder exercises (grip handles) ===== */
let drag = null;
function dragEnd(commit){
  if (!drag) return;
  drag.card.classList.remove("dragging");
  if (commit && drag.moved){
    const d = S.drafts[S.editing || todayStr()];
    if (d){
      const order = [...document.querySelectorAll(".xcard")].map(c => +c.dataset.ei);
      d.exercises = order.map(i => d.exercises[i]);
      save();
      const sy = window.scrollY;
      render();
      window.scrollTo(0, sy);
    }
  } else if (drag.moved) render();
  drag = null;
}
document.addEventListener("pointerdown", ev => {
  const grip = ev.target.closest && ev.target.closest("[data-grip]");
  if (!grip) return;
  const card = grip.closest(".xcard");
  const d = S.drafts[S.editing || todayStr()];
  if (!card || !d || !d.active) return;
  ev.preventDefault();
  drag = {card, moved:false, id:ev.pointerId};
  card.classList.add("dragging");
  try { grip.setPointerCapture(ev.pointerId); } catch(e){}
});
document.addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  ev.preventDefault();
  drag.moved = true;
  const y = ev.clientY;
  if (y < 130) window.scrollBy(0, -14);
  else if (y > innerHeight - 130) window.scrollBy(0, 14);
  for (const c of document.querySelectorAll(".xcard")){
    if (c === drag.card) continue;
    const r = c.getBoundingClientRect();
    if (y > r.top && y < r.bottom){
      c.parentNode.insertBefore(drag.card, y < r.top + r.height/2 ? c : c.nextSibling);
      break;
    }
  }
});
document.addEventListener("pointerup", ev => { if (drag && ev.pointerId === drag.id) dragEnd(true); });
document.addEventListener("pointercancel", ev => { if (drag && ev.pointerId === drag.id) dragEnd(false); });

render();

/* PWA: register the service worker only when served over http(s) —
   the desktop file:// copy skips this. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
