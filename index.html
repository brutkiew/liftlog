    + '<div class="set-item"><span class="lbl">Session</span><select id="past-ses">'+sessionOptions(defSes)+'</select></div>'
    + '<p class="cap" style="margin-top:12px">You\'ll get the normal logging screen for that day — it counts fully for PRs, insights and charts.</p>'
    + '<div class="btnrow"><button class="primary" data-act="past-go">Open</button>'
    + '<button data-act="modal-close">Cancel</button></div>');
  $("#past-date").addEventListener("change", () => {
    const v = $("#past-date").value;
    if (v) $("#past-ses").value = WEEK[new Date(v+"T12:00:00").getDay()] || "custom";
  });
}

/* ================= copy for Claude ================= */
function claudeText(){
  const L = [];
  L.push("LiftLog export — " + todayStr());
  L.push("Program: 6-day split. Sun L/S-A · Mon B/B-A · Tue C/T-A · Wed L/S-B · Thu B/B-B · Fri C/T-B · Sat off.");
  const tr = trendSeries(), rate = weeklyRate(tr), ks = kcalEntries(), tdee = impliedTDEE();
  if (tr.length){
    L.push("");
    L.push("BODY:");
    L.push("  trend weight: " + tr[tr.length-1].t.toFixed(1) + " lb" + (rate!==null ? " · rate " + (rate>0?"+":"") + rate.toFixed(2) + " lb/wk" : ""));
    if (tdee) L.push("  implied maintenance (last ~3 wk): ≈ " + tdee.toLocaleString() + " kcal");
    const k7 = ks.filter(e => e.d > addDays(todayStr(), -7));
    if (k7.length) L.push("  calories last 7d: avg " + Math.round(k7.reduce((a,e)=>a+e.k,0)/k7.length).toLocaleString() + " vs target " + S.settings.kcalTarget.toLocaleString() + " (" + k7.length + " days logged)");
    const recent = weightEntries().slice(-14);
    L.push("  weigh-ins: " + recent.map(e => fmtShort(e.d)+" "+e.w).join(", "));
  }
  const scores = liftScores();
  if (scores.length){
    L.push("");
    L.push("STRENGTH LEVELS (vs ~" + Math.round(bodyweight()) + " lb bodyweight):");
    for (const sc of scores)
      L.push("  " + sc.name + ": " + (sc.lv.idx<0?"Beginner":LVLS[sc.lv.idx]) + " — e1RM " + sc.e1 + (sc.bwTotal?" added":"") + " lb (" + sc.ratio.toFixed(2) + "×BW)");
  }
  const {per} = regionVolume(addDays(todayStr(),-6), todayStr());
  if (Object.keys(per).length){
    L.push("");
    L.push("WEEKLY SETS BY MUSCLE (last 7d, secondary = half credit):");
    L.push("  " + Object.entries(REGIONS).filter(([r]) => per[r]).map(([r,n]) => n+" "+(Math.round(per[r]*2)/2)).join(" · "));
  }
  /* lab metrics */
  const si = strengthIndex(null);
  if (si.length >= 2){
    L.push("");
    L.push("LAB METRICS:");
    const cur = si[si.length-1].val, d4 = cur - si[Math.max(0, si.length-5)].val;
    L.push("  strength index (100 = first logged week): " + cur.toFixed(1) + " (" + (d4>0?"+":"") + d4.toFixed(1) + " last 4wk)");
    const grpLine = [["chest","Chest"],["back","Back"],["shoulders","Delts"],["arms","Arms"],["quads","Quads"],["hamstrings","Hams"]]
      .map(([k,l]) => { const s = strengthIndex(k); return s.length >= 2 ? l+" "+s[s.length-1].val.toFixed(0) : null; })
      .filter(Boolean).join(" · ");
    if (grpLine) L.push("  by muscle group: " + grpLine);
    const rs = relStrength();
    if (rs.length >= 2) L.push("  relative strength (bodyweight-adjusted): " + rs[rs.length-1].val.toFixed(1));
    const scs = [...S.workouts].sort((a,b) => a.date.localeCompare(b.date))
      .map(w => { const r = rateWorkout(w); return r ? r.score : null; }).filter(x => x !== null);
    if (scs.length >= 3){
      const a5 = scs.slice(-5), avg5 = a5.reduce((a,b) => a+b, 0)/a5.length;
      L.push("  session scores (0-100): last 5 avg " + Math.round(avg5) + " [" + a5.join(", ") + "]");
    }
    const bal = balance(28);
    if (bal.push + bal.pull) L.push("  balance last 28d: push:pull sets " + bal.push + ":" + bal.pull + " · ham:quad " + bal.ham + ":" + bal.quad);
    const em = energyModel();
    L.push("  maintenance: modeled ≈" + em.tdee.toLocaleString() + " kcal" + (impliedTDEE() ? " · measured ≈" + impliedTDEE().toLocaleString() + " (trust measured)" : ""));
    const rdy = readiness();
    if (rdy.sHi && rdy.sLo) L.push("  readiness: avg score " + rdy.sHi.avg.toFixed(0) + " on 7.5h+ sleep vs " + rdy.sLo.avg.toFixed(0) + " under");
    const da = deloadAdvice();
    if (da && da.signals.length) L.push("  fatigue (" + da.level + "): " + da.signals.join("; "));
    const wst = measEntries("waist");
    if (wst.length) L.push("  waist: " + wst[wst.length-1].v.toFixed(1) + "\"" + (wst.length > 1 ? " (" + ((wst[wst.length-1].v - wst[0].v) > 0 ? "+" : "") + (wst[wst.length-1].v - wst[0].v).toFixed(1) + "\" since " + fmtShort(wst[0].d) + ")" : ""));
  }
  const st = streakWeeks();
  if (st) L.push("\nCONSISTENCY: " + st + " straight weeks at 5+ sessions.");
  const ids = [...new Set(S.workouts.flatMap(w => w.exercises.map(e => e.id)))];
  if (ids.length){
    L.push("");
    L.push("ALL-TIME BESTS (est 1RM unless bodyweight):");
    for (const id of ids.sort((a,b) => exInfo(a).n.localeCompare(exInfo(b).n))){
      const ex = exInfo(id); let best = null;
      for (const h of perfHistory(id)){
        const m = bestMetric(h.sets, ex);
        if (!best || m > best.m) best = {m, s:bestSet(h.sets, ex), d:h.date};
      }
      if (best) L.push("  " + ex.n + (isUni(id) ? " (per side)" : "") + ": " + Math.round(best.m) + " (" + (+best.s.w||0) + "×" + best.s.r + " on " + best.d + ")");
    }
  }
  L.push("");
  L.push("RECENT WORKOUTS (newest first):");
  const list = [...S.workouts].sort((a,b) => b.date.localeCompare(a.date)).slice(0,12);
  for (const w of list){
    const rt = rateWorkout(w);
    L.push(w.date + " — " + (w.sesName||"Custom") + (w.durMin ? " (" + w.durMin + " min)" : "")
      + (rt ? " · session score " + rt.score + " (" + rt.grade + ")" : "")
      + (w.prs && w.prs.length ? "  PRs: " + w.prs.map(p => p.name).join(", ") : ""));
    w.exercises.forEach((e,i) =>
      L.push("  " + (i+1) + ". " + exInfo(e.id).n + (isUni(e.id) ? " (per side)" : "") + ": " + e.sets.map(s => (s.warm?"w:":"")+(s.w? s.w+"×"+s.r : s.r+" reps")).join(", ")));
    if (w.cardio) L.push("  cardio: incline treadmill " + w.cardio.min + " min");
    if (w.note) L.push("  note: " + w.note);
  }
  if (!list.length) L.push("  (none yet)");
  return L.join("\n");
}

/* ================= events ================= */
document.addEventListener("click", ev => {
  const reg = ev.target.closest && ev.target.closest("[data-region]");
  if (reg && heatData){
    const r = reg.dataset.region, v = heatData.per[r] || 0;
    const top = Object.entries(heatData.contrib[r] || {}).sort((a,b) => b[1]-a[1]).slice(0,3)
      .map(([n,c]) => n+" "+(Math.round(c*2)/2)).join(" · ");
    const el = $("#heat-detail");
    if (el) el.innerHTML = "<b>"+REGIONS[r]+"</b> — "+(Math.round(v*2)/2)+" hard sets"+(top ? "<br><span class='cap'>"+top+"</span>" : "");
    return;
  }
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act, ei = +btn.dataset.ei, si = +btn.dataset.si;
  const d = curDraft();

  if (act === "tab"){ tab = btn.dataset.tab; render(); }
  else if (act === "start"){
    const dd = S.drafts[todayStr()] || (S.drafts[todayStr()] = newDraft(todayStr()));
    delete dd.planned;
    dd.active = true; if (!dd.startedAt) dd.startedAt = Date.now();
    save(); render();
  }
  else if (act === "plan-tomorrow"){
    const ds = addDays(todayStr(), 1);
    const dr = S.drafts[ds] || (S.drafts[ds] = newDraft(ds));
    dr.planned = true; dr.active = true;
    S.editing = ds;
    save(); tab = "home"; render();
  }
  else if (act === "plan-done"){
    const ds = d.date;
    d.active = false; S.editing = null;
    save(); tab = "home"; render();
    showToast("Planned — it'll be waiting on Home "+(ds === addDays(todayStr(), 1) ? "tomorrow" : fmtDate(ds))+".");
  }
  else if (act === "pause"){ d.active = false; S.editing = null; save(); render(); }
  else if (act === "chk"){ toggleSet(ei, si); }
  else if (act === "warm"){
    const s = d.exercises[ei].sets[si]; s.warm = !s.warm; s.wMan = true; s.wAuto = false; save();
    const row = document.querySelector('.srow[data-ei="'+ei+'"][data-si="'+si+'"]');
    row.classList.toggle("warm", s.warm);
    row.querySelector(".snum").textContent = s.warm ? "W" : si+1;
  }
  else if (act === "addset"){
    d.exercises[ei].sets.push({w:"", r:"", done:false, warm:false}); save(); render();
  }
  else if (act === "rest-cycle"){
    const opts = [60,90,120,150,180,240];
    const id = d.exercises[ei].id, cur = restFor(id);
    const nxt = opts[(opts.indexOf(cur)+1) % opts.length] || 90;
    S.settings.restO[id] = nxt; save();
    btn.textContent = fmtSec(nxt);
  }
  else if (act === "ex-open"){
    d.exercises.forEach((x,j) => x.open = j === ei);
    save(); render();
    const el = document.querySelector('.xcard[data-ei="'+ei+'"]');
    if (el) el.scrollIntoView({block:"center", behavior:"smooth"});
  }
  else if (act === "ex-close"){ d.exercises[ei].open = false; save(); render(); }
  else if (act === "stab"){ d.exercises[ei].tabLast = btn.dataset.v === "last"; save(); render(); }
  else if (act === "uni-toggle"){
    const id = d.exercises[ei].id;
    S.uniO[id] = isUni(id) ? 0 : 1;
    save(); closeModal(); render();
    if (S.uniO[id]) showToast("Marked one side at a time — log the weight per side; totals count both.");
  }
  else if (act === "ex-menu"){ openExMenu(ei); }
  else if (act === "ex-detail"){ openExDetail(btn.dataset.exid); }
  else if (act === "note-ex"){
    const e = d.exercises[ei];
    openModal('<h3>Note — '+esc(exInfo(e.id).n)+'</h3>'
      + '<textarea id="exnote" rows="3" placeholder="e.g. seat at 4, wide grip">'+esc(e.note||"")+'</textarea>'
      + '<div class="btnrow"><button class="primary" data-act="note-save" data-ei="'+ei+'">Save</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
  }
  else if (act === "note-save"){
    d.exercises[ei].note = ($("#exnote").value||"").trim(); save(); closeModal(); render();
  }
  else if (act === "up" || act === "down"){
    const j = act === "up" ? ei-1 : ei+1;
    if (j < 0 || j >= d.exercises.length){ closeModal(); return; }
    [d.exercises[ei], d.exercises[j]] = [d.exercises[j], d.exercises[ei]];
    save(); closeModal(); render();
  }
  else if (act === "del-ex"){
    const e = d.exercises[ei];
    if (!e.sets.some(s => s.done) || confirm("Remove " + exInfo(e.id).n + " and its logged sets?")){
      d.exercises.splice(ei,1); save(); closeModal(); render();
    }
  }
  else if (act === "swap"){ openAddModal(ei); }
  else if (act === "add-ex"){ openAddModal(null); }
  else if (act === "modal-add"){
    d.exercises.forEach(x => x.open = false);
    d.exercises.push({id:btn.dataset.exid, plan:null, note:"", open:true, sets:setsFor(btn.dataset.exid)});
    save(); closeModal(); render();
  }
  else if (act === "modal-swap"){
    const e = d.exercises[+btn.dataset.ei];
    if (e.sets.some(s => s.done) && !confirm("Replacing clears this exercise's logged sets. Continue?")) return;
    e.id = btn.dataset.exid; e.sets = setsFor(e.id, e.plan ? e.plan.n : e.sets.length);
    save(); closeModal(); render();
  }
  else if (act === "create-ex"){
    const name = ($("#newexname").value||"").trim();
    if (!name){ alert("Give it a name."); return; }
    const id = "c_" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    S.custom[id] = {n:name, g:$("#newexgroup").value, inc:5};
    const sei = btn.dataset.ei;
    if (sei != null && sei !== ""){ const e = d.exercises[+sei]; e.id = id; e.sets = e.sets.map(() => ({w:"",r:"",done:false,warm:false})); }
    else { d.exercises.forEach(x => x.open = false);
      d.exercises.push({id, plan:null, note:"", open:true, sets:[{w:"",r:"",done:false,warm:false},{w:"",r:"",done:false,warm:false},{w:"",r:"",done:false,warm:false}]}); }
    save(); closeModal(); render();
  }
  else if (act === "modal-close"){ closeModal(); }
  else if (act === "finish"){
    const fdate = d.date;
    const prs = finishDraft(fdate, false);
    if (prs === false) return;
    clearInterval(tickInt);
    tab = "home"; render();
    const w = S.workouts.find(x => x.date === fdate);
    const rt = w && rateWorkout(w);
    let msg = rt ? "Session score <b class='grad-ink'>"+rt.score+" · "+rt.grade+"</b>" : "";
    if (prs.length) msg += (msg ? "<br>" : "") + "<b class='wr'>"+prs.length+" PR"+(prs.length>1?"s":"")+"</b> — "+prs.map(p => esc(p.name)).join(", ");
    if (lastAutoWarm) msg += (msg ? "<br>" : "") + '<span style="font-size:12.5px;color:var(--text-2)">'
      + lastAutoWarm+" light lead-in set"+(lastAutoWarm>1?"s":"")+" counted as warm-ups — tap a set number to change.</span>";
    const ton = S.workouts.reduce((a,x) => a + tonOf(x), 0);
    const hit = [1e5, 25e4, 5e5, 1e6, 2e6, 5e6].filter(m => m <= ton && m > S.milestone).pop();
    if (hit){ S.milestone = hit; save();
      msg += (msg ? "<br>" : "") + "<b class='grad-ink'>" + hit.toLocaleString() + " lb</b> lifted lifetime"; }
    if (msg) showToast(msg);
  }
  else if (act === "warmup-gen"){
    const e = d.exercises[ei], ex = exInfo(e.id);
    const a = analyze(e.id, e.plan);
    const w = +a.gW(0) || 0;
    if (!w){ closeModal(); showToast("No working weight yet — log this lift once first."); return; }
    const r5 = x => Math.max(ex.bb ? 45 : 5, Math.round(x/5)*5);
    const rows = ex.bb ? [[45,10],[r5(w*0.6),5],[r5(w*0.8),3]] : [[r5(w*0.5),12],[r5(w*0.75),6]];
    const seen = new Set();
    const warm = rows.filter(([ww]) => ww < w && !seen.has(ww) && seen.add(ww))
      .map(([ww,rr]) => ({w:String(ww), r:String(rr), done:false, warm:true}));
    if (!warm.length){ closeModal(); showToast("Working weight is too light for warm-up ramps."); return; }
    e.sets = warm.concat(e.sets);
    save(); closeModal(); render();
  }
  else if (act === "tpl-save"){
    openTplModal(templateFromExercises(d.exercises),
      ((sesDef(d.session)||{}).name || "My workout") + " — mine");
  }
  else if (act === "tpl-from-hist"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (w) openTplModal(templateFromExercises(w.exercises), (w.sesName || "My workout") + " — mine");
  }
  else if (act === "tpl-go"){
    const name = ($("#tpl-name").value || "").trim();
    if (!name){ alert("Give it a name."); return; }
    const id = "t_" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24)
      + "-" + Math.floor(Math.random()*1e4);
    S.templates[id] = {name, plan: pendingTpl};
    pendingTpl = null;
    save(); closeModal(); render();
    showToast("Template saved — it's in the session picker on Home.");
  }
  else if (act === "tpl-rename"){
    const id = btn.dataset.id, t = S.templates[id];
    if (!t) return;
    openModal('<h3>Rename template</h3>'
      + '<div class="set-item"><span class="lbl">Template name</span>'
      + '<input id="tpl-newname" value="'+esc(t.name)+'" maxlength="40"></div>'
      + '<div class="btnrow"><button class="primary" data-act="tpl-rename-go" data-id="'+id+'">Save name</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
    setTimeout(() => { const i = $("#tpl-newname"); if (i){ i.focus(); i.select(); } }, 50);
  }
  else if (act === "tpl-rename-go"){
    const t = S.templates[btn.dataset.id];
    const name = ($("#tpl-newname").value || "").trim();
    if (!name){ alert("Give it a name."); return; }
    if (t){ t.name = name; save(); }
    closeModal(); render();
  }
  else if (act === "tpl-del"){
    if (confirm("Delete this template? Logged workouts that used it are unaffected.")){
      delete S.templates[btn.dataset.id]; save(); render();
    }
  }
  else if (act === "coach-key-save"){
    const k = ($("#coach-key").value || "").trim();
    if (!k){ alert("Paste your API key first."); return; }
    S.settings.apiKey = k; save(); render();
  }
  else if (act === "coach-chip"){ askCoach(btn.dataset.q); }
  else if (act === "coach-ask"){
    const q = ($("#coach-q").value || "").trim();
    if (!q) return;
    $("#coach-q").value = "";
    askCoach(q);
  }
  else if (act === "coach-clear"){
    if (confirm("Clear the coach conversation?")){ S.coach = []; save(); render(); }
  }
  else if (act === "past-workout"){ openPastModal(); }
  else if (act === "past-go"){
    const ds = $("#past-date").value;
    if (!ds || ds > todayStr()){ alert("Pick a date up to today."); return; }
    const ses = $("#past-ses").value;
    const existing = S.workouts.find(w => w.date === ds);
    if (existing && !confirm(fmtDate(ds)+" already has a saved workout — replace it?")) return;
    if (existing) S.workouts = S.workouts.filter(w => w.id !== existing.id);
    S.drafts[ds] = draftFromSession(ses === "custom" ? null : ses, ds);
    S.drafts[ds].active = true;
    S.editing = ds === todayStr() ? null : ds;
    save(); closeModal(); tab = "home"; render();
  }
  else if (act === "resume-old"){ S.editing = btn.dataset.date;
    S.drafts[btn.dataset.date].active = true; save(); render(); }
  else if (act === "save-old"){ finishDraft(btn.dataset.date, true); render(); }
  else if (act === "discard-old"){
    if (confirm("Discard the unfinished workout from " + fmtDate(btn.dataset.date) + "?")){
      delete S.drafts[btn.dataset.date]; save(); render();
    }
  }
  else if (act === "reopen"){
    const w = S.workouts.find(x => x.date === btn.dataset.date);
    if (w) openWorkoutDraft(w);
  }
  else if (act === "hist-toggle"){ $("#h-"+btn.dataset.id).classList.toggle("open"); }
  else if (act === "hist-del"){
    if (confirm("Delete this workout permanently?")){
      S.workouts = S.workouts.filter(w => w.id !== btn.dataset.id); save(); render();
    }
  }
  else if (act === "hist-edit"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (w) openWorkoutDraft(w);
  }
  else if (act === "hist-date"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    if (!w) return;
    openModal('<h3>Change date</h3>'
      + '<div class="set-item"><span class="lbl">This workout actually happened on…</span>'
      + '<input id="mv-date" type="date" value="'+w.date+'" max="'+todayStr()+'"></div>'
      + '<div class="btnrow"><button class="primary" data-act="hist-date-go" data-id="'+w.id+'">Move it</button>'
      + '<button data-act="modal-close">Cancel</button></div>');
  }
  else if (act === "hist-date-go"){
    const w = S.workouts.find(x => x.id === btn.dataset.id);
    const nd = $("#mv-date") ? $("#mv-date").value : "";
    if (!w || !nd || nd > todayStr()){ alert("Pick a date up to today."); return; }
    if (nd !== w.date && S.workouts.some(x => x.date === nd)){
      alert(fmtDate(nd)+" already has a workout — edit or delete that one first."); return;
    }
    w.date = nd; save(); closeModal(); render();
  }
  else if (act === "recap-dismiss"){ S.recapSeen = weekStart(todayStr()); save(); render(); }
  else if (act === "ci-save" || act === "ci-edit"){
    if (act === "ci-edit"){
      delete S.body.weights[todayStr()]; delete S.body.kcals[addDays(todayStr(),-1)];
      save(); render(); return;
    }
    const w = +($("#ci-w").value || 0), k = +($("#ci-k").value || 0);
    const sl = +($("#ci-s").value || 0), en = +($("#ci-e").value || 0);
    if (w > 0) S.body.weights[todayStr()] = w;
    if (k > 0) S.body.kcals[addDays(todayStr(),-1)] = k;
    if (sl > 0 && sl <= 16) S.body.sleep[todayStr()] = sl;
    if (en >= 1 && en <= 5) S.body.energy[todayStr()] = en;
    if (!(w > 0) && !(k > 0) && !(sl > 0) && !en) return;
    save(); render();
  }
  else if (act === "ms-open"){ openMeasModal(); }
  else if (act === "ms-save"){
    const m = {};
    for (const [f, id] of [["waist","#ms-waist"],["arm","#ms-arm"],["thigh","#ms-thigh"]]){
      const v = +($(id).value || 0); if (v > 0) m[f] = v;
    }
    if (!Object.keys(m).length){ alert("Enter at least one measurement."); return; }
    S.body.meas[todayStr()] = Object.assign({}, S.body.meas[todayStr()] || {}, m);
    save(); closeModal(); render();
    showToast("Logged — the waist chart lives in Trends → Body.");
  }
  else if (act === "backup-later"){ S.backupSnooze = todayStr(); save(); render(); }
  else if (act === "score-why"){ openScoreModal(btn.dataset.id); }
  else if (act === "goto-trends"){ tab = "trends"; S.trendTab = "body"; render(); }
  else if (act === "goto-insights"){ tab = "trends"; S.trendTab = "ins"; render(); }
  else if (act === "goto-history"){ tab = "history"; render(); }
  else if (act === "ttab"){ S.trendTab = btn.dataset.t; save(); render(); }
  else if (act === "lab-group"){ labGroup = btn.dataset.g; render(); }
  else if (act === "range"){ S.range = +btn.dataset.r; save(); render(); }
  else if (act === "t-adj"){
    const dd = S.drafts[S.editing || todayStr()];
    if (dd && dd.timer){ dd.timer.end += (+btn.dataset.d)*1000; save(); syncTimerUI(); }
  }
  else if (act === "t-skip"){
    const dd = S.drafts[S.editing || todayStr()];
    if (dd){ dd.timer = null; save(); } syncTimerUI();
  }
  else if (act === "copy-claude"){
    const txt = claudeText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => { btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy for Claude", 1500); })
      .catch(() => { prompt("Copy this:", txt); });
  }
  else if (act === "export"){
    S.lastBackup = todayStr(); save();
    // never write the API key into a backup file — it gets emailed/shared between devices
    const dump = Object.assign({}, S, {settings: Object.assign({}, S.settings, {apiKey:""})});
    const blob = new Blob([JSON.stringify(dump, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "liftlog-backup-" + todayStr() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    if (tab === "home") render();
  }
  else if (act === "import"){ $("#importfile").click(); }
  else if (act === "reset"){
    if (confirm("Erase ALL LiftLog data?") && confirm("Really? This cannot be undone.")){
      localStorage.removeItem(KEY); location.reload();
    }
  }
});

document.addEventListener("change", ev => {
  const t = ev.target;
  if (/^st-/.test(t.id)) showToast("Saved ✓");
  if (t.id === "session-sel"){
    const dd = S.drafts[todayStr()];
    if (draftHasData(dd) && !confirm("Changing the session resets logged sets. Continue?")){
      t.value = dd.session || "custom"; return;
    }
    S.drafts[todayStr()] = draftFromSession(t.value === "custom" ? null : t.value, todayStr());
    save(); render();
  }
  else if (t.id === "plan-ses"){
    const d0 = curDraft(), ds = d0.date;
    if (draftHasData(d0) && !confirm("Changing the session resets this plan. Continue?")){
      t.value = d0.session || "custom"; return;
    }
    const nd = draftFromSession(t.value === "custom" ? null : t.value, ds);
    nd.planned = true; nd.active = true;
    S.drafts[ds] = nd; save(); render();
  }
  else if (t.id === "plan-date"){
    const d0 = curDraft(), old = d0.date, nv = t.value;
    if (!nv || nv <= todayStr()){
      alert("Pick a date after today — for today or earlier, log it as a workout instead.");
      t.value = old; return;
    }
    if (nv === old) return;
    if (S.drafts[nv] && draftHasData(S.drafts[nv])
        && !confirm(fmtDate(nv)+" already has an unfinished draft — replace it?")){
      t.value = old; return;
    }
    delete S.drafts[old];
    d0.date = nv; S.drafts[nv] = d0; S.editing = nv;
    save(); render();
  }
  else if (t.id === "cardio-on"){ curDraft().cardio.on = t.checked; save(); }
  else if (t.id === "cardio-min"){ curDraft().cardio.min = Math.max(0, +t.value||0); save(); }
  else if (t.id === "prog-sel"){ S.progSel = t.value; save(); render(); }
  else if (t.id === "st-kcal"){ S.settings.kcalTarget = Math.max(0, +t.value||0) || 2510; save(); }
  else if (t.id === "st-goal"){ S.settings.goalWeight = t.value; save(); }
  else if (t.id === "st-rest"){ S.settings.restDefault = Math.max(15, +t.value||90); save(); }
  else if (t.id === "st-sound"){ S.settings.sound = t.checked; save(); }
  else if (t.id === "st-vib"){ S.settings.vibrate = t.checked; save(); }
  else if (t.id === "st-sex"){ S.settings.sex = t.value; save(); }
  else if (t.id === "st-height"){ S.settings.height = t.value; save(); }
  else if (t.id === "st-clock"){ S.settings.showClock = t.checked; save(); }
  else if (t.id === "st-chk"){ S.settings.checkOff = t.checked; save(); render(); }
  else if (t.id === "st-age"){ S.settings.age = Math.max(14, Math.min(99, +t.value||30)); save(); }
  else if (t.id === "st-bf"){ S.settings.bodyFat = t.value; save(); }
  else if (t.id === "st-cardiok"){ S.settings.cardioKcal = Math.max(0, +t.value||7.8); save(); }
  else if (t.id === "st-apikey"){ S.settings.apiKey = t.value.trim(); save(); }
  else if (t.id === "importfile"){
    const f = t.files[0]; if (!f) return;
    f.text().then(txt => {
      try {
        const data = JSON.parse(txt);
        if (!Array.isArray(data.workouts)) throw 0;
        const keptKey = S.settings.apiKey;
        S = Object.assign({drafts:{},custom:{},templates:{},coach:[],milestone:0,uniO:{},body:{weights:{},kcals:{}},progSel:null,editing:null,trendTab:"body",range:30,recapSeen:""}, data);
        S.settings = Object.assign({}, DEF_SET, data.settings||{});
        if (!S.settings.apiKey) S.settings.apiKey = keptKey; // backups don't carry the key
        S.body = Object.assign({weights:{},kcals:{},meas:{},sleep:{},energy:{}}, S.body||{});
        S.uniO = S.uniO || {};
        save(); alert("Restored " + S.workouts.length + " workouts."); render();
      } catch(e){ alert("That file doesn't look like a LiftLog backup."); }
    });
  }
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.classList.contains("w") || t.classList.contains("r")){
    const d = curDraft(), e = d.exercises[+t.dataset.ei];
    if (!e) return;
    const s = e.sets[+t.dataset.si];
    if (t.classList.contains("w")){
      s.w = t.value;
      if (t.value !== "")
        e.sets.forEach((s2, j) => {
          if (j > +t.dataset.si && !s2.done && s2.w === ""){
            const inp = document.querySelector('.srow[data-ei="'+t.dataset.ei+'"][data-si="'+j+'"] .w');
            if (inp) inp.placeholder = t.value;
          }
        });
    } else {
      s.r = t.value;
      if (!S.settings.checkOff){
        const total = d.exercises.reduce((a,x) => a + x.sets.length, 0);
        const doneN = d.exercises.reduce((a,x) => a + x.sets.filter(u => +u.r > 0).length, 0);
        const sc = $("#setcount"); if (sc) sc.textContent = doneN+"/"+total;
      }
    }
    save();
    liveWarmSoon(+t.dataset.ei);
  }
  else if (t.id === "wnote"){ curDraft().note = t.value; save(); }
});
document.addEventListener("focusin", ev => {
  const t = ev.target;
  if (t.tagName === "INPUT" && (t.classList.contains("w") || t.classList.contains("r"))){
    t.select();
    setTimeout(() => { try { t.scrollIntoView({block:"center", behavior:"smooth"}); } catch(e){} }, 250);
  }
});
document.addEventListener("pointerover", ev => {
  const c = ev.target.closest && ev.target.closest(".pt");
  const tip = $("#ctip");
  if (!tip) return;
  if (!c){ tip.style.display = "none"; return; }
  tip.innerHTML = "<b>" + fmtDate(c.dataset.d) + "</b><br>" + c.dataset.v + (c.dataset.l ? " · " + c.dataset.l : "");
  tip.style.display = "block";
  const wrap = c.closest(".chartwrap").getBoundingClientRect();
  let x = ev.clientX - wrap.left + 12, y = ev.clientY - wrap.top - 34;
  if (x > wrap.width - 140) x -= 160;
  tip.style.left = x + "px"; tip.style.top = Math.max(0, y) + "px";
});
$("#ovl").addEventListener("click", ev => { if (ev.target.id === "ovl") closeModal(); });

/* ===== drag-to-reorder exercises (grip handles) ===== */
let drag = null;
function dragEnd(commit){
  if (!drag) return;
  drag.card.classList.remove("dragging");
  if (commit && drag.moved){
    const d = S.drafts[S.editing || todayStr()];
    if (d){
      const order = [...document.querySelectorAll(".xcard")].map(c => +c.dataset.ei);
      d.exercises = order.map(i => d.exercises[i]);
      save();
      const sy = window.scrollY;
      render();
      window.scrollTo(0, sy);
    }
  } else if (drag.moved) render();
  drag = null;
}
document.addEventListener("pointerdown", ev => {
  const grip = ev.target.closest && ev.target.closest("[data-grip]");
  if (!grip) return;
  const card = grip.closest(".xcard");
  const d = S.drafts[S.editing || todayStr()];
  if (!card || !d || !d.active) return;
  ev.preventDefault();
  drag = {card, moved:false, id:ev.pointerId};
  card.classList.add("dragging");
  try { grip.setPointerCapture(ev.pointerId); } catch(e){}
});
document.addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  ev.preventDefault();
  drag.moved = true;
  const y = ev.clientY;
  if (y < 130) window.scrollBy(0, -14);
  else if (y > innerHeight - 130) window.scrollBy(0, 14);
  for (const c of document.querySelectorAll(".xcard")){
    if (c === drag.card) continue;
    const r = c.getBoundingClientRect();
    if (y > r.top && y < r.bottom){
      c.parentNode.insertBefore(drag.card, y < r.top + r.height/2 ? c : c.nextSibling);
      break;
    }
  }
});
document.addEventListener("pointerup", ev => { if (drag && ev.pointerId === drag.id) dragEnd(true); });
document.addEventListener("pointercancel", ev => { if (drag && ev.pointerId === drag.id) dragEnd(false); });

render();

/* PWA: register the service worker only when served over http(s) —
   the desktop file:// copy skips this. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
